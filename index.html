/* ---- need-based trade suggestion (one at a time, respin freely, auto-respins after accept) ---- */
function genSuggestion(){
  if(G.draftOrderYear!==G.year)computeDraftOrder();
  const ns=needsSurplus();
  const needs=ns.needs.slice();
  const surplusPos=new Set(ns.surplus.map(s=>s.split(' ')[0]));
  const mine=tbMine().filter(a=>a.val>=4);
  if(!mine.length)return null;
  const league=leagueAssets();
  const scoreGet=a=>{if(a.kind!=="player")return 0;let s=0;
    if(needs.some(np=>a.player.pos===np||canPlaySlot(a.player,np)))s+=3;
    if(a.player.ovr>=78||a.player.pot>=86)s+=1; return s;};
  const teams=[...G.ai].filter(t=>t.block&&t.block.length).sort(()=>Math.random()-0.5);
  for(const team of teams){
    let theirs=league.filter(a=>a.team===team.id);
    const cnt={};theirs.forEach(a=>{if(a.kind==="player")cnt[a.player.pos]=(cnt[a.player.pos]||0)+1;});
    const theirSurplus=new Set(Object.keys(cnt).filter(p=>cnt[p]>=2));
    let cands=theirs.filter(a=>a.kind==="player"&&a.val>=15&&scoreGet(a)>0);
    cands.sort((a,b)=>(scoreGet(b)+(theirSurplus.has(b.player.pos)?0.5:0))-(scoreGet(a)+(theirSurplus.has(a.player.pos)?0.5:0))||b.val-a.val);
    if(!cands.length)continue;
    const get=[cands[ri(0,Math.min(2,cands.length-1))]];
    let factor=1.0;
    if(Math.random()<0.25){const fillsNeed=needs.some(np=>get[0].player.pos===np||canPlaySlot(get[0].player,np));factor=fillsNeed?rnd(0.86,0.98):rnd(1.03,1.15);}
    const need=Math.max(1,get[0].val*factor);
    // assemble a give package that matches `need` closely (slight surplus-position preference)
    const surplusBonus=a=>(a.kind==="player"&&surplusPos.has(a.player.pos))?6:0;
    const giveable=mine.filter(a=>a.aid!==get[0].aid);
    const give=[];let v=0,cand=giveable.slice(),guard=0;
    while(v<need*0.95&&give.length<3&&cand.length&&guard++<8){
      let best=null,bg=1e9;
      for(const a of cand){const nv=v+a.val;const gap=(nv>=need?(nv-need)*0.55:(need-nv))-surplusBonus(a);if(gap<bg){bg=gap;best=a;}}
      if(!best)break;give.push(best);v+=best.val;cand.splice(cand.indexOf(best),1);}
    if(!give.length||v<need*0.8)continue;
    const fills=needs.find(np=>get[0].player.pos===np||canPlaySlot(get[0].player,np));
    const reason=`${teamShortOf(team.id)} offers ${get[0].player.pos} ${get[0].player.name}${fills?` — fills your need at ${fills}`:''}${surplusPos.size?`; they'll take from your surplus (${[...surplusPos].slice(0,2).join("/")})`:''}.`;
    return {team:team.id,get,give,reason};
  }
  return null;
}
function renderSuggestion(){
  if(!_sugg)_sugg=genSuggestion();
  if(!_sugg)return `<p class="muted small">No clean fit right now. <button class="btn sm" onclick="respinSuggestion()">↻ Respin</button></p>`;
  const s=_sugg,gv=s.give.reduce((n,a)=>n+a.val,0),gt=s.get.reduce((n,a)=>n+a.val,0);
  const tag=gv<=gt*0.93?'<span class="pill green">you win</span>':gv>=gt*1.07?'<span class="pill red">they win</span>':'<span class="pill gold">fair</span>';
  return `<p class="sub" style="margin-bottom:8px">${s.reason}</p>
    <div class="grid2">
      <div><div class="small give" style="font-weight:700;margin-bottom:4px">▼ YOU SEND &nbsp;${gv}</div>${s.give.map(tbCard).join("")}</div>
      <div><div class="small get" style="font-weight:700;margin-bottom:4px">▲ YOU GET &nbsp;${gt}</div>${s.get.map(tbCard).join("")}</div>
    </div>
    <div style="text-align:center;margin-top:9px">${tag} <button class="btn primary" onclick="acceptSuggestion()">Accept</button> <button class="btn" onclick="respinSuggestion()">↻ Respin</button></div>`;
}
function respinSuggestion(){_sugg=genSuggestion();const el=document.getElementById('suggbox');if(el)el.innerHTML=renderSuggestion();}
function acceptSuggestion(){
  if(!_sugg)return;const s=_sugg;
  const give=s.give.map(a=>tbFind(a.aid)).filter(Boolean),get=s.get.map(a=>tbFind(a.aid)).filter(Boolean);
  if(give.length!==s.give.length||get.length!==s.get.length){toast("Offer expired — respinning");respinSuggestion();return;}
  give.forEach(giveAsset);get.forEach(getAsset);
  const sh=teamShortOf(s.team);_sugg=null;
  showBreaking(`${G.teamName} strike a deal with ${sh}`,_dlMode?'A deadline move — the town holds its breath.':'The clubhouse takes notice.');if(_dlMode)screenDeadline();else screenTrade();}

function contractCell(p){return `<span class="yrs ${p.years<=1?'exp':'muted'}">$${p.salary}M • ${p.years}yr${p.years<=1?' ⚠':''}</span>`;}
function duraTag(p){if(p.dura==null)return '';

function strengthWeakTags(p){

  return out.length?' '+out.join(''):'';
}

  LINEUP.forEach(s=>{if(a.lineup[s])G.lineupSet[s]=a.lineup[s].id;});

function moveToSlot(id,slot){const p=G.roster.find(x=>x.id===id);if(!p)return false;
  if(!eligibleForSlot(p,slot)){toast(`${p.name} can't play ${slotRole(slot)}`);return false;}
  ensureManual();
  const occ=G.lineupSet[slot];
  // only a VALID, still-rostered occupant counts — clear stale ids (traded/sent-down players) so the slot is usable
  const occValid=occ&&occ!==id&&G.roster.some(x=>x.loc==="mlb"&&x.id===occ);
  if(occ&&!occValid&&occ!==id)delete G.lineupSet[slot];
  if(occValid){toast("That slot's taken — bench its player first");return false;}
  Object.keys(G.lineupSet).forEach(s=>{if(G.lineupSet[s]===id)delete G.lineupSet[s];});
  G.lineupSet[slot]=id;saveGame();return true;}

function openSlotFor(p){
  if(!p||p.loc!=="mlb")return null;

  const isEmpty=s=>ROT_SLOTS.includes(s)?!a.rotation[ROT_SLOTS.indexOf(s)]:PEN_SLOTS.includes(s)?!a.pen[PEN_SLOTS.indexOf(s)]:!a.lineup[s];
  const open=[...LINEUP,...ROT_SLOTS,...PEN_SLOTS].filter(s=>eligibleForSlot(p,s)&&isEmpty(s));
  if(!open.length)return null;
  return open.find(s=>s===p.pos||slotRole(s)===p.pos)||open[0];

function computeDeadlineStances(){
  const arr=G.ai.map(t=>({t,w:warToWins(t.war)}));
  arr.sort((a,b)=>b.w-a.w);
  const N=arr.length, buyN=Math.round(N*0.40), sellStart=Math.round(N*0.60);   // top ~40% buy, bottom ~40% sell
  arr.forEach((e,i)=>{ e.t._stance = i<buyN?'buyer':(i>=sellStart?'seller':'neutral'); });
  const meW=warToWins(teamWAR(G.roster));
  const ws=arr.map(e=>e.w).concat(meW).sort((a,b)=>b-a);
  const NT=ws.length, bi=Math.round(NT*0.40)-1, si=Math.round(NT*0.60);
  G._myStance = meW>=ws[clamp(bi,0,NT-1)]?'buyer':(meW<=ws[clamp(si,0,NT-1)]?'seller':'neutral');
}
function dlThreshold(partnerId,give,get){
  // returns the minimum (you send)/(you get) value ratio the partner will accept.
  // Baseline 1.0 means EXACT value is always accepted; stances only ever LOWER it
  // (a desperate team accepts a deal that tilts further against them) — never above 1.0.
  const team=G.ai.find(t=>t.id===partnerId); if(!team)return 1.0;
  const stance=team._stance||'neutral';
  const isWinNow=a=>a.kind==="player"&&a.player.ovr>=72&&!a.player.prospect;
  const isYouth=a=>a.kind==="pick"||(a.kind==="player"&&(a.player.prospect||a.player.age<=24));
  const isExpiring=a=>a.kind==="player"&&(a.player.years||0)<=1&&a.player.ovr>=66;
  const frac=(arr,fn)=>{const t=arr.reduce((s,a)=>s+a.val,0)||1;return arr.filter(fn).reduce((s,a)=>s+a.val,0)/t;};
  let thr=1.0;
  if(stance==="buyer"){ thr-=0.22*frac(give,isWinNow); }           // overpays to land your big-league talent
  else if(stance==="seller"){ thr-=0.20*frac(give,isYouth); thr-=0.10*frac(get,isExpiring); }  // dumps rentals for youth
  return clamp(thr,0.68,1.0);
}
// A win-now buyer will eat an absolute overpay (in trade-value points) to land current MLB talent,
// scaled by how much better the player they GET is than the prospect they GIVE UP (current OVR gap).
// e.g. they receive an 80 OVR bigleaguer for a 65 OVR prospect (gap 15) -> tolerate ~7 of overpay;
//      75 for 70 (gap 5) -> ~3;  90 for 55 (gap 35) -> capped at 12.
function dlBuyerTolerance(team,give,get){
  if(!team||team._stance!=='buyer')return 0;
  const mlbIn=give.filter(a=>a.kind==="player"&&!a.player.prospect&&(a.player.mlbYears||0)>0)
                  .reduce((m,a)=>Math.max(m,a.player.ovr),0);
  const proOut=get.filter(a=>a.kind==="player"&&(a.player.prospect||(a.player.mlbYears||0)===0))
                  .reduce((m,a)=>Math.max(m,a.player.ovr),0);
  if(!mlbIn||!proOut)return 0;
  const gap=mlbIn-proOut; if(gap<=0)return 0;
  return Math.min(12,Math.round(gap*0.4)+1);
}
function dlAccept(partnerId,give,get){
  const gv=give.reduce((s,a)=>s+a.val,0),gt=get.reduce((s,a)=>s+a.val,0);
  if(gt<=0)return false;
  if(gv>=gt*dlThreshold(partnerId,give,get))return true;       // ratio rule (exact value always passes)
  const tol=dlBuyerTolerance(G.ai.find(t=>t.id===partnerId),give,get);
  return gv>=gt-tol;                                            // desperate buyer eats an absolute overpay
}

const AWARD_PTS={MVP:6,"Cy Young":5,ROY:4};
function computeAwards(){
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  const best=arr=>arr.length?arr.map(p=>({p,r:seasonRating(p)})).sort((a,b)=>b.r-a.r)[0]:null;
  const mk=(name,cand,bar)=>{const won=!!(cand&&cand.r>=bar);
    return {name,won,player:won?cand.p:null,leagueName:won?null:ficName(),leagueTeam:won?null:(pick(G.ai)||{}).name||"a rival club"};};
  return {
    roy:mk("ROY", best(mlb.filter(isRookieNow)), gauss(2.7,0.6)),
    cy :mk("Cy Young", best(mlb.filter(p=>p.pos==="SP")), gauss(4.2,0.6)),

function teamReportCard(){

function ownerRecalc(){

  return 'rebuild';

// ---------- the Owner's Suite: spend your cash to upgrade the club whenever you can afford it ----------
function ownerSuite(){
  G.ownerStage='suite';G.phase=0;
  genSponsorOffers();saveGame();
  const o=G.owner,cash=o.cashReserve||0;
  const owUp=new Set(o.ownedUpgrades||[]),owFac=new Set(o.ownedFacilities||[]);
  const item=(it,can,onclick,tags)=>`<div class="panel2" style="border:1.5px solid ${can?'var(--line)':'#333'};border-radius:10px;padding:10px;margin-bottom:7px;${can?'':'opacity:.5'}">
      <div class="row" style="align-items:flex-start;justify-content:space-between;gap:10px">
        <div style="flex:1"><div style="font-weight:700">${it.name}</div><p class="small muted" style="margin:2px 0 4px">${it.desc}</p>${tags?`<div class="small">${tags}</div>`:''}</div>
        <div style="text-align:right;min-width:84px"><div style="font-weight:800">${fmtB(it.cost)}</div>
          <button class="btn primary sm" style="margin-top:5px" ${can?'':'disabled'} onclick="${onclick}">Buy</button></div></div></div>`;
  const upTags=u=>[u.fan?`📣 +${u.fan}`:'',u.rev?`💵 ${'★'.repeat(Math.round(u.rev*2))||'·'}`:'',u.cap?`🎟️ ${u.cap>0?'+':''}${u.cap}`:''].filter(Boolean).join(' &nbsp; ');
  const facTags=f=>[f.dev?'📈 dev':'',f.heal?'🏥 health':'',f.farm?'🌱 farm':'',f.happy?'😊 morale':'',f.coach?'🎓 staff':''].filter(Boolean).join(' &nbsp; ');
  const upH=STADIUM_UPGRADES.filter(u=>!owUp.has(u.id)).map(u=>item(u,u.cost<=cash,`suiteBuyUpgrade('${u.id}')`,upTags(u))).join("")||'<p class="small muted">Every ballpark upgrade is built. 🏟️</p>';
  const facH=FACILITY_OPTS.filter(f=>!owFac.has(f.id)).map(f=>item(f,f.cost<=cash,`suiteBuyFacility('${f.id}')`,facTags(f))).join("")||'<p class="small muted">Every facility is funded. 🏋️</p>';
  // staff tier-ups (pay the one-time difference; annual salary rises with the tier)
  const staffRow=(kind,label,tiers,cur)=>{const next=cur+1;if(next>=tiers.length)return `<div class="small muted" style="margin:4px 0">${label}: <b>${tiers[cur].name}</b> — maxed ★★★★</div>`;
    const diff=Math.max(1,tiers[next].cost-tiers[cur].cost),can=diff<=cash;
    return `<div class="panel2" style="border:1px solid ${can?'var(--line)':'#333'};border-radius:9px;padding:9px;margin-bottom:6px;${can?'':'opacity:.5'}">
      <div class="row" style="align-items:center;justify-content:space-between;gap:8px">
        <div style="flex:1"><div class="small"><b>${label}</b>: ${tiers[cur].name} → <b style="color:var(--gold)">${tiers[next].name}</b></div>
          <div class="small muted">${tiers[next].desc}</div></div>
        <div style="text-align:right"><div style="font-weight:700">${fmtB(diff)}</div><button class="btn primary sm" ${can?'':'disabled'} onclick="suiteUpgradeStaff('${kind}',${next})">Upgrade</button></div></div></div>`;};

const POSALL=["C","1B","2B","3B","SS","LF","CF","RF","DH","SP","SP","RP"];
let _dq=null,_dpicks=null,_board=null;
function screenDraft(){
  if(!_dq){_dq=[...G.ownedPicks].sort((a,b)=>(a.round-b.round)||(pickResolvedSlot(a)-pickResolvedSlot(b)));_dpicks=[];_board=null;_dfl=null;}
  if(!_dq.length)return draftDone();
  const pk=_dq[0],slot=pickResolvedSlot(pk),rd=pk.round||1;
  // Survivor: fixed per-round odds, identical every year (no "draft MLB-ready late in a short rebuild" scaling).
  // 6-Year mode keeps the year-aware curve (you draft for readiness as the clock runs out).
  const advChance = G.mode==="survivor"
    ? ({1:0.08,2:0.15,3:0.22,4:0.30,5:0.38}[rd]||0.2)
    : (rd>=3?(G.year>=4?0.75:0.5):rd===2?(G.year>=4?0.6:0.3):(G.year>=4?0.5:G.year===3?0.25:0.08));
  if(!_board){
    const ps=[...POSALL];for(let i=ps.length-1;i>0;i--){const j=ri(0,i);[ps[i],ps[j]]=[ps[j],ps[i]];}
    const nOpts=G.owner?10:8;
    _board=[];for(let i=0;i<nOpts;i++)_board.push(draftee(slot,rd,Math.random()<advChance,ps[i%ps.length]));
    if(!G.owner){
      const t=draftTier();
      _board.forEach(p=>{
        if(t===3){const lo=clamp(p.pot-ri(1,4),40,94);p._sc={lo,hi:lo+5};}
        else if(t===2){const lo=clamp(p.pot-ri(2,13),30,84);p._sc={lo,hi:lo+15};}
      });
      _dfl={flipped:[],left:t>=4?_board.length:t===3?5:4,tier:t};
    }
  }
  // Owner Mode: the GM recommends a pick (best ceiling, weighted toward roster needs + his scouting tier)
  if(G.owner){G.ownerStage='draft';
    const ns=needsSurplus();const want=new Set(ns.needs);const tier=G.owner.gmTier||0;
    let best=0,bestScore=-1;_board.forEach((p,i)=>{const s=p.pot+(want.has(p.pos)?7:0)+(p.advanced?2:0)+tier*0.5+Math.random()*1.5;if(s>bestScore){bestScore=s;best=i;}});
    G._gmRec=best;
    if(G._gmAutoDraft)return draftPick(best);
  }
  const rec=G.owner?G._gmRec:-1;
  if(!G.owner){
    const t=_dfl.tier,pct=draftScoutPct();
    render(`${header()}${stepbar(3)}
     ${(function(){const ns=needsSurplus();return `<div class="panel2" style="border:1px solid var(--line);border-radius:4px;padding:10px;margin:12px 0">
       <span class="small"><b style="color:var(--red)">Needs:</b> ${ns.needs.length?ns.needs.join(", "):'<span class="muted">none</span>'} &nbsp;•&nbsp; <b style="color:var(--green)">Surplus:</b> ${ns.surplus.length?ns.surplus.join(", "):'<span class="muted">none</span>'}</span></div>`;})()}
     <div class="panel" style="padding:14px">
       <h3 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${ico('scope',18)} Draft — <span class="pill gold">${pk.comp?'🎟️ Comp Pick':'Round '+rd+' · Pick #'+slot}</span> <span class="small muted">(${_dq.length} selection${_dq.length>1?'s':''} left)</span></h3>
       <p class="sub" style="margin:4px 0 2px">${ico('binoc',13)} <b>Scouting dept at ${pct}%</b> — ${DRAFT_TIER_DESC[t]}.</p>
       <p class="sub" style="margin:2px 0 10px">${_dfl.left>0?`<b style="color:var(--gold)">${_dfl.left} scouting trip${_dfl.left>1?'s':''} left</b> — flip the files you want opened, then draft one of them.`:`<b style="color:var(--amber)">Trips exhausted</b> — draft from the opened files. Ceiling is a projection, not a promise.`}</p>
       ${draftCardsHTML()}
     </div>
     <details class="deskp" ontoggle="fmSolo(this)">
       <summary><span class="dic">${ico('clip',20)}</span><div class="dtx"><b>Clipboard — current roster</b><span>draft to fill your needs</span></div><span class="dgo">▸</span></summary>
       <div class="dbody">${rosterMini()}</div>
     </details>`);
    return;
  }
  render(`${header()}${stepbar(3)}
   ${(function(){const ns=needsSurplus();return `<div class="panel2" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin:12px 0">
     <span class="small"><b style="color:var(--red)">Needs:</b> ${ns.needs.length?ns.needs.join(", "):'<span class="muted">none — roster is balanced</span>'} &nbsp;•&nbsp; <b style="color:var(--green)">Surplus:</b> ${ns.surplus.length?ns.surplus.join(", "):'<span class="muted">none</span>'}</span></div>`;})()}
   ${G.owner?`<div class="panel2" style="border:1px solid var(--gold);border-radius:10px;padding:10px;margin-bottom:10px">
     <span class="small">🎯 <b>GM ${G.owner.gmName}</b> recommends <b style="color:var(--gold)">${_board[rec].name}</b> (${_board[rec].pos}, ceiling ${_board[rec].pot}). Take his pick, override below, or let him run the rest.</span>
     <div class="row" style="gap:8px;margin-top:8px"><button class="btn primary sm" onclick="draftPick(${rec})">✅ Take GM's pick</button>
       <button class="btn sm" onclick="(function(){G._gmAutoDraft=true;screenDraft();})()">⏩ Let the GM finish the draft</button></div></div>`:''}
   <details class="panel" style="padding:12px"><summary style="cursor:pointer;font-weight:700">📋 Current roster <span class="small muted">(draft to fill your needs)</span></summary>
     <div style="margin-top:8px">${rosterMini()}</div></details>
   <div class="panel"><h3>Draft — <span class="pill gold">${pk.comp?'🎟️ Comp Pick':'Round '+rd+' pick #'+slot}</span> <span class="small muted">(${_dq.length} selection${_dq.length>1?'s':''} left)</span></h3>
     <p class="sub">Ceiling is a <b>scouted projection, not a promise</b> — most prospects fall short of it. ${rd===1?'Round-1 talents have the highest ceilings but take years.':'Later-round picks are longer shots; "MLB-ready" types contribute sooner.'}</p>
     <div class="scroll">${_board.map((p,i)=>`<div class="offer" style="padding:9px 12px;${i===rec?'border:1px solid var(--gold);border-radius:8px':''}"><div class="row" style="align-items:center">
        <div style="flex:2"><b>${p.name}</b> ${i===rec?'<span class="pill gold" style="padding:0 5px;font-size:9px">GM PICK</span>':''} <span class="small muted">${p.college}</span>
          <span class="small"><span class="pos">${p.pos}</span> age ${p.age} • ${p.ovr} OVR ${p.advanced?'<span class="pill green" style="padding:0 6px">MLB-ready</span>':'<span class="pill blue" style="padding:0 6px">project</span>'}</span></div>
        <div style="flex:1;text-align:right"><span class="pill ${ceilClass(p.pot)}">Ceiling ${p.pot}</span>
          <button class="btn primary sm" onclick="draftPick(${i})">Draft</button></div></div></div>`).join("")}</div></div>`);
}

/* ---- scouting-driven draft cards: your scouting budget decides what the file shows ---- */
let _dfl=null;
function draftScoutPct(){const r=G.resources||{};return Math.round(((r.scouting!=null?r.scouting:0.334))*100);}
function draftTier(){const s=draftScoutPct();return s<10?0:s<30?1:s<50?2:s<75?3:4;}
const DRAFT_TIER_DESC=['bare files — hitter or pitcher, nothing more','position only','position, age, ceiling ±15','position, age, ceiling ±5 — and a 5th flip','full files — exact ceilings, flip everything'];
function draftFlip(i){
  if(!_dfl||_dfl.flipped.indexOf(i)>=0)return;
  if(_dfl.left<=0){toast('No scouting trips left — draft from the flipped files.');return;}
  _dfl.flipped.push(i);_dfl.left--;sfx('flip');
  screenDraft();
}
function draftCardsHTML(){
  const t=_dfl.tier;
  const dealing=!_dfl.dealt;
  if(dealing){_dfl.dealt=true;sfx('deal');}
  return `<div class="dgrid">${_board.map((p,i)=>{
    const dealCls=dealing?` dealin" style="animation-delay:${(i*0.09).toFixed(2)}s`:'';
    const flipped=_dfl.flipped.indexOf(i)>=0;
    if(flipped)return `<div class="dcard front"><div class="d-top"><span>${esc(p.pos)} · ${p.age}</span><b>${p.ovr}</b></div>
      <div class="d-name">${esc(p.name)}</div><div class="d-col">${esc(p.college||'')}</div>
      <div class="d-tags"><span class="pill ${ceilClass(p.pot)}">Ceil ${p.pot}</span>${p.advanced?'<span class="pill green">MLB-Ready</span>':'<span class="pill blue">Project</span>'}</div>
      <button class="btn primary sm" style="margin:4px 0 10px" onclick="draftPick(${i})">Draft ▸</button></div>`;
    const lines=[isPit(p)?'PITCHER':'HITTER'];
    if(t>=1)lines.push('POS '+p.pos);
    if(t>=2)lines.push('AGE '+p.age);
    if(t>=4)lines.push('CEILING '+p.pot);
    else if(t>=2&&p._sc)lines.push('CEIL '+p._sc.lo+'–'+p._sc.hi);
    return `<div class="dcard back ${_dfl.left>0?'can':'dead'}${dealCls}" onclick="draftFlip(${i})">
      <div class="d-file">${ico('binoc',15)}<br>PROSPECT FILE ${String(i+1).padStart(2,'0')}</div>
      <div class="d-lines">${lines.map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="d-hint">${_dfl.left>0?'TAP TO SCOUT':'FILE SEALED'}</div></div>`;
  }).join('')}</div>`;
}
function draftPick(i){
  if(!G.owner&&_dfl&&_dfl.flipped.indexOf(i)<0){toast('You can only draft an opened file.');return;}
  const p=_board[i];p.loc="farm";p.src="draft";G.farm.push(p);_dpicks.push(p);
  _board=null;_dfl=null;
  const pk=_dq[0]||{},rd=pk.round||1,slot=pickResolvedSlot(pk)||0;
  _dq.shift();
  if(G._gmAutoDraft){screenDraft();return;}
  draftReveal(p,rd,slot,()=>screenDraft());
}
/* ---- draft reveal ceremony — grand in round 1, fading to a toast by round 5 ---- */
function draftReveal(p,rd,slot,next){
  if(rd>=5){sfx('tap');toast(`R${rd}: Drafted ${p.name}`);next();return;}
  const old=document.getElementById('dfov');if(old)old.remove();
  const cardHTML=`<div class="dfcard ${rd===1?'r1':''}" id="dfcard" style="display:none">
      ${rd<=2?`<div class="dfstamp">ROUND ${rd} SELECTION</div>`:''}
      <div class="dfch"><span>${esc(p.pos)} · AGE ${p.age}</span><b>${p.ovr}</b></div>
      <div class="dfname">${esc(p.name)}</div>
      <div class="dfcol">${esc(p.college||'')}</div>
      <div class="dfrow"><span class="pill ${ceilClass(p.pot)}">Ceiling ${p.pot}</span>${p.advanced?'<span class="pill green">MLB-Ready</span>':'<span class="pill blue">Project</span>'}</div>

function computeGrade(){
  const h=G.history;
  const early=h.filter(x=>x.year<=2),late=h.filter(x=>x.year>=4);
  const earlyAvg=early.length?early.reduce((s,x)=>s+x.wins,0)/early.length:81;
  const peakLate=Math.max(0,...late.map(x=>x.wins));
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  const coreYoung=mlb.filter(p=>p.age<=27&&p.ovr>=80).length;
  const farmQ=G.farm.filter(p=>Math.min(p.realCeil||p.pot,p.pot)>=84).length;
  const windowYears=clamp(round(coreYoung*0.9+farmQ*0.6),0,8);
  const contrib=mlb.filter(p=>p.ovr>=74);
  const hg=contrib.filter(p=>p.src==="draft").length;
  const acq=contrib.filter(p=>p.src==="fa"||p.src==="trade").length;
  const faCount=contrib.filter(p=>p.src==="fa").length;
  const hgRatio=(hg+acq)>0?hg/(hg+acq):0;
  const maxPay=Math.round(G.maxPayroll||payroll(G.roster));
  const taxYears=G.taxYears||0;
  const weakSpots=G.weakSpotsTotal||0;
  const hit100By3=h.some(x=>x.year===3&&x.wins>=100);
  const hit100Late=h.some(x=>x.year>=4&&x.wins>=100);
  const items=[];let score=0;
  const add=(label,pts)=>{items.push({label,pts});score+=pts;};
  let pk=peakLate>=111?30:peakLate>=105?25:peakLate>=100?20:peakLate>=95?15:peakLate>=90?10:peakLate>=85?5:-5;
  add(`Peak of ${peakLate} wins in your contention window`,pk);
  if(G.champions>0)add(`${G.champions} World Series title${G.champions>1?'s':''}`,15+(G.champions-1)*10);
  else items.push({label:"Never won the World Series",pts:0});
  if(hit100By3)add("Contended early — hit 100 wins by Year 3",8);
  else if(hit100Late)add("Hit 100 wins in your contention window (Yrs 4–6)",5);
  if(G.playoffApps>0)add(`${G.playoffApps} playoff appearance${G.playoffApps>1?'s':''}`,Math.min(16,G.playoffApps*4));
  else items.push({label:"Never reached the postseason",pts:0});
  let tk=earlyAvg<=66?15:earlyAvg<=70?10:earlyAvg<=75?5:0;
  if(tk)add(`Committed to the tank early (avg ${Math.round(earlyAvg)} wins, yrs 1-2)`,tk);
  else items.push({label:`Didn't truly bottom out for premium picks (avg ${Math.round(earlyAvg)} wins early)`,pts:0});
  let hgPts=(hg>=3&&hgRatio>=0.6)?15:(hg>=2&&hgRatio>=0.5)?10:hgRatio>=0.4?6:hgRatio>=0.25?3:0;
  if(hgPts)add(`Homegrown core — ${hg} drafted contributor${hg>1?'s':''} (${Math.round(hgRatio*100)}% of acquired talent)`,hgPts);
  else items.push({label:`Built mostly through trades/free agency, not the draft (${hg} homegrown)`,pts:0});
  let wPts=windowYears>=5?15:windowYears>=3?9:windowYears>=1?4:-12;
  add(`${windowYears>=5?'Wide-open':windowYears>=3?'Healthy':windowYears>=1?'Closing':'Shut'} future window (~${windowYears} yr${windowYears===1?'':'s'} ahead)`,wPts);
  if(G.awardPoints>0){const log=G.awardsLog||[];const cnts={};log.forEach(x=>cnts[x.award]=(cnts[x.award]||0)+1);
    const summ=Object.keys(cnts).map(k=>`${cnts[k]}× ${k}`).join(", ");
    add(`Individual hardware — ${summ}`,G.awardPoints);}
  let payPen=G.hard?(maxPay>300?-18:maxPay>260?-12:maxPay>220?-6:0):(maxPay>320?-12:maxPay>280?-7:maxPay>240?-3:0);
  if(payPen)add(`Bloated payroll (peaked at $${maxPay}M)${G.hard?' — the Hard Mode owner runs lean':''}`,payPen);
  if(taxYears>0)add(`Paid the luxury tax in ${taxYears} season${taxYears>1?'s':''}`,(G.hard?-8:-5)*taxYears);
  if(faCount>=3)add(`Leaned on free-agent signings (${faCount} regulars)`,-(faCount-2)*3);
  if(weakSpots>0)add(`Fielded ${weakSpots} replacement-level/sub-70 OVR starting spot${weakSpots>1?'s':''} across Yrs 4–6`,(G.hard?-8:-5)*weakSpots);
  score=Math.max(0,round(score));        // uncapped — truly great runs can exceed 100 so the leaderboard can separate them
  const lg=clamp(score,0,100);           // the letter grade is still scored out of 100
  const grade=lg>=96?'A+':lg>=93?'A':lg>=90?'A-':lg>=86?'B+':lg>=83?'B':lg>=80?'B-':lg>=76?'C+':lg>=73?'C':lg>=69?'C-':lg>=66?'D+':lg>=63?'D':lg>=60?'D-':'F';
  let blurb;
  if(G.champions>=1&&peakLate>=100&&hgRatio>=0.5)blurb="The blueprint, executed to perfection — you tanked, drafted a homegrown core, and raised a banner. Front-office legend.";
  else if(G.champions>=1)blurb="You brought home a title. However you got there, the ring is the ring.";
  else if(peakLate>=95)blurb="You built a contender and knocked on the door — just couldn't break through in October.";
  else if(earlyAvg<=72&&peakLate<88)blurb="You tore it down but the rise never fully arrived. Too many picks missed, or you sold the future too cheap.";
  else blurb="A middling six years — never bad enough to stock elite picks, never good enough to truly contend.";
  const winTxt=windowYears>=5?"wide open":windowYears>=3?"open":windowYears>=1?"closing":"shut";
  return {score,grade,blurb,items,windowYears,winTxt,hg,maxPay};
}

function gradeRubric(){
  const P=[
    ["🏆 World Series titles","15 for your first ring, +10 for each one after","15, +10 ea"],
    ["📈 Peak wins (yrs 4–6)","best season once contending — 110+→30, 105→25, 100→20, 95→15, 90→10, 85→5","up to 30"],
    ["⚡ 100-win bonus","hit 100 wins by Year 3 →8; first reached in Yrs 4–6 →5","up to 8"],
    ["🎟️ Playoff appearances","4 pts for each October you reach","up to 16"],
    ["🏅 Player awards","+2 per award won, +1 more if the winner is homegrown","2–3 ea"],
    ["📉 Tanking early (yrs 1–2)","bottom out for premium picks — avg ≤66 W→15, ≤70→10, ≤75→5","up to 15"],
    ["🌱 Homegrown core","drafted regulars (74+ OVR) as a share of your real talent — 3+ & 60%→15, 2+ & 50%→10, 40%→6, 25%→3","up to 15"],
    ["🔭 Future window left","young, controllable core + farm at the finish — 5+ yrs→15, 3+→9, 1+→4","up to 15"],
  ];
  const N=[
    ["🕳️ Weak starting spots","−5 for every empty or sub-70 OVR starting spot, tallied at the end of each year in Yrs 4–6","−5 ea"],
    ["🔭 No future window","empty cupboard, nothing controllable left","−12"],
    ["💰 Bloated peak payroll","$320M+→−12, $280M+→−7, $240M+→−3","−12"],
    ["💸 Luxury tax","−5 for each season over the $300M line","−5 ea"],
    ["✍️ Free-agent reliance","−3 per FA regular beyond two","−3 ea"],
  ];

  return `<p class="sub">Six years, scored out of 100. The positives add up to far more than 100, so you can't — and don't need to — max them all. Chase the big tickets (a ring, a high peak, a homegrown core) and keep the books clean.</p>

    <div class="sectlbl">Letter grade</div>
    <div class="small">A+ 96+ &nbsp;·&nbsp; A 93–95 &nbsp;·&nbsp; A− 90–92 &nbsp;·&nbsp; B+ 86–89 &nbsp;·&nbsp; B 83–85 &nbsp;·&nbsp; B− 80–82 &nbsp;·&nbsp; C+ 76–79 &nbsp;·&nbsp; C 73–75 &nbsp;·&nbsp; C− 69–72 &nbsp;·&nbsp; D+ 66–68 &nbsp;·&nbsp; D 63–65 &nbsp;·&nbsp; D− 60–62 &nbsp;·&nbsp; F under 60</div>`;
}

/* ============================================================
   PLAYER PROFILE — XP, levels, unlocks, Create-A-Player
   (lives in its own localStorage key, so it persists across franchises)
   ============================================================ */
const PROFILE_KEY="tankCommander_profile_v1";
function loadProfile(){try{return Object.assign({xp:0,gamesPlayed:0,createdPlayer:null},JSON.parse(localStorage.getItem(PROFILE_KEY)||"{}"));}catch(e){return {xp:0,gamesPlayed:0,createdPlayer:null};}}
function saveProfile(){PROFILE.updated=Date.now();try{localStorage.setItem(PROFILE_KEY,JSON.stringify(PROFILE));}catch(e){}if(typeof cloudSync==="function")cloudSync();}
let PROFILE=loadProfile();
const MAX_LEVEL=30;
function levelOf(xp){return Math.min(MAX_LEVEL,1+Math.floor(Math.sqrt(Math.max(0,xp||0)/40)));}
function xpForLevel(L){return Math.pow(L-1,2)*40;}
function plLevel(){return levelOf(PROFILE.xp);}
function addXP(amt){PROFILE.xp=(PROFILE.xp||0)+Math.max(0,Math.round(amt));saveProfile();}
// unlocks by level
const POS_UNLOCK=[[2,"RF"],[3,"LF"],[4,"CF"],[5,"1B"],[6,"3B"],[7,"DH"],[8,"2B"],[9,"SS"],[10,"C"],[12,"SP"],[14,"RP"]];
function unlockedPositions(){const L=plLevel();return POS_UNLOCK.filter(u=>L>=u[0]).map(u=>u[1]);}
function attrPointsForLevel(){const L=plLevel();return L<2?0:clamp(Math.round(6+(L-2)*1.6),6,52);}
function allocMaxForLevel(){return clamp(Math.round(5+plLevel()*0.4),5,16);}
function ceilCapForLevel(){return clamp(Math.round(82+(plLevel()-2)*0.65),82,99);}
function capUnlocked(){return (PROFILE.gamesPlayed||0)>=1;}
function awardFranchiseXP(seasons,titles,bonus){
  const before=plLevel();
  addXP((seasons||0)*6+(titles||0)*15+(bonus||0));
  PROFILE.gamesPlayed=(PROFILE.gamesPlayed||0)+1;saveProfile();
  return {leveledUp:plLevel()>before,from:before,to:plLevel()};
}
function unlockNoteFor(r){if(!r||!r.leveledUp)return '';
  const np=POS_UNLOCK.filter(u=>u[0]>r.from&&u[0]<=r.to).map(u=>u[1]);
  return (np.length?`Unlocked ${np.join("/")} for your Created Player, plus `:`Earned `)+`more attribute points.`;}
function xpEndNotice(){
  if(!G._xpAwarded){let seasons,titles,bonus;
    if(G.owner){seasons=G.year||0;titles=G.champions||0;bonus=Math.round(Math.max(0,ownerNetProfit())/100);}   // Owner Mode XP: years owned, titles, profit
    else if(G.mode==="survivor"){seasons=G.yearsServed||0;titles=G.survTitles||0;bonus=Math.round((G.cumScore||0)/10);}
    else{seasons=(G.history?G.history.length:6);titles=G.champions||0;bonus=Math.round((computeGrade().score||0)/5);}
    G._xpRes=awardFranchiseXP(seasons,titles,bonus);
    // bWARfare card rewards: a franchise pack (tier by how you did) + a pack per level gained + Diamond Coins
    let qual;
    if(G.owner)qual=clamp(Math.round((G.champions||0)*16+Math.max(0,ownerNetProfit())/40),0,100);
    else if(G.mode==="survivor")qual=clamp(Math.round((G.cumScore||0)/12+(G.survTitles||0)*14),0,100);
    else qual=clamp(Math.round(computeGrade().score||0),0,100);
    G._bwRes=bwReward(G._xpRes.from,G._xpRes.to,qual);
    G._xpAwarded=true;try{saveGame();}catch(e){}}
  const r=G._xpRes||{},bwr=G._bwRes||{};
  return `<div class="panel center" style="border-color:var(--gold)">
    <div class="pill gold">🎖️ GM PROFILE</div>
    <p class="sub" style="margin:6px 0 0">${r.leveledUp?`<b style="color:var(--gold)">LEVEL UP → GM Level ${r.to}!</b> ${unlockNoteFor(r)}`:`You're GM Level ${plLevel()}.`}</p>
    ${PROFILE.gamesPlayed===1?'<div class="pill gold" style="margin-top:6px;display:inline-block">⭐ Create-A-Player unlocked on the main menu!</div>':''}
    ${bwr.packs?`<p class="small" style="margin:8px 0 0;color:var(--gold)">🎁 bWARfare: earned <b>${bwr.packs} pack${bwr.packs>1?'s':''}</b> + <b>💎 ${bwr.coins} Diamond Coins</b> — open them in <b>Platoon</b>.</p>`:''}
    <div style="max-width:380px;margin:8px auto 0">${xpPanel()}</div></div>`;
}
function xpPanel(){
  const L=plLevel(),xp=PROFILE.xp||0,cur=xpForLevel(L),next=xpForLevel(L+1);
  const pct=L>=MAX_LEVEL?100:clamp(Math.round((xp-cur)/(next-cur)*100),0,100);
  return `<div class="panel2" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>🎖️ GM Level ${L}</b><span class="small muted">${L>=MAX_LEVEL?'MAX':xp+' / '+next+' XP'}</span></div>
    <div class="favtrack" style="height:10px;margin-top:6px"><div class="favbar" style="width:${pct}%;background:var(--gold)"></div></div>
    <div class="small muted" style="margin-top:5px">Play franchises to earn XP and level up — unlocking more positions and attribute points for your Created Player.</div></div>`;
}

/* ---------- Create-A-Player ---------- */
const ATTR_BASE=64;   // every attribute starts here (peak value), points raise it
let _cap=null;   // working draft {name,pos,alloc,dawg}
function capDefaults(){return {name:"My Player",pos:"RF",alloc:{},dawg:0};}
function capAttrsFor(pos){return (pos==="SP"||pos==="RP")?PIT_ATTRS:HIT_ATTRS;}
function capSpent(){let s=0;const a=_cap.alloc||{};Object.keys(a).forEach(k=>s+=a[k]);return s+(_cap.dawg||0);}
function capPeak(d,k){return clamp(ATTR_BASE+((d.alloc||{})[k]||0)*5,ATTR_BASE,99);}   // attribute value at full development
function capBuild(d){   // turn a draft into a finished prospect template
  const keys=capAttrsFor(d.pos);
  const peakMean=keys.reduce((s,k)=>s+capPeak(d,k),0)/keys.length;
  const pot=clamp(Math.round(peakMean),64,ceilCapForLevel());   // ceiling = avg of your attribute peaks, capped by level
  const ovr=clamp(pot-22,30,74);
  const attr={};keys.forEach(k=>attr[k]=capPeak(d,k)-pot);   // store as offset so attribute hits its peak when fully developed
  const dawg=clamp(50+(d.dawg||0)*5,5,99);
  return {name:(d.name||"My Player").slice(0,20),pos:d.pos,age:20,ovr,pot,realCeil:pot,attr,dawg,
    createdLevel:plLevel(),custom:true};
}

function capSetPos(p){const wasPit=(_cap.pos==='SP'||_cap.pos==='RP'),nowPit=(p==='SP'||p==='RP');_cap.pos=p;if(wasPit!==nowPit)_cap.alloc={};screenCreatePlayer();}   // only reset attrs when switching between hitter and pitcher (different attribute pools)
function capAdj(k,d){const total=attrPointsForLevel(),amax=allocMaxForLevel();
  if(k==='dawg'){let v=(_cap.dawg||0)+d;if(v<0)v=0;if(v>amax)v=amax;const test=capSpent()-(_cap.dawg||0)+v;if(test>total&&d>0)return;_cap.dawg=v;}
  else{let v=(_cap.alloc[k]||0)+d;if(v<0)v=0;if(v>amax)v=amax;const test=capSpent()-(_cap.alloc[k]||0)+v;if(test>total&&d>0)return;_cap.alloc[k]=v;}
  screenCreatePlayer();}

  document.body.appendChild(ov);

function copyBackup(){const t=document.getElementById('savecode');if(!t)return;t.select();
  try{navigator.clipboard.writeText(t.value);}catch(e){try{document.execCommand('copy');}catch(_){}}
  toast("Backup code copied — paste it somewhere safe");}
function downloadBackup(){const t=document.getElementById('savecode');if(!t)return;
  const blob=new Blob([t.value],{type:"text/plain"});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`tank-commander-${(G&&G.teamName||'save').replace(/[^a-z0-9]/gi,'-').toLowerCase()}.tankcmd`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("Backup file downloaded");}
function applyBackupCode(code){
  try{const json=decodeURIComponent(escape(atob((code||"").trim())));const obj=JSON.parse(json);
    if(!obj||!obj.roster)throw 0;
    G=obj;migrateSave();localStorage.setItem(SAVE,json);saveGame();
    const ov=document.getElementById('saveov');if(ov)ov.remove();
    toast("Game restored!");
    if(G.mode==="survivor"&&G.survStage===0&&!G.fired)startSurvivorYear();else goPhase(G.phase||0);
    return true;
  }catch(e){toast("That backup code didn't work");return false;}
}
function restoreBackup(){const t=document.getElementById('restorecode');if(!t||!t.value.trim()){toast("Paste a code first");return;}applyBackupCode(t.value);}
function restoreFromFile(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyBackupCode(String(r.result||""));r.readAsText(f);}
function showRestoreOnTitle(){

/* ============================================================
   ACCOUNTS & CLOUD SYNC  (username + password; profile + franchise save)
   Backend: AUTH_API (Cloudflare Worker + D1). Empty AUTH_API = feature hidden.
   ============================================================ */
const AUTH_KEY="tankCommander_auth";
function authEnabled(){return !!AUTH_API;}
function authState(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||"null");}catch(e){return null;}}
function setAuth(a){try{a?localStorage.setItem(AUTH_KEY,JSON.stringify(a)):localStorage.removeItem(AUTH_KEY);}catch(e){}}
async function authCall(path,body){
  const r=await fetch(AUTH_API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||("Server error "+r.status));
  return j;
}
function mergeProfileFromCloud(cloudStr){
  let c=null;try{c=cloudStr?JSON.parse(cloudStr):null;}catch(e){}
  if(!c)return;
  const lx=PROFILE.xp||0,cx=c.xp||0;
  PROFILE.xp=Math.max(lx,cx);
  PROFILE.gamesPlayed=Math.max(PROFILE.gamesPlayed||0,c.gamesPlayed||0);
  PROFILE.createdPlayer=(cx>lx? (c.createdPlayer||PROFILE.createdPlayer) : (PROFILE.createdPlayer||c.createdPlayer))||null;
  bwMergeFromCloud(c.bw);   // bWARfare collection / deck / coins / gauntlet follow the account
  saveProfile();
}
// merge bWARfare state from the cloud so cards + gauntlet progress persist across devices
function bwMergeFromCloud(cbw){
  if(!cbw)return;const bw=bwState();
  const col=Object.assign({},bw.collection||{});
  Object.keys(cbw.collection||{}).forEach(id=>{col[id]=Math.max(col[id]||0,cbw.collection[id]||0);});   // union, keep max owned
  bw.collection=col;
  bw.coins=Math.max(bw.coins||0,cbw.coins||0);
  if((cbw.packs||[]).length>(bw.packs||[]).length)bw.packs=cbw.packs.slice();   // keep the bigger unopened queue
  const valid=d=>d&&d.h&&d.h.length===30&&d.p&&d.p.length===10&&d.e&&d.e.length===12;
  if(valid(cbw.deck)&&!valid(bw.deck))bw.deck=cbw.deck;   // take a built deck if you don't have one here
  const gp=g=>g?((g.rings||[]).filter(Boolean).length*1000+(g.tier||0)*9+(g.step||0)):0;
  if(cbw.gaunt&&gp(cbw.gaunt)>gp(bw.gaunt))bw.gaunt=cbw.gaunt;   // furthest gauntlet progress wins
  bw._retroDone=bw._retroDone||cbw._retroDone;   // don't re-run the level catch-up
}
function bwFreshProfile(){return {xp:0,gamesPlayed:0,createdPlayer:null};}
function bwWipeLocalData(){   // remove device-local franchise data so accounts never bleed together
  try{localStorage.removeItem(SAVE);localStorage.removeItem(SAVE_AT);}catch(e){}
  try{(loadRuns()||[]).forEach(r=>{try{localStorage.removeItem(RUN_PREFIX+r.id);}catch(e){}});localStorage.removeItem(RUNS_KEY);}catch(e){}
}
function replaceProfileFromCloud(cloudStr){   // the signed-in account is authoritative — load ITS profile, no merging
  let c=null;try{c=cloudStr?JSON.parse(cloudStr):null;}catch(e){}
  PROFILE=Object.assign(bwFreshProfile(), c||{});
  try{localStorage.setItem(PROFILE_KEY,JSON.stringify(PROFILE));}catch(e){}
  try{bwState();}catch(e){}
}
async function reconcileAfterLogin(d){
  bwWipeLocalData();                       // clear the previous account's device data first
  replaceProfileFromCloud(d.profile);      // load this account's collection / coins / level (replace, not merge)
  let loadedCloud=false;
  if(d.save){try{localStorage.setItem(SAVE,d.save);localStorage.setItem(SAVE_AT,String(d.updated||Date.now()));loadedCloud=true;}catch(e){}}
  await cloudSyncNow();
  return loadedCloud;
}
let _syncT=null,_syncing=false;
function cloudSync(){if(!authEnabled()||!authState())return;clearTimeout(_syncT);_syncT=setTimeout(cloudSyncNow,1500);}
async function cloudSyncNow(){
  const a=authState();if(!authEnabled()||!a||_syncing)return;
  _syncing=true;
  try{
    const now=Date.now();
    await authCall("/sync",{token:a.token,profile:JSON.stringify(PROFILE),save:localStorage.getItem(SAVE)||null,updated:now});
    localStorage.setItem(SAVE_AT,String(now));
    bwPublishGhost();   // keep your rivals ghost deck fresh
  }catch(e){ if(/signed in|401/i.test(e.message)){setAuth(null);} }
  finally{_syncing=false;}
}

function bwM32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const BW_FN=["Cannonball","Coyote","Dasher","Cinders","Schoolboy","Oyster","Ducky","Hal","Pete","Rube","Dizzy","Mordecai","Boomer","Slats","Chief","Spider","Gabby","Lefty","Hammer","Tank","Bullet","Goose","Catfish","Sandy","Whitey","Smoky","Ace","Cool","Sliding","Pee Wee","Three Finger","Big Train","Yogi","Duke","Country","Stretch"];

const BW_IRID='linear-gradient(90deg,#ff7ab8,#ffd36b,#7bf0a0,#6bd5ff,#c79bff,#ff7ab8)';   // 99 — flowing iridescent (matches .ovr.irid)
const BW_DIAMOND='linear-gradient(135deg,#dff6ff,#7fd0ff,#bfe9ff,#eaffff)';                // 95-98 — blue diamond (matches .pill.bdiamond)
function bwMix(c1,c2,t){const L=(a,b)=>Math.round(a+(b-a)*clamp(t,0,1));return `rgb(${L(c1[0],c2[0])},${L(c1[1],c2[1])},${L(c1[2],c2[2])})`;}
// muted commons → yellow goods → bright green @94, then the game's diamond (95-98) & irid (99) treatments
function bwColor(c){
  const rar=c.rar,ov=c.t==='E'?[74,85,92,96,99][rar]:c.ov;
  if(rar===4||ov>=99)return {kind:'irid'};
  if(rar===3||ov>=96)return {kind:'diamond'};
  if(ov>=90){const col=bwMix([176,224,90],[150,255,60],(ov-90)/4);return {kind:'solid',col};}
  if(ov>=80){const col=bwMix([232,200,80],[200,228,86],(ov-80)/9);return {kind:'solid',col};}
  const col=bwMix([130,136,108],[196,206,175],(ov-69)/10);return {kind:'solid',col};
}
const COACH_AB=[
  {k:'bullpen',n:'Bullpen Coach'},{k:'edgeguru',n:'Edge Guru'},{k:'deepbench',n:'Deep Bench'},
  {k:'signsteal',n:'Sign Stealer'},{k:'basecoach',n:'Base Coach'},{k:'moundvisit',n:'Pitching Coach'},
  {k:'scout',n:'Advance Scout'},{k:'pinchhit',n:'Pinch Hitter'},{k:'hitcoach',n:'Hitting Coach'},{k:'closer',n:'Closer Whisperer'}];
function bwCoachVal(rar){return [1,1,2,2,3][rar]||1;}
function bwCoachDesc(k,v){switch(k){
  case 'bullpen':return `+${v} pitcher swap${v>1?'s':''} per game`;
  case 'edgeguru':return `+${v} Edge redraw${v>1?'s':''} per game`;
  case 'deepbench':return `Carry +${v} extra Edge${v>1?'s':''}`;
  case 'signsteal':return `Reveal the pitch · ${v}×/game`;
  case 'basecoach':return `Steal a base · ${v}×/game`;
  case 'moundvisit':return `Mound visit — reset pitch wear · ${v}×/game`;
  case 'scout':return `Reveal the hitter · ${v}×/game`;
  case 'pinchhit':return `Redo an at-bat · ${v}×/game`;
  case 'hitcoach':return `+${v} vs your weakest pitch`;
  case 'closer':return `Pitchers wear ${v*10}% slower`;

function bwGenSet(){
  const rng=bwM32(20260622);          // fixed seed → Set 1 is identical for everyone, forever
  const cards=[],edges=[],coaches=[],byId={};
  const pad=(n)=>String(n).padStart(3,'0');
  const nm=()=>BW_FN[Math.floor(rng()*BW_FN.length)]+" "+BW_LN[Math.floor(rng()*BW_LN.length)];
  const tiers=[
    {rar:4,lo:99,hi:99,nH:7,nP:3},
    {rar:3,lo:96,hi:98,nH:18,nP:7},
    {rar:2,lo:90,hi:95,nH:36,nP:14},
    {rar:1,lo:80,hi:89,nH:125,nP:45},
    {rar:0,lo:69,hi:79,nH:180,nP:65}];
  const abCh=[0.10,0.25,0.45,0.70,1.0];
  let hN=1,pN=1;
  const mk=(type,t)=>{
    const ov=t.lo+Math.floor(rng()*(t.hi-t.lo+1));
    const base=clamp(Math.round((ov-49)/5),1,10);
    // FB/OFF specialization — wider spread so more cards lean hard one way (e.g. 10 vs FB / 4 vs OFF).
    // vf+vo always equals 2*base, so a specialist and a balanced card of the same OVR are equal in total.
    // (Same number of rng() draws as before, so every card's name / OVR / position / ability is unchanged.)
    let spread = t.rar>=3 ? 1
               : t.rar===0 ? (function(){const r=rng();return r<0.30?0:r<0.52?1:r<0.78?2:r<0.93?3:4;})()
               : (function(){const r=rng();return r<0.34?0:r<0.62?1:r<0.86?2:3;})();
    const strongFB=rng()<0.5;
    spread=Math.min(spread, base-1, 10-base);   // keep both ratings within 1..10 with the sum intact
    const dir=strongFB?1:-1;
    const vf=clamp(base+dir*spread,1,10),vo=clamp(base-dir*spread,1,10);
    let ab;
    if(t.rar===4)ab=type==='H'?{con:true,pwr:true}:{whiff:true,soft:true};
    else ab=type==='H'?{con:rng()<abCh[t.rar],pwr:rng()<abCh[t.rar]}:{whiff:rng()<abCh[t.rar],soft:rng()<abCh[t.rar]};
    const id='S1'+type+pad(type==='H'?hN++:pN++);
    return {id,t:type,name:nm(),pos:type==='H'?BW_HPOS[Math.floor(rng()*9)]:(rng()<0.7?'SP':'RP'),ov,rar:t.rar,vf,vo,ab};
  };
  tiers.forEach(t=>{for(let i=0;i<t.nH;i++)cards.push(mk('H',t));for(let i=0;i<t.nP;i++)cards.push(mk('P',t));});
  // ---- 100 Edges (Player Edge Deck), rarity-scaled power ----
  const ET=[
    {n:"Sit Dead-Red",side:'H',ax:'fb',b:3,w:3},{n:"Guess Offspeed",side:'H',ax:'off',b:3,w:3},{n:"Sit Breaking",side:'H',ax:'br',b:3,w:3},
    {n:"Locked In",side:'H',ax:'any',b:2,w:3},{n:"Tunnel Vision",side:'H',ax:'any',b:3,w:2},{n:"Frozen Rope",side:'H',ax:'any',b:2,w:2},
    {n:"Patient Eye",side:'H',ax:'any',b:2,w:2},{n:"Juiced",side:'H',ax:'any',b:1,pwr:true,w:2},{n:"Corked Bat",side:'H',ax:'any',b:4,risky:true,w:1},
    {n:"Paint the Black",side:'P',ax:'any',b:3,w:3},{n:"Hit the Spot",side:'P',ax:'any',b:2,w:3},{n:"Extra Gas",side:'P',ax:'fb',b:4,w:2},
    {n:"Spitball",side:'P',ax:'off',b:4,w:2},{n:"Backfoot Slider",side:'P',ax:'off',b:3,w:2},{n:"Hook",side:'P',ax:'br',b:4,w:2},
    {n:"Buckle 'Em",side:'P',ax:'br',b:3,w:2},{n:"Quick Pitch",side:'P',ax:'any',b:3,w:2},{n:"Knuckle Curve",side:'P',ax:'br',b:3,w:1}];
  const eTotW=ET.reduce((a,t)=>a+(t.w||1),0);
  const pickET=()=>{let r=rng()*eTotW;for(const t of ET){r-=(t.w||1);if(r<0)return t;}return ET[0];};
  const eMult=[1,1.3,1.6,2,2.4],eCounts=[55,25,12,6,2];let eN=1;
  for(let rar=0;rar<5;rar++){for(let i=0;i<eCounts[rar];i++){
    const tm=pickET(),val=Math.max(1,Math.round(tm.b*eMult[rar]));
    const e={id:'S1E'+pad(eN++),t:'E',name:tm.n,side:tm.side,rar,fb:tm.ax==='fb'?val:0,off:tm.ax==='off'?val:0,br:tm.ax==='br'?val:0,any:tm.ax==='any'?val:0,pwrBump:!!tm.pwr,risky:!!tm.risky};
    e.d=(tm.ax==='fb'?`+${val} vs Fastball`:tm.ax==='off'?`+${val} vs Offspeed`:tm.ax==='br'?`+${val} vs Breaking`:`+${val} any`)+(tm.pwr?' · +1 base':'')+(tm.risky?' · 18% eject':'');
    edges.push(e);
  }}
  // ---- 30 Coaches (Common → HOF, ability scales with rarity) ----
  const cCounts=[8,9,7,4,2];let coN=1,abi=0;
  for(let rar=0;rar<5;rar++){for(let i=0;i<cCounts[rar];i++){
    const a=COACH_AB[abi++%COACH_AB.length],val=[1,1,2,2,3][rar];
    coaches.push({id:'S1C'+pad(coN++),t:'C',name:nm(),pos:'Coach',rar,ov:[72,84,91,96,99][rar],ab:{k:a.k,n:a.n,val,d:bwCoachDesc(a.k,val)}});
  }}
  cards.concat(edges).concat(coaches).forEach(c=>byId[c.id]=c);
  return {cards,edges,coaches,byId};
}
const SET1=bwGenSet();
// non-HOF rarity weights [common,good,allstar,mvp]; HOF is a separate per-pack roll
const PACK_W={bronze:[75,22,2.7,0.3],silver:[55,35,8,2],gold:[34,40,20,6],diamond:[15,35,35,15]};
const HOF_ODDS={bronze:1/10000,silver:1/500,gold:1/100,diamond:1/15};
const PACK_PRICE={bronze:100,silver:250,gold:600,diamond:1500};
const PACK_COL={bronze:'#c08552',silver:'#cdd6bf',gold:'var(--amber)',diamond:'#7fd0ff'};
const PACK_TIERS=['bronze','silver','gold','diamond'];
// ---- collection state (in PROFILE) ----
function bwState(){
  if(!PROFILE.bw){PROFILE.bw={coins:300,collection:{},deck:{h:[],p:[],e:[]},packs:['silver','silver']};bwGrantStarter();saveProfile();}
  const bw=PROFILE.bw;bw.deck=bw.deck||{h:[],p:[],e:[]};if(bw.deck.coach===undefined)bw.deck.coach=null;bw.collection=bw.collection||{};bw.packs=bw.packs||[];if(bw.coins==null)bw.coins=300;

}
function bwGrantStarter(){
  const bw=PROFILE.bw;

  const cP=SET1.cards.filter(c=>c.t==='P'&&c.rar===0).slice(0,12);
  const cE=SET1.edges.filter(c=>c.rar===0).slice(0,14);
  [...cH,...cP,...cE].forEach(c=>bw.collection[c.id]=(bw.collection[c.id]||0)+1);
  bw.deck.h=cH.slice(0,30).map(c=>c.id);bw.deck.p=cP.slice(0,10).map(c=>c.id);bw.deck.e=cE.slice(0,12).map(c=>c.id);

const bwOwned=id=>id==='CAP'?(PROFILE.createdPlayer?1:0):((PROFILE.bw&&PROFILE.bw.collection[id])||0);
// your Create-A-Player as a live bWARfare card — stats track the player as you upgrade him
function bwCapCard(name,pos,pot){
  pot=clamp(Math.round(pot||70),60,99);const base=clamp(Math.round((pot-49)/5),1,10);
  const isP=(pos==='SP'||pos==='RP'),rar=pot>=99?4:pot>=96?3:pot>=90?2:pot>=80?1:0;
  const ab=isP?{whiff:pot>=82,soft:pot>=90}:{con:pot>=80,pwr:pot>=88};
  return {id:'CAP',t:isP?'P':'H',name:(name||'My Player'),pos:pos||'DH',ov:pot,rar,vf:base,vo:base,ab,cap:true};
}
function bwCapGet(){const c=PROFILE.createdPlayer;if(!c)return null;return bwCapCard(c.name,c.pos,c.pot||c.ovr);}
function bwCardById(id){return SET1.byId[id]||(id==='CAP'?bwCapGet():null);}
const bwDistinct=()=>Object.keys((PROFILE.bw&&PROFILE.bw.collection)||{}).length;
function bwRollRar(w){const tot=w.reduce((s,x)=>s+x,0);let r=Math.random()*tot;for(let i=0;i<w.length;i++){if((r-=w[i])<0)return i;}return 0;}
function bwPlayerOfRar(rar){return pick(SET1.cards.filter(c=>c.rar===rar));}
function bwCoachOfRar(rar){let p=SET1.coaches.filter(c=>c.rar===rar);while(!p.length&&rar>0)p=SET1.coaches.filter(c=>c.rar===--rar);return pick(p.length?p:SET1.coaches);}
function bwOpenPack(tier){
  const w=PACK_W[tier]||PACK_W.bronze,out=[];
  const hofHit=Math.random()<(HOF_ODDS[tier]||0);   // per-pack HOF chance (bronze 1:10000 … diamond 1:15)
  for(let s=0;s<6;s++){
    if(hofHit&&s===0){out.push(bwPlayerOfRar(4));continue;}   // guaranteed HOF when it lands
    out.push(bwPlayerOfRar(bwRollRar(w)));
  }
  let er=bwRollRar(w),ep=SET1.edges.filter(c=>c.rar===er);while(!ep.length&&er>0)ep=SET1.edges.filter(c=>c.rar===--er);
  out.push(pick(ep.length?ep:SET1.edges));   // edge slot, capped at MVP
  out.push(bwCoachOfRar(bwRollRar(w)));   // every pack also yields a coach
  const bw=bwState();out.forEach(c=>{bw.collection[c.id]=(bwOwned(c.id))+1;});
  saveProfile();return out;
}

function bwCardBlurb(f,o,b,isHit){
  const idx=[f,o,b],mx=Math.max(f,o,b),mn=Math.min(f,o,b),spread=mx-mn;
  const top=idx.indexOf(mx),bot=idx.indexOf(mn),srt=idx.slice().sort((a,c)=>c-a);
  const topV=srt[0],secV=srt[1],botV=srt[2];
  if(isHit){
    if(spread<=2)return 'Balanced bat';
    if(topV-secV>=3)return ['Crushes fastballs','Crushes offspeed','Crushes breaking balls'][top];
    if(secV-botV>=3)return ['Good vs all but fastballs','Good vs all but offspeed','Good vs all but breaking'][bot];
    return ['Fastball hitter','Offspeed hitter','Breaking-ball hitter'][top];
  }
  if(spread<=2)return 'Balanced arsenal';
  if(topV-secV>=3)return ['Fastball specialist','Offspeed specialist','Breaking specialist'][top];
  if(secV-botV>=3)return ['Weak fastball','Weak offspeed','Weak breaking ball'][bot];
  return ['Leans fastball','Leans offspeed','Leans breaking'][top];
}

  const arcP=(s2,e,rr)=>{const[x0,y0]=pol(s2,rr),[x1,y1]=pol(e,rr);const lg=Math.abs(e-s2)>Math.PI?1:0;return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${rr.toFixed(1)} ${rr.toFixed(1)} 0 ${lg} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
  let ticks='';for(let i=0;i<=10;i++){const a=a0+span*(i/10),r2=r-(i%5===0?sw:sw*0.6),[x1,y1]=pol(a,r),[x2,y2]=pol(a,r2);ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${i%5===0?'#7d8a44':'#4a5330'}" stroke-width="${i%5===0?2:1}"/>`;}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">

}

   hap(pattern) fires vibration on supporting devices. Added v9.6.
   ============================================================ */
const SND_KEY='tankCommander_sound';
let _ac=null,_master=null;
function sndOn(){return localStorage.getItem(SND_KEY)!=='0';}
function sndToggle(){localStorage.setItem(SND_KEY,sndOn()?'0':'1');sndBtnPaint();try{musMuteSync();}catch(e){}if(sndOn())sfx('tap');}
function sndBtnPaint(){const b=document.getElementById('sndbtn');if(b)b.textContent=sndOn()?'🔊':'🔇';}
function _ctx(){
  if(_ac)return _ac;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  _ac=new AC();_master=_ac.createGain();_master.gain.value=.5;_master.connect(_ac.destination);
  return _ac;
}
function _tone(f0,f1,dur,type,vol,at){ // small swept oscillator
  const c=_ctx();if(!c)return;const t=c.currentTime+(at||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.25,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(_master);o.start(t);o.stop(t+dur+.02);
}
function _noise(dur,fc,q,vol,at,type){ // filtered noise burst
  const c=_ctx();if(!c)return;const t=c.currentTime+(at||0);
  const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource();s.buffer=buf;
  const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=fc;f.Q.value=q||1;
  const g=c.createGain();g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(_master);s.start(t);
}

  hit(){if(playSmp('crackhit'))return;_SFX.crack();},   // non-HR contact

  out(){_tone(140,70,.14,'sine',.3);_noise(.06,500,1,.12);},
  walk(){_tone(520,520,.07,'sine',.12);_tone(650,650,.07,'sine',.12,.1);},
  meatball(){_noise(.35,3200,2,.12);_tone(300,180,.3,'sawtooth',.06);},

  coin(){_tone(880,880,.07,'sine',.15);_tone(1320,1320,.12,'sine',.15,.07);},
  levelup(){[523,659,784,1046].forEach((f,i)=>_tone(f,f,.16,'triangle',.16,i*.08));},
  win(){[392,523,659,784].forEach((f,i)=>_tone(f,f,.3,'sawtooth',.1,i*.11));_noise(1.2,900,.4,.14,.3,'lowpass');},
  lose(){_tone(330,262,.3,'triangle',.16);_tone(262,196,.42,'triangle',.16,.24);},

function countUp(id,to,prefix,dur){
  const el=document.getElementById(id);if(!el)return;to=Number(to)||0;dur=dur||700;
  const t0=performance.now();prefix=prefix||'';

let _mus=null,_musEl=null,_musStarted=false,_musErr=0,_musDead=false;
function musState(){
  if(!_mus){try{_mus=JSON.parse(localStorage.getItem(MUS_KEY)||'null');}catch(e){_mus=null;}
    if(!_mus||typeof _mus.vol!=='number')_mus={on:1,vol:.35,i:Math.floor(Math.random()*MUSIC.length),min:0};}
  return _mus;

function musSave(){try{localStorage.setItem(MUS_KEY,JSON.stringify(musState()));}catch(e){}}
function musEl(){
  if(_musEl)return _musEl;
  if(typeof Audio==='undefined')return null;
  _musEl=new Audio();_musEl.preload='none';
  _musEl.addEventListener('ended',()=>{musSkip(1);});
  _musEl.addEventListener('error',()=>{
    if(++_musErr>=MUSIC.length){_musDead=true;musPaint();return;}   // whole folder missing
    musSkip(1);   // single bad file — try the next
  });
  _musEl.addEventListener('playing',()=>{_musErr=0;musPaint();});
  _musEl.addEventListener('pause',()=>musPaint());
  return _musEl;
}
function musLoad(play){
  const m=musState(),el=musEl();if(!el||_musDead)return;
  el.src=AUDIO_BASE+MUSIC[m.i][0];el.volume=m.vol;
  if(play&&sndOn()){const p=el.play();if(p&&p.catch)p.catch(()=>{});}
  musPaint();

function musToggle(){
  const m=musState(),el=musEl();if(!el||_musDead)return;
  if(el.paused){m.on=1;if(!el.src)musLoad(true);else if(sndOn()){const p=el.play();if(p&&p.catch)p.catch(()=>{});}}
  else{m.on=0;el.pause();}
  musSave();musPaint();
}
function musSkip(d){
  const m=musState();if(_musDead)return;
  m.i=((m.i+(d||1))%MUSIC.length+MUSIC.length)%MUSIC.length;musSave();
  musLoad(m.on);
}
function musVol(d){
  const m=musState();m.vol=Math.max(0,Math.min(1,Math.round((m.vol+d)*10)/10));
  const el=musEl();if(el)el.volume=m.vol;

function musTryAutoplay(){   // best-effort autoplay at page load; browsers may veto until first tap
  if(_musStarted||_musDead)return;

  const p=el.play();

/* ---- sampled SFX (with synth fallback) ---- */
const SFX_FILES={   // each entry lists accepted filenames — clean name first, original upload name as fallback
 crack:'sfx/bat-impact.mp3',
 crackhit:['sfx/bat-impact-hit.mp3','sfx/Baseball Bat Impact Non Home Run.mp3'],
 dice:['sfx/dice-roll.mp3','sfx/Dice Roll.mp3'],
 pack:['sfx/pack-rip.mp3','sfx/Pack Ripping.mp3'],
 playball:['sfx/play-ball.mp3','sfx/Play Ball!.mp3'],
 deal:['sfx/card-deal.mp3','sfx/Card Dealing.mp3'],
 flipcard:['sfx/card-flip-1.mp3','sfx/card-flip-2.mp3','sfx/card-flip-3.mp3','sfx/card-flip-4.mp3','sfx/card-flip-5.mp3','sfx/Card Flip 1.mp3','sfx/Card Flip 2.mp3','sfx/Card Flip 3.mp3','sfx/Card Flip 4.mp3','sfx/Card Flip 5.mp3'],
 strikeout:['sfx/strikeout.mp3','sfx/strikeout-2.mp3',"sfx/You're Out.mp3",'sfx/Strikeout.mp3'],
 yourout:['sfx/youre-out-1.mp3','sfx/youre-out-2.mp3','sfx/out.mp3',"sfx/You're Out 1.mp3","sfx/You're Out 2.mp3",'sfx/Out.mp3']};
const _smp={};
function smpWarm(){   // pre-create every sample on first tap: caches the files and trips
  if(typeof Audio==='undefined')return;   // 404 flags early so synth fallbacks engage from the start
  Object.keys(SFX_FILES).forEach(n=>{
    const f=SFX_FILES[n];(Array.isArray(f)?f:[f]).forEach(path=>{
      if(_smp[path]||_smp[path]===false)return;
      const a=new Audio(AUDIO_BASE+encodeURI(path));a.preload='auto';
      a.addEventListener('error',()=>{_smp[path]=false;});
      _smp[path]=a;
    });});
}
function _smpOne(path,vol){   // one sample file, cached; false once known-bad
  let a=_smp[path];
  if(a===false)return false;
  if(!a){a=new Audio(AUDIO_BASE+encodeURI(path));a.preload='auto';a.addEventListener('error',()=>{_smp[path]=false;});_smp[path]=a;}
  if(_smp[path]===false||a.error)return false;
  try{a.currentTime=0;a.volume=vol==null?.9:vol;const p=a.play();if(p&&p.catch)p.catch(()=>{});return true;}
  catch(e){return false;}
}
function playSmp(n,vol){
  if(typeof Audio==='undefined'||!SFX_FILES[n])return false;
  const f=SFX_FILES[n];
  if(!Array.isArray(f))return _smpOne(f,vol);
  // variant pool: random among files not known-missing; fall through if a pick fails
  const alive=f.filter(p=>_smp[p]!==false);
  const base=alive.length?alive:f;
  const order=base.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  for(const path of order)if(_smpOne(path,vol))return true;
  return false;
}

/* ---- generated memos: the spreadsheet, narrated ---- */
function fmMemoWinter(){
  const lines=[];
  const pay=payroll(G.roster),proj=warToWins(teamWAR(G.roster));
  const exp=G.roster.filter(p=>p.loc==="mlb"&&p.years<=1&&p.ovr>=76);
  const prospect=G.farm.slice().sort((a,b)=>(b.pot||0)-(a.pot||0))[0];
  if(G.mode!=='survivor'&&G.year<=2)lines.push(`Year ${G.year} of 6. Nobody expects wins yet — they expect <b>a plan</b>.`);
  else if(G.mode!=='survivor'&&G.year>=4)lines.push(`Year ${G.year} of 6. The rebuild is over when you say it is — but the grade is coming.`);
  if(exp.length)lines.push(`${exp.length===1?`<b>${exp[0].name}</b> is`:`<b>${exp.length} veterans</b> are`} on expiring deals — trade value that expires with ${exp.length===1?'it':'them'}.`);
  if(prospect&&prospect.pot>=84)lines.push(`Scouting on <b>${prospect.name}</b> (${prospect.pos}, farm): "ceiling ${prospect.pot} — it looks real."`);
  if(pay>170)lines.push(`Payroll sits at <b>$${pay}M</b> — the luxury tax will cost you wins.`);
  else if(pay<95&&proj<75)lines.push(`Payroll is light ($${pay}M). Losing cheap is a strategy — losing accidentally isn't.`);
  if(G.faSigns!=null&&G.year>=3)lines.push(`Free agency: <b>${Math.max(0,4-(G.faSigns||0))} of 4</b> winter signings left.`);
  return lines.slice(0,3).join('<br>');
}

/* ============================================================
   SEASON TICKER — narrates the sim result month by month
   ============================================================ */
function fmTickerData(prevWins,madePO){
  const me=(G.standings||[]).find(e=>e.me)||{wins:81,losses:81};
  const W=me.wins,L=me.losses,months=['APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER'];
  let rem=W,splits=[];
  for(let i=0;i<6;i++){
    const g=27,left=(5-i)*27;
    let w=i===5?rem:clamp(Math.round(W/162*g+gauss(0,2.4)),Math.max(0,rem-left),Math.min(g,rem));
    splits.push({m:months[i],g,w,l:g-w});rem-=w;
  }
  const hl=[];
  const best=splits.reduce((a,b)=>b.w>a.w?b:a),worst=splits.reduce((a,b)=>b.w<a.w?b:a);
  if(best.w>=17)hl.push([best.m,`A ${ri(7,9)}-game win streak has the town buzzing`]);
  else if(best.w>=15)hl.push([best.m,`${G.teamName} rip off a ${best.w}-win month`]);
  if(worst.w<=9)hl.push([worst.m,`A ${worst.l}-loss month tests the clubhouse`]);
  const rook=G.roster.filter(p=>p.loc==="mlb"&&p.age<=25&&(p.mlbYears||0)<=1).sort((a,b)=>b.ovr-a.ovr)[0];
  if(rook&&rook.ovr>=74&&hl.length<3)hl.push([pick(['MAY','JUNE','JULY']),`Rookie ${rook.name} is turning heads every night`]);
  const ace=G.roster.filter(p=>p.loc==="mlb"&&p.pos==="SP").sort((a,b)=>b.ovr-a.ovr)[0];
  if(ace&&ace.ovr>=88&&hl.length<3)hl.push([pick(['JUNE','AUGUST']),`${ace.name} flirts with a no-hitter into the 8th`]);
  const diff=prevWins!=null?W-prevWins:null;
  let stamp,stampCls;
  if(madePO){stamp='OCTOBER · CLINCHED';stampCls='ok';}
  else if(W>=84){stamp='MISSED BY A HAIR';stampCls='bad';}
  else if(W<=64){stamp='TOP PICK SECURED';stampCls='plan';}
  else{stamp='NO OCTOBER';stampCls='bad';}
  return {W,L,splits,hl,diff,stamp,stampCls};
}
function showSeasonTicker(prevWins,madePO,next){
  let T;try{T=fmTickerData(prevWins,madePO);}catch(e){next();return;}
  const old=document.getElementById('fmtick');if(old)old.remove();
  const ov=document.createElement('div');ov.id='fmtick';ov.className='fmtick';
  ov.innerHTML=`<span class="skip" onclick="fmTickSkip()">SKIP ▸▸</span>
    <div class="tk-club">${esc(G.teamName)} · SEASON ${G.year}</div>
    <div class="tk-mon" id="tkmon">APRIL</div>

    <div class="tk-pace" id="tkpace">GAME 1 OF 162</div>
    <div class="tk-bars" id="tkbars">${T.splits.map(()=>'<i></i>').join('')}</div>
    <div class="tk-hl" id="tkhl"><small></small><span></span></div>
    <div class="tk-fin" id="tkfin">
      <div class="rec">${T.W}–${T.L}</div>
      ${T.diff!=null?`<div class="tk-pace">${T.diff>=0?'+':''}${T.diff} vs LAST SEASON</div>`:''}
      <div class="tk-stamp ${T.stampCls}">${T.stamp}</div>
      <button class="btn primary" style="margin-top:14px" onclick="fmTickDone()">Continue ▸</button>
    </div>`;
  document.body.appendChild(ov);
  window._fmT={timers:[],next,T,done:false};
  let w=0,l=0;const bars=ov.querySelectorAll('#tkbars i');
  T.splits.forEach((s,i)=>{
    window._fmT.timers.push(setTimeout(()=>{
      const mo=document.getElementById('tkmon');if(!mo)return;
      mo.textContent=s.m;sfx('tap');
      let g=0;const iv=setInterval(()=>{if(g>=s.g){clearInterval(iv);return;}

        const r=document.getElementById('tkrec');if(r)r.textContent=w+'–'+l;
        const p=document.getElementById('tkpace');if(p)p.textContent='ON PACE: '+Math.round((w/Math.max(1,w+l))*162)+' WINS';
      },24);
      window._fmT.timers.push(iv);
      bars[i].style.height=Math.max(6,Math.round(s.w/27*52))+'px';
      bars[i].classList.add('show');if(s.l>s.w)bars[i].classList.add('bad');
      const h=T.hl.find(x=>x[0]===s.m);
      if(h){const el=document.getElementById('tkhl');if(el){el.querySelector('small').textContent='THE WIRE · '+s.m;el.querySelector('span').textContent=h[1];el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');sfx('coin');}}
    },i*1200));
  });
  window._fmT.timers.push(setTimeout(fmTickFinale,6*1200+500));
}
function fmTickFinale(){
  const t=window._fmT;if(!t||t.done)return;t.done=true;
  t.timers.forEach(x=>{clearTimeout(x);clearInterval(x);});
  ['tkmon','tkrec','tkpace','tkbars','tkhl'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});

/* ============================================================
   SEGMENTED SEASON — the season sims in chunks between the real
   break screens; your record at each stop reflects the roster
   you actually had, and mid-season moves change the stretch run.
   ============================================================ */
function fmSeasonInit(){G._season={g:0,w:0,l:0,mw:[0,0,0,0,0,0],mg:[0,0,0,0,0,0],finW:null};}
function fmSegSim(n){
  const pct=clamp(warToWins(teamWAR(G.roster))/162,0.22,0.78);
  return clamp(Math.round(pct*n+gauss(0,Math.sqrt(n)*.42)),Math.round(n*.1),Math.round(n*.9));
}
const FM_MON=['APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER'];
function fmMonthOf(g){return Math.min(5,Math.floor(Math.max(0,g-1)/27));}
function fmLiveStandings(){   // my division, approximated current records
  const S=G._season;if(!S||!S.g)return [];
  const rows=[{name:G.teamName,me:true,w:S.w,l:S.l}];
  (G.ai||[]).forEach(t=>{
    if(t.league===G.league&&t.div===G.div){
      const seed=String(t.id||t.name).split('').reduce((a,c)=>a+c.charCodeAt(0),0)+G.year*131;
      const r=bwM32(seed)();
      const pct=clamp(warToWins(t.war)/162+(r-0.5)*0.07,0.2,0.8);
      const w=clamp(Math.round(pct*S.g),0,S.g);
      rows.push({name:t.name,w,l:S.g-w});
    }});
  rows.sort((a,b)=>b.w-a.w);return rows;
}
function fmStandStrip(){
  const rows=fmLiveStandings();if(!rows.length)return '';
  return `<div class="fmstrip" onclick="fmStandFull()" title="Tap for the full picture">${ico('flag',11)} <b>${esc(G.div||'DIVISION')}</b> ${rows.map((r,i)=>`<span class="${r.me?'me':''}">${i+1}. ${esc(String(r.name).split(' ').slice(-1)[0])} <i>${r.w}–${r.l}</i></span>`).join('')}</div>`;
}
function fmStandFull(){
  const old=document.getElementById('fmstand');if(old){old.remove();return;}
  const d=document.createElement('div');d.id='fmstand';d.className='fmtick';
  let inner='';try{inner=`<div class="scroll" style="max-height:60vh">${dlStandings()}</div>`;}catch(e){inner='<p class="muted">Standings unavailable.</p>';}
  d.innerHTML=`<div class="tk-club">LEAGUE PICTURE · PROJECTED</div>
    <div class="panel" style="max-width:560px;width:94%;text-align:left">${inner}</div>
    <button class="btn primary" onclick="document.getElementById('fmstand').remove()">Close ▸</button>`;
  document.body.appendChild(d);
}
function fmSegHeadline(segW,n){
  if(Math.random()<0.45){
    const hot=segW/n>=0.62,cold=segW/n<=0.36;
    if(hot)return `A ${ri(6,9)}-game win streak has the town buzzing`;
    if(cold)return `A ${ri(5,8)}-game skid tests the clubhouse`;
    const rook=G.roster.filter(p=>p.loc==="mlb"&&p.age<=25&&(p.mlbYears||0)<=1).sort((a,b)=>b.ovr-a.ovr)[0];
    if(rook&&rook.ovr>=72&&Math.random()<0.5)return `Rookie ${rook.name} is turning heads every night`;
    const ace=G.roster.filter(p=>p.loc==="mlb"&&p.pos==="SP").sort((a,b)=>b.ovr-a.ovr)[0];
    if(ace&&ace.ovr>=86)return `${ace.name} takes a no-hitter into the 8th`;
  }
  return null;
}
function fmTickShell(){
  let ov=document.getElementById('fmtick');
  if(ov)return ov;
  ov=document.createElement('div');ov.id='fmtick';ov.className='fmtick';
  document.body.appendChild(ov);return ov;
}
function fmSeasonTick(toGame,stop){
  if(!G._season)fmSeasonInit();
  const S=G._season,from=S.g,n=toGame-from;
  if(n<=0)return fmTickStop(toGame,stop);
  const segW=(stop==null&&S.finW!=null)?clamp(S.finW-S.w,0,n):fmSegSim(n);
  // shuffled win/loss sequence for a lifelike count-up
  const seq=[];for(let i=0;i<n;i++)seq.push(i<segW?1:0);
  for(let i=seq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]];}
  const ov=fmTickShell();
  ov.innerHTML=`${fmStandStrip()}
    <div class="tk-club">${esc(G.teamName)} · SEASON ${G.year}</div>
    <div class="tk-mon" id="tkmon">${FM_MON[fmMonthOf(from+1)]}</div>
    <div class="tk-rec" id="tkrec">${S.w}–${S.l}</div>
    <div class="tk-pace" id="tkpace">GAME ${from} OF 162</div>
    <div class="tk-bars" id="tkbars">${S.mw.map((w,i)=>`<i class="${S.mg[i]?'show':''} ${S.mg[i]&&S.mw[i]*2<S.mg[i]?'bad':''}" style="height:${Math.max(6,Math.round(w/27*52))}px"></i>`).join('')}</div>
    <div class="tk-hl" id="tkhl"><small></small><span></span></div>
    <div id="tkstop"></div>`;
  const hl=fmSegHeadline(segW,n);
  const hlAt=from+Math.floor(n*0.55);
  let k=0,g=from,w=S.w,l=S.l;
  if(window._fmTk)clearInterval(window._fmTk);
  window._fmTk=setInterval(()=>{
    if(k>=n){clearInterval(window._fmTk);window._fmTk=null;
      S.g=toGame;S.w=w;S.l=l;try{saveGame();}catch(e){}
      fmTickStop(toGame,stop);return;}
    g++;const mi=fmMonthOf(g);
    if(seq[k])w++;else l++;
    S.mg[mi]++;if(seq[k])S.mw[mi]++;
    k++;
    const r=document.getElementById('tkrec'),p=document.getElementById('tkpace'),mo=document.getElementById('tkmon');
    if(!r){clearInterval(window._fmTk);window._fmTk=null;S.g=toGame;S.w=w;S.l=l;fmTickStop(toGame,stop);return;}
    r.textContent=w+'–'+l;
    p.textContent='GAME '+g+' · ON PACE: '+Math.round(w/Math.max(1,g)*162)+' W';
    if(mo)mo.textContent=FM_MON[mi];
    const bars=document.querySelectorAll('#tkbars i');
    if(bars[mi]){bars[mi].classList.add('show');bars[mi].style.height=Math.max(6,Math.round(S.mw[mi]/27*52))+'px';if(S.mw[mi]*2<S.mg[mi]&&S.mg[mi]>8)bars[mi].classList.add('bad');else bars[mi].classList.remove('bad');}
    if(hl&&g===hlAt){const el=document.getElementById('tkhl');if(el){el.querySelector('small').textContent='THE WIRE · '+FM_MON[mi];el.querySelector('span').textContent=hl;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');sfx('coin');}}
  },34);
}
function fmTickStop(atGame,stop){

  if(stop==null){return;}   // finale handled by fmSeasonFinale
  window._fmStop=stop;sfx('tap');

  if(box)box.innerHTML=`<div class="tk-stopcard">

}

function fmSeasonFinale(prevWins,madePO,next){
  const S=G._season;
  const doneUI=()=>{
    const ov=fmTickShell();
    const W=S?S.w:(G.standings.find(e=>e.me)||{}).wins,L=162-W;
    const diff=prevWins!=null?W-prevWins:null;
    let stamp,cls;
    if(madePO){stamp='OCTOBER · CLINCHED';cls='ok';}
    else if(W>=84){stamp='MISSED BY A HAIR';cls='bad';}
    else if(W<=64){stamp='TOP PICK SECURED';cls='plan';}
    else{stamp='NO OCTOBER';cls='bad';}
    ov.innerHTML=`${fmStandStrip()}
      <div class="tk-club">${esc(G.teamName)} · FINAL</div>
      <div class="tk-fin" style="display:flex">
        <div class="rec">${W}–${L}</div>
        ${diff!=null?`<div class="tk-pace">${diff>=0?'+':''}${diff} vs LAST SEASON</div>`:''}
        <div class="tk-stamp ${cls}">${stamp}</div>
        <button class="btn primary" style="margin-top:14px" onclick="fmTickClose();(window._fmNext||function(){})()">Continue ▸</button>
      </div>`;
    window._fmNext=next;
    sfx(cls==='ok'?'win':cls==='plan'?'coin':'lose');hap(cls==='ok'?[40,60,90]:25);
  };
  if(S&&S.g<162){
    fmSeasonTick(162,null);
    // watch for the segment to finish, then show the card
    const watch=setInterval(()=>{if(!window._fmTk){clearInterval(watch);doneUI();}},120);
  } else doneUI();
}

/* ============================================================
   CAMP REPORTS — top movers deal out as cards before the table
   ============================================================ */
function showCampReports(devList,next){
  const prog=(devList||[]).filter(e=>e.prog);
  const rest=(devList||[]).filter(e=>!e.prog&&e.d!==0).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  const movers=prog.concat(rest).slice(0,Math.max(5,Math.min(6,prog.length+3)));
  if(movers.length<2){next();return;}
  const old=document.getElementById('fmcamp');if(old)old.remove();
  const ov=document.createElement('div');ov.id='fmcamp';ov.className='fmtick';
  ov.innerHTML=`<div class="tk-club">SPRING CAMP · REPORTS COMING IN</div>
    <div id="fmcampcard" style="min-height:240px;display:flex;align-items:center;justify-content:center"></div>
    <div class="camp-dots" id="fmcampdots"></div>
    <button class="btn primary" id="fmcampbtn" onclick="fmCampNext()">Open the first report ▸</button>
    <button class="btn ghost sm" style="margin-top:8px" onclick="fmCampDone()">Skip to full report</button>`;
  document.body.appendChild(ov);
  window._fmC={list:movers,i:-1,next};
}
function fmCampNext(){
  const c=window._fmC;if(!c)return;c.i++;
  if(c.i>=c.list.length){fmCampDone();return;}
  const e=c.list[c.i],up=e.d>0;
  const stamp=e.prog?(e.progOK===false?'BACKFIRED':e.progOK===true?'PAID OFF':'PROGRAM'):(e.broke||e.d>=5?'BREAKOUT':e.bust?'BUST':e.d<=-5?'DECLINE':null);
  const verdict=e.progNote?e.progNote:e.broke?'The tools clicked. Scouts are done doubting him.':e.bust?'The ceiling was a mirage. It happens.':up?(e.farm?'Turning heads on the back fields.':'Came to camp in the best shape of his life.'):(e.age>=33?'Father Time is undefeated.':'A step back. The staff isn’t worried yet.');
  document.getElementById('fmcampbtn').textContent=c.i===c.list.length-1?'Close camp ▸':'Next report ▸';
  document.getElementById('fmcampdots').innerHTML=c.list.map((_,j)=>`<i class="${j<=c.i?'on':''}"></i>`).join('');
  document.getElementById('fmcampcard').innerHTML=`<div class="ccard">
    ${stamp?`<div class="bstamp ${(stamp==='BREAKOUT'||stamp==='PAID OFF')?'':stamp==='BACKFIRED'||stamp==='BUST'?'gray':'gray'}">${stamp}</div>`:''}
    <div class="ch"><span>${e.prog?esc(e.prog):'CAMP REPORT'}</span><span>${esc(e.pos)}${e.farm?' · FARM':''}</span></div>
    <div class="nm">${esc(e.name)}</div><div class="role">AGE ${e.age}</div>
    <div class="jump"><span class="o">${e.b}</span><span class="a">→</span><span class="n" id="fmcnum">${e.b}</span></div>
    <div class="verdict">${verdict}</div></div>`;
  sfx('flip');if(stamp==='BREAKOUT'){setTimeout(()=>{sfx('rare');hap([20,40,20]);},700);}
  const el=document.getElementById('fmcnum');let v=e.b;
  const iv=setInterval(()=>{if(!document.getElementById('fmcnum')){clearInterval(iv);return;}
