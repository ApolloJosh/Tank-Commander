<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Commander — Baseball Rebuild GM</title>
<style>
  :root{
    --bg:#0b0f08; --panel:#141a0e; --panel2:#1e2814; --line:#36471f;
    --ink:#e9efda; --dim:#94a577; --gold:#a6ff2b; --green:#76e83f;
    --red:#ef6a6a; --blue:#a3c46e;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);
    background-color:#0b0f08;
    background-image:
      radial-gradient(ellipse 42% 30% at 12% 16%, rgba(74,83,32,.30), transparent 60%),
      radial-gradient(ellipse 36% 28% at 84% 10%, rgba(40,54,22,.34), transparent 60%),
      radial-gradient(ellipse 46% 36% at 70% 74%, rgba(58,72,30,.24), transparent 60%),
      radial-gradient(ellipse 40% 32% at 24% 86%, rgba(26,36,16,.40), transparent 60%),
      radial-gradient(ellipse 30% 26% at 52% 46%, rgba(44,56,24,.20), transparent 60%);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;font-size:15px}
  #app{max-width:1060px;margin:0 auto;padding:18px 16px 70px}
  h1,h2,h3{margin:0 0 8px;line-height:1.2}
  h1{font-size:30px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
  .panel2{background:var(--panel2)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  .btn{display:inline-block;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;transition:.12s}
  .btn:hover{border-color:var(--gold);transform:translateY(-1px)}
  .btn.primary{background:var(--gold);color:#0c1a00;border-color:var(--gold);box-shadow:0 0 10px rgba(166,255,43,.25)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
    background:var(--panel2);border:1px solid var(--line)}
  .pill.gold{background:rgba(166,255,43,.15);border-color:var(--gold);color:var(--gold)}
  .pill.green{background:rgba(118,232,63,.14);border-color:var(--green);color:var(--green)}
  .pill.red{background:rgba(239,106,106,.13);border-color:var(--red);color:var(--red)}
  .pill.blue{background:rgba(163,196,110,.15);border-color:var(--blue);color:var(--blue)}
  .pill.bdiamond{background:linear-gradient(135deg,#dff6ff,#7fd0ff,#bfe9ff,#eaffff);background-size:200% 200%;
    color:#06212e;border-color:#bfeaff;font-weight:800;text-shadow:0 0 3px rgba(255,255,255,.6);animation:shimmer 3s linear infinite}
  .pill.irid{background:linear-gradient(90deg,#ff7ab8,#ffd36b,#7bf0a0,#6bd5ff,#c79bff,#ff7ab8);background-size:300% 100%;
    color:#1a1030;border-color:#fff;font-weight:800;text-shadow:0 0 3px rgba(255,255,255,.5);animation:irid 4s linear infinite}
  .ovr.bdiamond{background:linear-gradient(135deg,#dff6ff,#7fd0ff,#bfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .ovr.irid{background:linear-gradient(90deg,#ff7ab8,#ffd36b,#7bf0a0,#6bd5ff,#c79bff,#ff7ab8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;animation:irid 4s linear infinite}
  @keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes irid{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  tr:hover td{background:rgba(255,255,255,.02)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--dim)}
  .ovr{font-weight:800;font-variant-numeric:tabular-nums}
  .ovr.elite{color:var(--gold)} .ovr.good{color:var(--green)} .ovr.avg{color:var(--ink)} .ovr.low{color:var(--dim)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .kpi .big{font-size:24px;font-weight:800}
  .kpi .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24410f;color:#eaffcf;border:1px solid #4a6b1f;

  .small{font-size:12.5px}
  .scroll{max-height:360px;overflow:auto}
  .disclaimer{font-size:11px;color:#6c7c90;border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
  .hero{background:radial-gradient(120% 140% at 50% 0%,#243214,#0b0f08);
    border:1px solid var(--line);border-radius:16px;padding:30px 24px;text-align:center;
    box-shadow:inset 0 0 60px rgba(120,200,40,.06)}

    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}

function gauss(m,s){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();

/* ---------- helpers on players ---------- */
const isPit=p=>p.pos==="SP"||p.pos==="RP";
const isHit=p=>!isPit(p);
function ovrClass(o){return o>=88?'elite':o>=80?'good':o>=70?'avg':'low';}
// 80-99 ramps yellow -> bright laser green; below that stays muted
function ovrColor(o){
  if(o<70)return 'var(--dim)';
  if(o<80)return '#cdd6bf';
  const t=clamp((o-80)/19,0,1);
  const r=Math.round(255+(166-255)*t),g=Math.round(226+(255-226)*t),b=Math.round(61+(43-61)*t);
  return `rgb(${r},${g},${b})`;
}
// Realized ceiling: scouted potential is NOT a guarantee.
// 25% reach it exactly, 60% land within 10 below, 15% within 20 below.
function rollRealCeil(pot){const r=Math.random();let rc;
  if(r<0.25)rc=pot; else if(r<0.85)rc=pot-rnd(3,10); else rc=pot-rnd(11,20);
  return Math.round(rc);}
function rollDura(age){return clamp(round(gauss(72,15)-Math.max(0,(age-31))*0.9),26,99);}
// ---- granular hidden attributes (report card) ----
const HIT_ATTRS=["contact","power","speed","eye","defense"];
const PIT_ATTRS=["velocity","control","spin","whiff"];
const ATTR_LABEL={contact:"Contact",power:"Power",speed:"Speed",eye:"Eye",defense:"Def",velocity:"Velo",control:"Ctrl",spin:"Spin",whiff:"Whiff"};
function genAttrs(pos){
  const pitcher=pos==="SP"||pos==="RP";const keys=pitcher?PIT_ATTRS:HIT_ATTRS;const bias={};
  if(!pitcher){HIT_ATTRS.forEach(k=>bias[k]=0);
    if(pos==="1B"||pos==="DH"){bias.power+=9;bias.speed-=9;bias.defense-=4;}
    else if(pos==="LF"||pos==="RF"){bias.power+=5;bias.speed-=1;bias.defense-=2;}
    else if(pos==="CF"){bias.speed+=8;bias.defense+=5;bias.power-=4;}
    else if(pos==="SS"||pos==="2B"){bias.speed+=6;bias.defense+=7;bias.power-=6;}
    else if(pos==="C"){bias.defense+=8;bias.speed-=10;}
    else if(pos==="3B"){bias.power+=3;bias.defense+=3;bias.speed-=2;}}
  const offs={};let sum=0;keys.forEach(k=>{const o=gauss(bias[k]||0,7);offs[k]=o;sum+=o;});

// Give each AI team a STABLE set of tradeable players (so the market doesn't reshuffle

function assignTradeBlocks(){
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
  const isProspect=p=>p.prospect||(p.age<=24&&p.pot>=80);
  const pSet=new Set(G.pool.filter(isProspect).map(p=>p.id));   // disjoint buckets — no player on two teams
  const prospects=sh([...pSet]);
  const players=sh(G.pool.filter(p=>!pSet.has(p.id)&&!p.fic).map(p=>p.id));
  const depth=sh(G.pool.filter(p=>!pSet.has(p.id)&&p.fic).map(p=>p.id));
  let pi=0,pl=0,di=0;
  G.ai.forEach(t=>{const block=[];
    for(let k=0;k<3&&pi<prospects.length;k++)block.push(prospects[pi++]);

   ============================================================ */
function warOf(p){
  if(p.pos==="SP")return Math.max(0,(p.ovr-48)/10.5);
  if(p.pos==="RP")return Math.max(0,(p.ovr-53)/13.5);
  return Math.max(0,(p.ovr-49)/10.5);
}
const injFactor=p=>p.inj>0?clamp(1-p.inj/162,0.05,1):1;
// coaching raises the floor: bigger lift for weaker players, little for stars
function coachBonus(p){const c=(typeof G!=="undefined"&&G&&G.resources)?G.resources.coaching:0.333;return c*clamp((68-p.ovr)/4,0,3);}
function warOfC(p){const o=p.ovr+coachBonus(p);
  if(p.pos==="SP")return Math.max(0,(o-48)/10.5);
  if(p.pos==="RP")return Math.max(0,(o-53)/13.5);
  return Math.max(0,(o-49)/10.5);}
const eff=p=>warOfC(p)*injFactor(p);
function warToWins(w){return clamp(round(81+(w-33)*1.25),47,114);}
const REP_BAT=0.86, REP_SP=0.95, REP_RP=0.37;   // replacement-level fill for empty slots
function tradeValue(p){
  const ovr=p.ovr, pot=Math.max(p.pot||ovr,ovr), age=p.age;
  const youthF=clamp((31-age)/9,0,1.7);
  // current ability
  let cur = ovr<=52 ? Math.max(0,(ovr-40))*0.5 : 4+(ovr-52)*1.1;
  // ceiling premium — only genuinely useful ceilings (>72) carry future value, scaled by youth
  const ceilPrem = Math.max(0, pot-72)*(0.5+youthF*0.95);
  let v = cur + ceilPrem;
  // prime-age desirable regulars (the 75-85 OVR, still-young guys real teams covet)
  if(ovr>=75 && ovr<=88 && age<=33) v += (ovr-73)*(age<=31?1.0:0.7);
  // superstar tax
  if(ovr>=88) v += Math.pow(ovr-88,1.4)*2.4;
  // salary drag on pricey, aging players
  v -= Math.max(0,(p.salary-14))*(age>31?0.5:0.2);
  if(p.years<=1) v*=0.8;                    // rental discount
  // unplayable ceiling => little trade value
  if(pot<70) v=Math.min(v, 3+Math.max(0,(ovr-55))*0.7);
  return Math.max(1, Math.round(v));
}
// top-heavy pick scale: a #1 is a premium asset you can't assemble from scraps
const PICK_VALUES=[0,90,72,60,50,43,37,32,28,24,21,18,16,14,12,11,10];
function pickValue(slot){return PICK_VALUES[clamp(round(slot),1,16)]||9;}

/* ---------- position flexibility (OVR-gated) ---------- */
const LINEUP=["C","1B","2B","3B","SS","LF","CF","RF","DH"];
function flexPositions(p){
  const o=p.ovr, s=new Set([p.pos]);
  switch(p.pos){
    case "SS": if(o>=85){s.add("2B");s.add("3B");} if(o>=99)s.add("CF"); break;
    case "3B": if(o>=85)s.add("1B"); if(o>=95)s.add("SS"); if(o>=99)s.add("2B"); break;
    case "1B": if(o>=85)s.add("3B"); if(o>=95)s.add("2B"); if(o>=99)s.add("C"); break;
    case "CF": if(o>=85){s.add("LF");s.add("RF");} if(o>=95)s.add("1B"); if(o>=99)s.add("SS"); break;
    case "LF": s.add("RF"); if(o>=85)s.add("1B"); if(o>=95)s.add("CF"); if(o>=99)s.add("3B"); break;
    case "RF": s.add("LF"); if(o>=85)s.add("1B"); if(o>=95)s.add("CF"); if(o>=99)s.add("3B"); break;
    case "SP": if(o>=90)s.add("RP"); break;
    case "RP": if(o>=95)s.add("SP"); break;
    case "C": if(o>=90)s.add("1B"); if(o>=99)s.add("2B"); break;
  }
  return s;
}
function canPlaySlot(p,slot){ if(isPit(p))return false; if(slot==="DH")return true; return flexPositions(p).has(slot); }
function posCoversSlot(pos,slot){ if(pos===slot)return true; if(slot==="DH")return true;
  const OF=["LF","CF","RF"]; return OF.includes(pos)&&OF.includes(slot); }
function buildActive(roster){
  const mlb=roster.filter(p=>p.loc==="mlb");
  const used=new Set(),lineup={};
  ["C","SS","2B","3B","1B","CF","LF","RF","DH"].forEach(slot=>{
    const elig=mlb.filter(p=>!used.has(p.id)&&canPlaySlot(p,slot)).sort((a,b)=>eff(b)-eff(a));
    lineup[slot]=elig[0]||null; if(elig[0])used.add(elig[0].id);
  });
  const usedP=new Set();
  const rotation=mlb.filter(p=>isPit(p)&&flexPositions(p).has("SP")).sort((a,b)=>eff(b)-eff(a)).slice(0,4);
  rotation.forEach(p=>usedP.add(p.id));
  const pen=mlb.filter(p=>isPit(p)&&!usedP.has(p.id)&&flexPositions(p).has("RP")).sort((a,b)=>eff(b)-eff(a)).slice(0,3);
  return {lineup,rotation,pen,used};
}
function teamWAR(roster){
  const a=buildActive(roster);let w=0;
  LINEUP.forEach(s=>{w+=a.lineup[s]?eff(a.lineup[s]):REP_BAT;});
  for(let i=0;i<4;i++)w+=a.rotation[i]?eff(a.rotation[i]):REP_SP;
  for(let i=0;i<3;i++)w+=a.pen[i]?eff(a.pen[i]):REP_RP;

}

function simulateSeason(){
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  mlb.forEach(p=>{p.inj=0;p.injType=null;});
  const healthyWAR=teamWAR(G.roster);
  const injured=[];
  mlb.forEach(p=>{
    const dura=p.dura==null?70:p.dura;
    const chance=clamp((100-dura)/205+Math.max(0,(p.age-30))*0.005,0.03,0.55);
    if(Math.random()<chance){
      const longChance=clamp(0.18+Math.max(0,(p.age-30))*0.012+(100-dura)/420,0.1,0.55);
      let games,type;
      if(Math.random()<longChance){games=ri(60,150);type="long";if(Math.random()<0.12)games=162;}
      else{games=ri(12,52);type="short";}
      p.inj=games;p.injType=type;injured.push(p);
    }
  });
  // rival clubs improve over time as their own farms develop — the league bar rises each year
  G.ai.forEach(t=>{let d=(t.mode==="rebuild"?gauss(1.6,2):t.mode==="contend"?gauss(0.5,2):gauss(0.2,1.7))+gauss(0.7,0.5);
    t.war=clamp(t.war+d,10,60);});
  const myWAR=teamWAR(G.roster);
  const injWinsLost=clamp(round((healthyWAR-myWAR)*1.4),0,99);
  const entries=[{name:G.teamName,war:myWAR,me:true},...G.ai.map(t=>({name:t.name,war:t.war}))];
  entries.forEach(e=>{e.wins=clamp(round(warToWins(e.war)+gauss(0,4.6)),47,116);e.losses=162-e.wins;});
  // luxury tax: every $10M of payroll over $300M costs the user 1 win
  const tax=luxuryTax();
  G.maxPayroll=Math.max(G.maxPayroll||0,payroll(G.roster));
  if(tax>0){const m=entries.find(e=>e.me);m.wins=clamp(m.wins-tax,40,116);m.losses=162-m.wins;
    G.taxYears=(G.taxYears||0)+1;G.taxWinsLost=(G.taxWinsLost||0)+tax;}
  entries.sort((a,b)=>b.wins-a.wins);entries.forEach((e,i)=>e.seed=i+1);
  const champ=runPlayoffs(entries.slice(0,8));
  const me=entries.find(e=>e.me);
  G.standings=entries;G.lastWins=me.wins;
  G.bestWins=Math.max(G.bestWins,me.wins);G.worstWins=Math.min(G.worstWins,me.wins);
  if(me.seed<=8)G.playoffApps++;
  const wonWS=champ&&champ.me;if(wonWS)G.champions++;
  const mySlot=17-me.seed;
  G.ownedPicks.forEach(pk=>{if(pk.future&&pk.fromMe){pk.slot=mySlot;pk.future=false;}});
  G.history.push({year:G.year,wins:me.wins,losses:me.losses,seed:me.seed,playoffs:me.seed<=8,champ:wonWS});
  return {me,entries,injured,champ,wonWS,mySlot,tax,injWinsLost,healthyProj:warToWins(healthyWAR)};
}
function runPlayoffs(teams){
  const cb=1+(((G.resources?G.resources.coaching:0.333)-0.333)*0.32);   // coaching edge in October
  let r=teams.slice();
  // October is a coin-flip dressed up — even the best club isn't a lock to win a series
  while(r.length>1){const nx=[];for(let i=0;i<r.length;i+=2){const a=r[i],b=r[i+1];
    const sa=(a.war+22)*(a.me?cb:1),sb=(b.war+22)*(b.me?cb:1);
    let pa=clamp(sa/(sa+sb),0.30,0.68);nx.push(Math.random()<pa?a:b);}r=nx;}
  return r[0];
}

/* ============================================================
   DEVELOP / AGE / CONTRACTS
   ============================================================ */
function developAll(){
  const notes=[];
  const dev=(G.resources?G.resources.development:0.333);
  G.roster.forEach(p=>{p.inj=0;p.injType=null;});   // injuries heal over the offseason
  const all=G.roster.concat(G.farm).concat(G.pool);
  all.forEach(p=>{
    const b=p.ovr;
    if(p.realCeil==null)p.realCeil=Math.max(p.ovr,p.pot);
    const tgt=Math.min(p.realCeil,p.pot);   // they grow toward realized ceiling, not the dream
    if(p.age<=25){
      const onFarm=p.loc==="farm";
      const devMult=onFarm?(0.55+dev*1.7):0.8;   // big lift in the minors; little once promoted
      if(onFarm&&Math.random()<dev*0.26){p.pot=clamp(p.pot+ri(1,5),p.pot,99);p.realCeil=clamp(p.realCeil+ri(2,4),p.ovr,p.pot);} // strong development can push a prospect past their scouted ceiling
      if(Math.random()<0.04){p.pot=clamp(p.pot-ri(1,5),p.ovr,99);}                       // scouts sour
      else if(Math.random()<0.05){p.pot=clamp(p.pot+ri(2,6),p.pot,99);p.realCeil=clamp(p.realCeil+ri(2,5),p.ovr,p.pot);} // rare late breakout
      const t=Math.min(p.realCeil,p.pot);
      const g=Math.max(0,(t-p.ovr))*rnd(0.30,0.55)*devMult;
      p.ovr=clamp(round(p.ovr+(t>p.ovr?Math.max(1,g):0)),28,99);}
    else if(p.age<=27){const dm=p.loc==="farm"?(0.7+dev*1.0):0.9;p.ovr=clamp(round(p.ovr+(tgt>p.ovr?rnd(1,3.5)*dm:rnd(-1,1))),28,99);}
    else if(p.age<=30){p.ovr=clamp(round(p.ovr+(tgt>p.ovr?rnd(-0.5,1.5):rnd(-1.5,.5))),28,99);}
    else if(p.age<=32){p.ovr=clamp(round(p.ovr+rnd(-2.5,0)),28,99);}
    else{p.ovr=clamp(round(p.ovr-rnd(1.5,4.5)),22,99);}
    p.age++;
    if(b>0&&(p.loc==="mlb"||p.loc==="farm")){
      if(p.ovr-b>=6)notes.push(`📈 ${p.name} broke out (${b}→${p.ovr})`);
      if(b-p.ovr>=5&&p.age>31)notes.push(`📉 ${p.name} declined (${b}→${p.ovr})`);
    }
  });
  // MLB service accrues; salary re-scales to ability + service (payroll grows over time)
  G.roster.forEach(p=>{if(p.loc==="mlb"){p.mlbYears=(p.mlbYears||initService(p.age))+1;p.salary=salaryFor(p.ovr,p.mlbYears);}});
  // contracts tick (mlb only); expirations walk as FA
  G.leftAsFA=[];
  G.roster=G.roster.filter(p=>{
    if(p.loc==="mlb"){p.years--;if(p.years<=0){G.leftAsFA.push(p);return false;}}
    return true;
  });
  // retirements
  const ret=[];
  G.roster=G.roster.filter(p=>{if(p.age>=40||(p.ovr<=30&&p.age>35)){ret.push(p);return false;}return true;});
  G.farm=G.farm.filter(p=>p.ovr>24);
  G.pool=G.pool.filter(p=>p.age<40&&p.ovr>30);
  // rival farm systems: a fresh draft/international class enters the league each year,
  // so new high-ceiling prospects keep appearing around the league to scout and trade for
  const classN=ri(13,19);
  for(let i=0;i<classN;i++)G.pool.push(ficProspect());
  return {notes,retired:ret,fa:G.leftAsFA};
}
function extend(pid){
  const p=G.roster.find(x=>x.id===pid)||G.farm.find(x=>x.id===pid);if(!p)return;
  const add=p.age>=33?2:p.age>=29?3:5;
  p.years+=add;
  p.mlbYears=Math.max(p.mlbYears||6,6);          // extensions pay full freight for their ability
  p.salary=salaryFor(p.ovr,6);
  toast(`${p.name} extended ${add} yrs ($${p.salary}M/yr)`);
  saveGame();
}

/* ---- resources triangle (scouting / development / coaching) ---- */
const RES_A=[120,20],RES_B=[26,184],RES_C=[214,184];   // scouting / development / coaching vertices
function bary(px,py,A,B,C){
  const v0=[B[0]-A[0],B[1]-A[1]],v1=[C[0]-A[0],C[1]-A[1]],v2=[px-A[0],py-A[1]];
  const d00=v0[0]*v0[0]+v0[1]*v0[1],d01=v0[0]*v1[0]+v0[1]*v1[1],d11=v1[0]*v1[0]+v1[1]*v1[1],d20=v2[0]*v0[0]+v2[1]*v0[1],d21=v2[0]*v1[0]+v2[1]*v1[1];
  const den=d00*d11-d01*d01||1;
  const wB=(d11*d20-d01*d21)/den,wC=(d00*d21-d01*d20)/den,wA=1-wB-wC;
  return [wA,wB,wC];
}

function setResources(s,d,c){const t=s+d+c||1;G.resources={scouting:s/t,development:d/t,coaching:c/t};saveGame();const el=document.getElementById('resbox');if(el)el.innerHTML=renderResources();}

function myTradeableAssets(){
  const a=[];
  G.roster.filter(p=>p.loc==="mlb").forEach(p=>a.push({kind:"player",aid:p.id,player:p,val:tradeValue(p)}));
  G.farm.forEach(p=>a.push({kind:"player",aid:p.id,player:p,val:tradeValue(p)}));
  G.ownedPicks.forEach(pk=>a.push({kind:"pick",aid:pk.id,pick:pk,val:pickVal(pk)}));
  return a;
}
/* ---- asset transfer helpers ---- */
function giveAsset(a){
  if(a.kind==="player"){G.roster=G.roster.filter(p=>p.id!==a.player.id);G.farm=G.farm.filter(p=>p.id!==a.player.id);a.player.loc="pool";G.pool.push(a.player);}
  else{G.ownedPicks=G.ownedPicks.filter(pk=>pk.id!==a.pick.id);}
}
function getAsset(a){
  if(a.kind==="player"){G.pool=G.pool.filter(p=>p.id!==a.player.id);placeAcquired(a.player);}
  else{const src=a.pick;if(src.fromTeam){const t=G.ai.find(x=>x.id===src.fromTeam);if(t)t._pickTraded=true;}G.ownedPicks.push({...src,id:uid()});}
}
function placeAcquired(p){
  p.loc=(p.ovr>=68&&p.age>22&&!p.prospect)?"mlb":"farm";
  if(p.years<2&&p.loc==="mlb")p.years=6;
  if(p.src!=="draft")p.src="trade";
  if(p.loc==="mlb"){p.mlbYears=p.mlbYears||initService(p.age);p.salary=salaryFor(p.ovr,p.mlbYears);}
  if(p.loc==="mlb")G.roster.push(p);else G.farm.push(p);
}
/* ---- generated offers ---- */
function genOffers(){const offers=[];let guard=0;
  while(offers.length<5&&guard++<70){const o=genOneOffer();if(o)offers.push(o);}
  // never show the same draft pick (slot) in two different offers
  const seen=new Set();
  offers.forEach(o=>{o.get=o.get.filter(a=>{if(a.kind!=="pick")return true;if(seen.has(a.pick.slot))return false;seen.add(a.pick.slot);return true;});});
  return offers;}
function poolStars(min){return G.pool.filter(p=>!p.prospect&&p.ovr>=(min||80)&&p.age<=33);}
function poolYoung(){return G.pool.filter(p=>p.prospect||(p.age<=25&&p.pot>=80));}
function PA(p){return {kind:"player",aid:p.id,player:p,val:tradeValue(p)};}
function synthPick(slot){const pk={id:uid(),slot,future:false,fromMe:false};return {kind:"pick",aid:pk.id,pick:pk,val:pickVal(pk)};}
function genOneOffer(){
  const team=pick(G.ai),yr=G.year;
  let mode=yr<=2?(Math.random()<0.85?"sell":"swap"):yr===3?pick(["sell","buy","swap"]):(Math.random()<0.8?"buy":"swap");
  if(mode==="sell"){
    const vets=G.roster.filter(p=>p.loc==="mlb"&&(p.ovr>=76||p.age>=31)).sort((a,b)=>tradeValue(b)-tradeValue(a));
    if(!vets.length)return null;
    const give=[vets[0]];if(vets[1]&&Math.random()<0.3)give.push(vets[1]);
    const target=give.reduce((s,p)=>s+tradeValue(p),0)*rnd(0.85,1.04);
    const get=assembleFromPool(target,"young",team);if(!get.length)return null;
    return mkOffer(team,give.map(PA),get);
  }
  if(mode==="buy"){
    const stars=poolStars(80);if(!stars.length)return null;
    const star=pick(stars);const target=tradeValue(star)*rnd(0.95,1.15);
    const give=assembleFromMine(target);if(!give.length)return null;
    return mkOffer(team,give,[PA(star)]);
  }
  const mine=G.roster.filter(p=>p.loc==="mlb").sort(()=>Math.random()-0.5)[0];if(!mine)return null;
  const want=tradeValue(mine)*rnd(0.9,1.1);
  const cand=G.pool.filter(p=>Math.abs(tradeValue(p)-want)<=7&&p.id!==mine.id);if(!cand.length)return null;
  return mkOffer(team,[PA(mine)],[PA(pick(cand))]);
}
function assembleFromPool(target,kind,team){
  let cands=(kind==="young"?poolYoung():G.pool).slice();if(!cands.length)cands=G.pool.slice();
  cands.sort(()=>Math.random()-0.5);
  const get=[];let v=0,guard=0;
  while(v<target*0.9&&get.length<3&&guard++<30&&cands.length){
    const p=cands.shift();const pv=tradeValue(p);
    if(v+pv<=target+8){get.push(PA(p));v+=pv;}}
  if(v<target*0.85&&G.year<=3&&team&&team.pickSlot&&!team._pickTraded){
    const pk={id:uid(),slot:team.pickSlot,round:1,future:false,fromMe:false,fromTeam:team.id};
    const pv=pickVal(pk);
    if(pv<=(target-v)+12){get.push({kind:"pick",aid:pk.id,pick:pk,val:pv});}   // only add a pick that fits the value
  }
  return get;
}
function assembleFromMine(target){
  let assets=[];
  G.farm.forEach(p=>assets.push(PA(p)));
  G.ownedPicks.forEach(pk=>assets.push({kind:"pick",aid:pk.id,pick:pk,val:pickVal(pk)}));
  G.roster.filter(p=>p.loc==="mlb"&&p.age<=27&&p.pot>=84).forEach(p=>assets.push(PA(p)));
  assets.sort((a,b)=>b.val-a.val);
  const give=[];let v=0,gu=0;
  for(const a of assets){if(v>=target)break;give.push(a);v+=a.val;if(++gu>4)break;}
  return v>=target*0.9?give:[];
}
function mkOffer(team,give,get){const gv=give.reduce((s,a)=>s+a.val,0),gt=get.reduce((s,a)=>s+a.val,0);
  return {id:uid(),team,give,get,fair:gt/Math.max(1,gv)};}

  if(!_offers.length)return `<p class="muted">No deals on the table — try refreshing.</p>`;
  return _offers.map(o=>`<div class="offer">

       <div style="flex:2"><b>${o.team.name}</b> <span class="small muted">proj ${warToWins(o.team.war)}W</span>
         <span class="pill ${o.fair>=1?'green':o.fair>=0.88?'gold':'red'}">${o.fair>=1?'You win':o.fair>=0.88?'Fair':'Lean against you'}</span></div>
       <div style="flex:1;text-align:right"><button class="btn primary sm" onclick="acceptOffer('${o.id}')">Accept</button></div></div>
     <div class="grid2" style="margin-top:8px">

     </div></div>`).join("");
}

  const nm=teamNameOf(_custom.partner);
  _custom={giveIds:new Set(),getIds:new Set(),partner:null,seg:_custom.seg,search:'',posF:'all',sort:_custom.sort};
  _sugg=null;toast(`Trade with ${nm} complete`);screenTrade();}

/* ---- need-based trade suggestion (one at a time, respin freely, auto-respins after accept) ---- */
function genSuggestion(){
  if(G.draftOrderYear!==G.year)computeDraftOrder();
  const ns=needsSurplus();
  const needs=ns.needs.slice();
  const surplusPos=new Set(ns.surplus.map(s=>s.split(' ')[0]));
  const mine=tbMine().filter(a=>a.val>=4);
  if(!mine.length)return null;
  const league=leagueAssets();
  const scoreGet=a=>{if(a.kind!=="player")return 0;let s=0;
    if(needs.some(np=>a.player.pos===np||canPlaySlot(a.player,np)))s+=3;
    if(a.player.ovr>=78||a.player.pot>=86)s+=1; return s;};
  const teams=[...G.ai].filter(t=>t.block&&t.block.length).sort(()=>Math.random()-0.5);
  for(const team of teams){
    let theirs=league.filter(a=>a.team===team.id);
    const cnt={};theirs.forEach(a=>{if(a.kind==="player")cnt[a.player.pos]=(cnt[a.player.pos]||0)+1;});
    const theirSurplus=new Set(Object.keys(cnt).filter(p=>cnt[p]>=2));
    let cands=theirs.filter(a=>a.kind==="player"&&a.val>=15&&scoreGet(a)>0);
    cands.sort((a,b)=>(scoreGet(b)+(theirSurplus.has(b.player.pos)?0.5:0))-(scoreGet(a)+(theirSurplus.has(a.player.pos)?0.5:0))||b.val-a.val);
    if(!cands.length)continue;
    const get=[cands[ri(0,Math.min(2,cands.length-1))]];
    let factor=1.0;
    if(Math.random()<0.25){const fillsNeed=needs.some(np=>get[0].player.pos===np||canPlaySlot(get[0].player,np));factor=fillsNeed?rnd(0.86,0.98):rnd(1.03,1.15);}
    const need=Math.max(1,get[0].val*factor);
    // assemble a give package that matches `need` closely (slight surplus-position preference)
    const surplusBonus=a=>(a.kind==="player"&&surplusPos.has(a.player.pos))?6:0;
    const giveable=mine.filter(a=>a.aid!==get[0].aid);
    const give=[];let v=0,cand=giveable.slice(),guard=0;
    while(v<need*0.95&&give.length<3&&cand.length&&guard++<8){
      let best=null,bg=1e9;
      for(const a of cand){const nv=v+a.val;const gap=(nv>=need?(nv-need)*0.55:(need-nv))-surplusBonus(a);if(gap<bg){bg=gap;best=a;}}
      if(!best)break;give.push(best);v+=best.val;cand.splice(cand.indexOf(best),1);}
    if(!give.length||v<need*0.8)continue;
    const fills=needs.find(np=>get[0].player.pos===np||canPlaySlot(get[0].player,np));
    const reason=`${teamShortOf(team.id)} offers ${get[0].player.pos} ${get[0].player.name}${fills?` — fills your need at ${fills}`:''}${surplusPos.size?`; they'll take from your surplus (${[...surplusPos].slice(0,2).join("/")})`:''}.`;
    return {team:team.id,get,give,reason};
  }
  return null;
}
function renderSuggestion(){
  if(!_sugg)_sugg=genSuggestion();
  if(!_sugg)return `<p class="muted small">No clean fit right now. <button class="btn sm" onclick="respinSuggestion()">↻ Respin</button></p>`;
  const s=_sugg,gv=s.give.reduce((n,a)=>n+a.val,0),gt=s.get.reduce((n,a)=>n+a.val,0);
  const tag=gv<=gt*0.93?'<span class="pill green">you win</span>':gv>=gt*1.07?'<span class="pill red">they win</span>':'<span class="pill gold">fair</span>';
  return `<p class="sub" style="margin-bottom:8px">${s.reason}</p>
    <div class="grid2">
      <div><div class="small give" style="font-weight:700;margin-bottom:4px">▼ YOU SEND &nbsp;${gv}</div>${s.give.map(tbCard).join("")}</div>
      <div><div class="small get" style="font-weight:700;margin-bottom:4px">▲ YOU GET &nbsp;${gt}</div>${s.get.map(tbCard).join("")}</div>
    </div>
    <div style="text-align:center;margin-top:9px">${tag} <button class="btn primary" onclick="acceptSuggestion()">Accept</button> <button class="btn" onclick="respinSuggestion()">↻ Respin</button></div>`;
}

function acceptSuggestion(){

  give.forEach(giveAsset);get.forEach(getAsset);

function nextYear(){G.year++;G.phase=0;G.tradeTries=3;_offers=null;_custom=null;_sugg=null;saveGame();goPhase(0);}

/* ============================================================
   END GAME
   ============================================================ */
function computeGrade(){
  const h=G.history;
  const early=h.filter(x=>x.year<=2),late=h.filter(x=>x.year>=4);
  const earlyAvg=early.length?early.reduce((s,x)=>s+x.wins,0)/early.length:81;
  const peakLate=Math.max(0,...late.map(x=>x.wins));
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  const coreYoung=mlb.filter(p=>p.age<=27&&p.ovr>=80).length;
  const farmQ=G.farm.filter(p=>Math.min(p.realCeil||p.pot,p.pot)>=84).length;
  const windowYears=clamp(round(coreYoung*0.9+farmQ*0.6),0,8);
  const contrib=mlb.filter(p=>p.ovr>=74);
  const hg=contrib.filter(p=>p.src==="draft").length;
  const acq=contrib.filter(p=>p.src==="fa"||p.src==="trade").length;
  const faCount=contrib.filter(p=>p.src==="fa").length;
  const hgRatio=(hg+acq)>0?hg/(hg+acq):0;
  const a=buildActive(G.roster);let holes=0;
  LINEUP.forEach(s=>{const p=a.lineup[s];if(!p||p.ovr<66)holes++;});
  if(mlb.filter(p=>p.pos==="SP"&&p.ovr>=66).length<4)holes++;
  if(mlb.filter(p=>p.pos==="RP"&&p.ovr>=66).length<3)holes++;
  const maxPay=Math.round(G.maxPayroll||payroll(G.roster));
  const taxYears=G.taxYears||0;
  const items=[];let score=0;
  const add=(label,pts)=>{items.push({label,pts});score+=pts;};
  let pk=peakLate>=105?32:peakLate>=100?28:peakLate>=95?23:peakLate>=90?17:peakLate>=85?11:peakLate>=80?6:peakLate>=75?2:0;
  add(`Peak of ${peakLate} wins in your contention window`,pk);
  if(G.champions>0)add(`${G.champions} World Series title${G.champions>1?'s':''}`,Math.min(36,G.champions*19));
  if(G.playoffApps>0)add(`${G.playoffApps} playoff appearance${G.playoffApps>1?'s':''}`,Math.min(16,G.playoffApps*4));
  else items.push({label:"Never reached the postseason",pts:0});
  let tk=earlyAvg<=66?11:earlyAvg<=70?8:earlyAvg<=75?4:0;
  if(tk)add(`Committed to the tank early (avg ${Math.round(earlyAvg)} wins, yrs 1-2)`,tk);
  else items.push({label:`Didn't truly bottom out for premium picks (avg ${Math.round(earlyAvg)} wins early)`,pts:0});
  let hgPts=(hg>=3&&hgRatio>=0.6)?15:(hg>=2&&hgRatio>=0.5)?10:hgRatio>=0.4?6:hgRatio>=0.25?3:0;
  if(hgPts)add(`Homegrown core — ${hg} drafted contributor${hg>1?'s':''} (${Math.round(hgRatio*100)}% of acquired talent)`,hgPts);
  else items.push({label:`Built mostly through trades/free agency, not the draft (${hg} homegrown)`,pts:0});
  let wPts=windowYears>=5?11:windowYears>=3?6:windowYears>=1?2:-8;
  add(`${windowYears>=5?'Wide-open':windowYears>=3?'Healthy':windowYears>=1?'Closing':'Shut'} future window (~${windowYears} yr${windowYears===1?'':'s'} ahead)`,wPts);
  let payPen=maxPay>320?-12:maxPay>280?-7:maxPay>240?-3:0;
  if(payPen)add(`Bloated payroll (peaked at $${maxPay}M)`,payPen);
  if(taxYears>0)add(`Paid the luxury tax in ${taxYears} season${taxYears>1?'s':''} (−${G.taxWinsLost||0} wins)`,Math.max(-8,-taxYears*2));
  if(faCount>=3)add(`Leaned on free-agent signings (${faCount})`,Math.max(-6,-(faCount-2)*2));
  if(holes>0)add(`${holes} hole${holes>1?'s':''} left in the everyday roster`,Math.max(-8,-holes*2));
  score=clamp(round(score),0,100);
  const grade=score>=92?'A+':score>=83?'A':score>=74?'A-':score>=64?'B':score>=53?'C':score>=42?'D':'F';
  let blurb;
  if(G.champions>=1&&peakLate>=100&&hgRatio>=0.5)blurb="The blueprint, executed to perfection — you tanked, drafted a homegrown core, and raised a banner. Front-office legend.";
  else if(G.champions>=1)blurb="You brought home a title. However you got there, the ring is the ring.";
  else if(peakLate>=95)blurb="You built a contender and knocked on the door — just couldn't break through in October.";
  else if(earlyAvg<=72&&peakLate<88)blurb="You tore it down but the rise never fully arrived. Too many picks missed, or you sold the future too cheap.";
  else blurb="A middling six years — never bad enough to stock elite picks, never good enough to truly contend.";
  const winTxt=windowYears>=5?"wide open":windowYears>=3?"open":windowYears>=1?"closing":"shut";
  return {score,grade,blurb,items,windowYears,winTxt,hg,maxPay};
}
function endGame(){
  const h=G.history;
  const {score,grade,blurb,items,windowYears,winTxt,hg,maxPay}=computeGrade();
  render(`<div class="hero"><div class="pill gold">FRONT-OFFICE REVIEW</div>
     <h1 style="font-size:60px;margin:6px 0;color:var(--gold)">${score}<span style="font-size:26px;color:var(--dim)">/100</span> &nbsp;${grade}</h1>
     <p class="sub" style="max-width:600px;margin:0 auto">${blurb}</p></div>
   <div class="panel"><h3>Why you scored ${score}</h3>
     <table><tbody>${items.map(it=>`<tr><td>${it.label}</td>
       <td class="num" style="color:${it.pts>0?'var(--green)':it.pts<0?'var(--red)':'var(--dim)'};font-weight:700">${it.pts>0?'+':''}${it.pts}</td></tr>`).join("")}</tbody></table>
     <p class="sub" style="margin-top:8px">Your window heading forward is <b style="color:var(--ink)">${winTxt}</b> — about ${windowYears} more competitive year${windowYears===1?'':'s'} of young, controllable talent.</p></div>
   <div class="grid4" style="margin-top:4px">
     <div class="kpi"><div class="big">${G.champions}</div><div class="lbl">World Series</div></div>
     <div class="kpi"><div class="big">${G.bestWins}</div><div class="lbl">Peak Wins</div></div>
     <div class="kpi"><div class="big">${hg}</div><div class="lbl">Homegrown Core</div></div>
     <div class="kpi"><div class="big">$${maxPay}M</div><div class="lbl">Peak Payroll</div></div></div>
   <div class="panel"><h3>Your 6-Year Timeline</h3>
     <table><thead><tr><th>Season</th><th class="num">Record</th><th class="num">Rank</th><th>Result</th></tr></thead><tbody>${
       h.map(x=>`<tr><td>Year ${x.year}</td><td class="num">${x.wins}-${x.losses}</td><td class="num">#${x.seed}</td>
         <td>${x.champ?'<span class="pill gold">🏆 WS</span>':x.playoffs?'<span class="pill green">Playoffs</span>':'<span class="muted">—</span>'}</td></tr>`).join("")}</tbody></table></div>
   <div class="panel center" id="lbsubmit">
     <h3>🏆 Post to the leaderboard</h3>
     <div style="margin:8px 0"><input id="lbname" maxlength="12" placeholder="Name or initials" style="width:200px"/></div>
     <button class="btn primary" onclick="submitScore()">Submit score ${score}</button>
     <button class="btn ghost" onclick="screenLeaderboard(true)">View leaderboard</button>
   </div>
   <div class="center" style="margin-top:8px"><button class="btn" onclick="(function(){localStorage.removeItem(SAVE);screenTitle();})()">New Franchise</button></div>
   <p class="disclaimer">Unofficial fan-made prototype • not affiliated with MLB/MLBPA • all data fictional.</p>`);
}

/* ============================================================
   LEADERBOARD — local by default; set LEADERBOARD_API for a shared board
   ============================================================ */
const LEADERBOARD_API="https://tank-leaderboard.josh-c2f.workers.dev"; // shared leaderboard backend
const LB_KEY="tankCommander_lb_v2";
function deviceId(){try{let d=localStorage.getItem("tankCommander_did");if(!d){d="d_"+Math.random().toString(36).slice(2,12)+Date.now().toString(36);localStorage.setItem("tankCommander_did",d);}return d;}catch(e){return "anon";}}
function lbLoadLocal(){try{return JSON.parse(localStorage.getItem(LB_KEY)||"[]");}catch(e){return [];}}
function lbSaveLocal(a){try{localStorage.setItem(LB_KEY,JSON.stringify(a.slice(0,600)));}catch(e){}}
function lbRank(arr){return arr.slice().sort((a,b)=>(b.score-a.score)||((b.champs||0)-(a.champs||0))||((b.peak||0)-(a.peak||0)));}
function todayStr(d){d=d||new Date();return d.toISOString().slice(0,10);}
async function lbSubmit(entry){
  const local=lbLoadLocal();local.push(entry);lbSaveLocal(lbRank(local));
  if(LEADERBOARD_API){try{await fetch(LEADERBOARD_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(entry)});}catch(e){}}
}
async function lbFetch(){
  if(LEADERBOARD_API){try{const r=await fetch(LEADERBOARD_API,{cache:"no-store"});if(r.ok){const a=await r.json();if(Array.isArray(a))return a;}}catch(e){}}
  return lbLoadLocal();
}
function lbRows(arr){
  if(!arr.length)return `<tr><td colspan="5" class="muted" style="text-align:center;padding:14px">No entries yet — be the first.</td></tr>`;
  return arr.map((e,i)=>`<tr>
    <td class="num">${i+1}</td>
    <td><b>${(e.name||'---').slice(0,12)}</b><br><span class="small muted">${e.team?e.team.slice(0,18):''}</span></td>
    <td class="num"><b style="color:var(--gold)">${e.score}</b> <span class="small">${e.grade||''}</span></td>
    <td class="num">${e.peak||''}W</td>
    <td class="num">${e.champs||0}🏆</td></tr>`).join("");
}
async function screenLeaderboard(fromEnd){
  render(`<div class="row" style="align-items:center;margin-bottom:6px"><h2 style="flex:1">🏆 Leaderboard</h2>
     <button class="btn ghost" onclick="screenTitle()">← Home</button></div>
   <p class="sub">${LEADERBOARD_API?'Global rankings across all players.':'Saved on this device only. To make it shared, see the README — it takes one free backend URL.'}</p>
   <div id="lbbody"><p class="muted">Loading…</p></div>`);
  const all=await lbFetch();const ranked=lbRank(all);
  const today=ranked.filter(e=>(e.date||todayStr(new Date(e.ts||Date.now())))===todayStr());
  const el=document.getElementById('lbbody'); if(!el)return;
  el.innerHTML=`<div class="grid2">
     <div class="panel"><h3>🔆 Top 10 Today</h3><table><thead><tr><th class="num">#</th><th>GM / Club</th><th class="num">Score</th><th class="num">Peak</th><th class="num">WS</th></tr></thead><tbody>${lbRows(today.slice(0,10))}</tbody></table></div>
     <div class="panel"><h3>👑 Top 10 All-Time</h3><table><thead><tr><th class="num">#</th><th>GM / Club</th><th class="num">Score</th><th class="num">Peak</th><th class="num">WS</th></tr></thead><tbody>${lbRows(ranked.slice(0,10))}</tbody></table></div>
   </div>`;
}
function submitScore(){
  const inp=document.getElementById('lbname');const name=((inp&&inp.value.trim())||'Anon').slice(0,12);
  const R=computeGrade();
  const entry={name,team:G.teamName,score:R.score,grade:R.grade,peak:G.bestWins,champs:G.champions,window:R.windowYears,ts:Date.now(),date:todayStr(),did:deviceId()};
  lbSubmit(entry);toast(`Submitted: ${name} — ${R.score} (${R.grade})`);
  screenLeaderboard(true);
}

/* boot */
screenTitle();
</script>
