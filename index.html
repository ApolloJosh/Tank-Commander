<!DOCTYPE html>

<title>Tank Commander — Baseball Rebuild GM</title>
<style>
  :root{
    --bg:#0b0f08; --panel:#141a0e; --panel2:#1e2814; --line:#36471f;
    --ink:#e9efda; --dim:#94a577; --gold:#a6ff2b; --green:#76e83f;
    --red:#ef6a6a; --blue:#a3c46e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);overscroll-behavior:none;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
    background-color:#0b0f08;
    background-image:
      radial-gradient(ellipse 42% 30% at 12% 16%, rgba(74,83,32,.30), transparent 60%),
      radial-gradient(ellipse 36% 28% at 84% 10%, rgba(40,54,22,.34), transparent 60%),
      radial-gradient(ellipse 46% 36% at 70% 74%, rgba(58,72,30,.24), transparent 60%),
      radial-gradient(ellipse 40% 32% at 24% 86%, rgba(26,36,16,.40), transparent 60%),
      radial-gradient(ellipse 30% 26% at 52% 46%, rgba(44,56,24,.20), transparent 60%);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;font-size:15px}
  #app{max-width:1060px;margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  input,textarea,select{-webkit-user-select:text;user-select:text}
  .pcard.tapsel{outline:2px solid var(--gold);outline-offset:1px}
  .slot.tapok,.benchzone.tapok{border-color:var(--gold)!important;border-style:solid!important;background:rgba(245,196,81,.10)}
  h1,h2,h3{margin:0 0 8px;line-height:1.2}
  h1{font-size:30px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
  .panel2{background:var(--panel2)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  .btn{display:inline-block;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;transition:.12s}
  .btn:hover{border-color:var(--gold);transform:translateY(-1px)}
  .btn.primary{background:var(--gold);color:#0c1a00;border-color:var(--gold);box-shadow:0 0 10px rgba(166,255,43,.25)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
    background:var(--panel2);border:1px solid var(--line)}
  .pill.gold{background:rgba(166,255,43,.15);border-color:var(--gold);color:var(--gold)}
  .pill.green{background:rgba(118,232,63,.14);border-color:var(--green);color:var(--green)}
  .pill.red{background:rgba(239,106,106,.13);border-color:var(--red);color:var(--red)}
  .pill.blue{background:rgba(163,196,110,.15);border-color:var(--blue);color:var(--blue)}
  .pill.bdiamond{background:linear-gradient(135deg,#dff6ff,#7fd0ff,#bfe9ff,#eaffff);background-size:200% 200%;
    color:#06212e;border-color:#bfeaff;font-weight:800;text-shadow:0 0 3px rgba(255,255,255,.6);animation:shimmer 3s linear infinite}
  .pill.irid{background:linear-gradient(90deg,#ff7ab8,#ffd36b,#7bf0a0,#6bd5ff,#c79bff,#ff7ab8);background-size:300% 100%;
    color:#1a1030;border-color:#fff;font-weight:800;text-shadow:0 0 3px rgba(255,255,255,.5);animation:irid 4s linear infinite}
  .ovr.bdiamond{background:linear-gradient(135deg,#dff6ff,#7fd0ff,#bfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .ovr.irid{background:linear-gradient(90deg,#ff7ab8,#ffd36b,#7bf0a0,#6bd5ff,#c79bff,#ff7ab8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;animation:irid 4s linear infinite}
  @keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes irid{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  tr:hover td{background:rgba(255,255,255,.02)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--dim)}
  .ovr{font-weight:800;font-variant-numeric:tabular-nums}
  .ovr.elite{color:var(--gold)} .ovr.good{color:var(--green)} .ovr.avg{color:var(--ink)} .ovr.low{color:var(--dim)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .kpi .big{font-size:24px;font-weight:800}
  .kpi .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24410f;color:#eaffcf;border:1px solid #4a6b1f;
    padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:50;font-weight:600;max-width:90%}
  .center{text-align:center}
  .small{font-size:12.5px}
  .scroll{max-height:360px;overflow:auto}
  .disclaimer{font-size:11px;color:#6c7c90;border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
  .hero{background:radial-gradient(120% 140% at 50% 0%,#243214,#0b0f08);
    border:1px solid var(--line);border-radius:16px;padding:30px 24px;text-align:center;
    box-shadow:inset 0 0 60px rgba(120,200,40,.06)}
  .stepbar{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
  .step{flex:1;min-width:88px;text-align:center;font-size:11px;padding:7px 4px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .step.on{border-color:var(--gold);color:var(--gold);font-weight:700}
  .step.done{border-color:var(--green);color:var(--green)}
  select,input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:14px}
  .offer{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;background:var(--panel2)}
  .pos{display:inline-block;min-width:30px;font-weight:700;color:var(--blue);font-size:12px}
  .sectlbl{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin:14px 0 4px;font-weight:700}
  .empty{color:var(--red);font-style:italic}
  .give{color:var(--red)} .get{color:var(--green)}
  .yrs{font-size:11px}
  .yrs.exp{color:var(--red);font-weight:700}
  @media(max-width:680px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}h1{font-size:24px}}
  .tbrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border:0.5px solid #2c3a1c;border-radius:9px;margin-bottom:6px;background:var(--panel2)}
  .tbadge{width:42px;height:42px;border-radius:8px;background:#0f1409;border:0.5px solid #3a4d22;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
  .tbadge .o{font-size:18px;font-weight:800}
  .tbadge .c{font-size:9px;color:var(--green)}
  .tbval{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700;min-width:26px;text-align:right;font-size:15px}
  .add{border:0.5px solid #4a6b1f;color:var(--gold);background:transparent;border-radius:6px;width:28px;height:28px;cursor:pointer;flex-shrink:0;font-size:16px;line-height:1}

  .aemo{font-size:11px;padding:1px 5px;border-radius:6px;margin-right:3px;border:0.5px solid #3a4d22;white-space:nowrap}
  .aemo.s{background:#1f3d12;border-color:#4a6b1f;color:var(--gold)}
  .aemo.w{background:#3a1a1a;border-color:#6b2f2f;color:#ffb4b4}
  .tbchip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;border:0.5px solid #3a4d22;color:var(--blue);margin:0 3px 4px 0;cursor:pointer;font-weight:600}

  .pkg{display:inline-flex;align-items:center;gap:6px;background:#22301a;border:0.5px solid #3a4d22;border-radius:7px;padding:3px 8px;margin:0 5px 5px 0;font-size:12px}

  .slot.drop-ok{border-color:var(--gold);border-style:solid;background:rgba(245,196,81,.10)}
  .slotlbl{flex:0 0 34px;font-size:11px;font-weight:800;color:var(--gold);text-align:center;letter-spacing:.3px}
  .hofgold{border:1px solid #e6c84e !important;background:linear-gradient(135deg,rgba(201,162,39,.22),rgba(255,228,130,.05)) !important;box-shadow:0 0 9px rgba(201,162,39,.35)}
  .lbgrid{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:680px){.lbgrid{grid-template-columns:1fr 1fr}}
  .pctrow{display:flex;align-items:center;gap:7px;margin:4px 0}
  .pctlbl{flex:0 0 90px;font-size:12px}
  .pctval{flex:0 0 40px;font-size:11px;color:var(--dim);text-align:right}
  .pcttrack{flex:1;height:6px;border-radius:4px;background:linear-gradient(90deg,#3661ad,#b0b0b0,#d22d49);position:relative}
  .pctdot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;border:2px solid var(--panel);transform:translate(-50%,-50%)}
  .pctnum{flex:0 0 24px;text-align:center;font-size:13px;font-weight:700}
  .happyring{display:inline-flex;padding:2.5px;border-radius:7px;vertical-align:middle}
  .happyinner{display:inline-flex;align-items:center;justify-content:center;min-width:20px;padding:1px 4px;border-radius:5px;background:var(--panel)}
  .pcard{display:inline-flex;align-items:center;flex-wrap:wrap;gap:5px;padding:4px 8px;border:0.5px solid #2c3a1c;border-radius:8px;background:var(--panel2);cursor:grab}
  .pcard:active{cursor:grabbing}
  .pcard.dragging{opacity:.4}
  .benchzone{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1px dashed #3a4d22;border-radius:9px;background:rgba(255,255,255,.015)}
  .benchzone.drop-ok{border-color:var(--gold);border-style:solid;background:rgba(245,196,81,.08)}
  .favtrack{height:16px;border-radius:8px;background:#22301a;border:1px solid var(--line);overflow:hidden}
  .favbar{height:100%;border-radius:7px;transition:width .4s ease}
  .favbar.bdiamond{background:linear-gradient(90deg,#7fd8ff,#b8eaff,#8ad0ff,#cfeeff);background-size:200% 100%;animation:favshine 2.2s linear infinite}
  .favbar.irid{background:linear-gradient(90deg,#a6ff2b,#37e0c8,#7b9bff,#ff7bd5,#a6ff2b);background-size:300% 100%;animation:favshine 2.6s linear infinite}
  @keyframes favshine{0%{background-position:0% 0}100%{background-position:200% 0}}
  .savebtn{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;
    display:none;align-items:center;gap:4px;background:var(--panel2);color:var(--ink);border:1px solid var(--gold);
    border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .saveov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 14px}
  .savebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;margin:auto}
  .savecode{width:100%;height:70px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;
    font-family:monospace;font-size:11px;padding:8px;resize:vertical;word-break:break-all;-webkit-user-select:text;user-select:text}
  .grid2>*{min-width:0}                 /* let grid columns shrink so cards never overflow the panel */
  .tbrow{flex-wrap:wrap;max-width:100%;overflow:hidden}
  .tbrow .tbval{margin-left:auto}
  .tbrow .small{white-space:normal;word-break:break-word}
</style>

const isPit=p=>p.pos==="SP"||p.pos==="RP";
const isHit=p=>!isPit(p);
function ovrClass(o){return o>=88?'elite':o>=80?'good':o>=70?'avg':'low';}
// 80-99 ramps yellow -> bright laser green; below that stays muted
function ovrColor(o){
  if(o<70)return 'var(--dim)';
  if(o<80)return '#cdd6bf';
  const t=clamp((o-80)/19,0,1);
  const r=Math.round(255+(166-255)*t),g=Math.round(226+(255-226)*t),b=Math.round(61+(43-61)*t);
  return `rgb(${r},${g},${b})`;
}
// Realized ceiling: scouted potential is NOT a guarantee.
// 25% reach it exactly, 60% land within 10 below, 15% within 20 below.
function rollRealCeil(pot){const r=Math.random();let rc;
  if(r<0.25)rc=pot; else if(r<0.85)rc=pot-rnd(3,10); else rc=pot-rnd(11,20);
  return Math.round(rc);}
function rollDura(age){return clamp(round(gauss(72,15)-Math.max(0,(age-31))*0.9),26,99);}
// ---- granular hidden attributes (report card) ----
const HIT_ATTRS=["contact","power","speed","eye","defense"];
const PIT_ATTRS=["velocity","control","spin","whiff"];
const ATTR_LABEL={contact:"Contact",power:"Power",speed:"Speed",eye:"Eye",defense:"Def",velocity:"Velo",control:"Ctrl",spin:"Spin",whiff:"Whiff"};
function genAttrs(pos){
  const pitcher=pos==="SP"||pos==="RP";const keys=pitcher?PIT_ATTRS:HIT_ATTRS;const bias={};
  if(!pitcher){HIT_ATTRS.forEach(k=>bias[k]=0);
    if(pos==="1B"||pos==="DH"){bias.power+=9;bias.speed-=9;bias.defense-=4;}
    else if(pos==="LF"||pos==="RF"){bias.power+=5;bias.speed-=1;bias.defense-=2;}
    else if(pos==="CF"){bias.speed+=8;bias.defense+=5;bias.power-=4;}
    else if(pos==="SS"||pos==="2B"){bias.speed+=6;bias.defense+=7;bias.power-=6;}
    else if(pos==="C"){bias.defense+=8;bias.speed-=10;}
    else if(pos==="3B"){bias.power+=3;bias.defense+=3;bias.speed-=2;}}
  const offs={};let sum=0;keys.forEach(k=>{const o=gauss(bias[k]||0,7);offs[k]=o;sum+=o;});
  const mean=sum/keys.length;keys.forEach(k=>offs[k]=Math.round(offs[k]-mean));   // center so avg ≈ OVR
  return offs;
}
function attrVal(p,k){return clamp(round((p.ovr||50)+((p.attr&&p.attr[k])||0)),20,99);}
/* ============================================================
   PLAYER STATS — derive realistic season lines + Statcast metrics from attributes.
   Seeded per (player, year) so a line is stable when recomputed.
   ============================================================ */
function _hash(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function srng(seed){let s=_hash(seed)||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
// skill-based metrics (no luck) used for the Savant percentile rankings
function hitterMetrics(p){const av=k=>attrVal(p,k);const power=av('power'),contact=av('contact'),eye=av('eye'),speed=av('speed'),defense=av('defense');
  const off=power*0.40+contact*0.35+eye*0.25;
  return {xwoba:clamp(0.250+(off-50)*0.0044,0.230,0.470),xba:clamp(0.232+(contact-50)*0.0028,0.205,0.330),
    xslg:clamp(0.360+(power-50)*0.0053,0.300,0.660),barrel:clamp((power-55)*0.30+(contact-50)*0.05,1,24),
    hardhit:clamp(30+(power-50)*0.46,18,62),exitvelo:clamp(86+(power-50)*0.12,84,95.5),
    kpct:clamp(29.5-(contact-50)*0.35,10,36),bbpct:clamp(4.5+(eye-50)*0.21,2,20),
    whiff:clamp(24-(contact-50)*0.26+(power-50)*0.05,8,40),chase:clamp(30-(eye-50)*0.23,16,42),
    sprint:clamp(26+(speed-50)*0.062,23,30.6),arm:clamp(40+(defense-50)*0.7,28,55),oaa:clamp((defense-50)*0.45,-18,22)};}
function pitcherMetrics(p){const av=k=>attrVal(p,k);const velo=av('velocity'),control=av('control'),spin=av('spin'),whiff=av('whiff');
  return {xera:clamp(4.8-(velo*0.3+control*0.35+whiff*0.35-50)*0.052,1.6,6.2),xwoba:clamp(0.345-(velo*0.3+control*0.3+whiff*0.4-50)*0.0035,0.230,0.420),
    kpct:clamp(15+(whiff-50)*0.42+(velo-50)*0.12,10,42),bbpct:clamp(9.5-(control-50)*0.13,3,15),
    whiffpct:clamp(20+(whiff-50)*0.40,10,40),chase:clamp(24+(control-50)*0.14+(whiff-50)*0.10,16,40),
    velomph:clamp(90.5+(velo-50)*0.165,87,102),spinrpm:clamp(2150+(spin-50)*8,1850,2700),
    hardhit:clamp(40-(whiff-50)*0.30-(control-50)*0.12,24,52),groundpct:clamp(43+(spin-50)*0.18,32,56)};}
// a full season line (counting + rate), seeded with luck
function genHitterLine(p,role,year){
  const R=srng((p.id||p.name)+"|"+year+"|h"),rn=(a,b)=>R()*(b-a)+a,av=k=>attrVal(p,k);
  const contact=av('contact'),power=av('power'),eye=av('eye'),speed=av('speed');
  const health=clamp(1-(p.inj||0)/162,0.18,1);
  let games=role==='bench'?Math.round(rn(40,95)*Math.max(health,0.6)):Math.round((150+rn(-7,5))*health);
  games=clamp(games,1,162);
  const pa=Math.max(1,Math.round(games*(role==='bench'?3.3:4.35)));
  const kRate=clamp(0.295-(contact-50)*0.0035+rn(-0.02,0.02),0.10,0.37);
  const bbRate=clamp(0.045+(eye-50)*0.0021+rn(-0.01,0.01),0.02,0.21);
  const hbp=Math.round(pa*0.008),bb=Math.round(pa*bbRate),so=Math.round(pa*kRate);
  const ab=Math.max(1,pa-bb-hbp);
  const hr=Math.round(pa*clamp((power-50)*0.00108+0.007+rn(-0.006,0.006),0.002,0.082));
  const babip=clamp(0.290+(contact-50)*0.0009+(speed-50)*0.0006+rn(-0.028,0.028),0.230,0.385);
  const bip=Math.max(0,ab-so-hr),bipHits=Math.round(bip*babip);
  const dbl=Math.round(bipHits*clamp(0.175+(power-50)*0.0011,0.10,0.32));
  const trp=Math.round(bipHits*clamp(0.014+(speed-50)*0.0009,0.002,0.05));
  const singles=Math.max(0,bipHits-dbl-trp),h=singles+dbl+trp+hr,tb=singles+2*dbl+3*trp+4*hr;
  const sb=Math.round(clamp((speed-55)*0.5,0,42)*(games/150)*rn(0.7,1.2));
  const rbi=Math.max(0,Math.round(hr*1.75+(h-hr)*0.33+12*health+rn(-6,6)));
  const r=Math.max(0,Math.round((h+bb)*0.30+hr*0.55+sb*0.25+rn(-5,5)));
  const woba=((0.69*bb)+(0.72*hbp)+(0.89*singles)+(1.27*dbl)+(1.62*trp)+(2.10*hr))/pa;
  return {type:'h',year,role,g:games,pa,ab,h,dbl,trp,hr,bb,so,sb,rbi,r,
    avg:+(h/ab).toFixed(3),obp:+((h+bb+hbp)/pa).toFixed(3),slg:+(tb/ab).toFixed(3),ops:+((h+bb+hbp)/pa+tb/ab).toFixed(3),woba:+woba.toFixed(3)};
}
function genPitcherLine(p,role,year){
  const R=srng((p.id||p.name)+"|"+year+"|p"),rn=(a,b)=>R()*(b-a)+a,av=k=>attrVal(p,k);
  const velo=av('velocity'),control=av('control'),spin=av('spin'),whiff=av('whiff');
  const sp=(role!=='RP'&&p.pos==='SP'); const health=clamp(1-(p.inj||0)/162,0.18,1);
  const gs=sp?Math.round((31+rn(-3,2))*health):0;
  const g=sp?gs:Math.round((62+rn(-8,8))*health);
  const ip=Math.max(1,sp?Math.round(gs*clamp(5.7+(control-50)*0.01,4.5,6.6)):Math.round(g*rn(0.9,1.2)));
  const k9=clamp(6.5+(whiff-50)*0.09+(velo-50)*0.04+rn(-0.6,0.6),4,14.5);
  const bb9=clamp(4.3-(control-50)*0.05+rn(-0.4,0.4),1.1,6.2);
  const hr9=clamp(1.3-(whiff-50)*0.006-(control-50)*0.004+rn(-0.2,0.2),0.4,2.3);
  const k=Math.round(ip/9*k9),bb=Math.round(ip/9*bb9),hr=Math.round(ip/9*hr9);
  const hits=Math.round(ip*clamp((9.6-k9*0.42-(control-50)*0.012)/9,0.62,1.18));
  const fip=clamp((13*hr+3*bb-2*k)/ip+3.15+rn(-0.35,0.35),1.6,6.8);
  const whip=+((bb+hits)/ip).toFixed(2);
  let w,l;
  if(sp){w=clamp(Math.round((4.6-fip)*2.4+9+rn(-2,2)),1,24);l=clamp(Math.round(gs*0.42-(w-9)*0.5+rn(-2,2)),1,18);}
  else{w=clamp(Math.round((4.6-fip)*1.0+3+rn(-2,2)),0,12);l=clamp(Math.round(4+rn(-2,3)),0,11);}
  const sv=(!sp&&av('velocity')>=70&&whiff>=70)?Math.round(clamp((whiff-60)*1.2,0,45)*health):0;
  return {type:'p',year,role:sp?'SP':'RP',g,gs,w,l,sv,ip,k,bb,hr,hits,
    era:+fip.toFixed(2),whip,k9:+k9.toFixed(1),bb9:+bb9.toFixed(1)};
}
// what role a player fills this season (drives playing time)
function statRole(p){
  if(isPit(p))return (p.pos==='RP')?'RP':'SP';
  if(p.loc==="mlb"&&typeof G!=="undefined"&&G){try{const a=buildActive(G.roster);
    const starter=[...LINEUP.map(s=>a.lineup[s]),...a.rotation,...a.pen].some(x=>x&&x.id===p.id);
    return starter?'starter':'bench';}catch(e){}}
  return 'starter';
}
function metricsOf(p){return isPit(p)?pitcherMetrics(p):hitterMetrics(p);}

function leaguePopulation(){let a=[];try{a=[].concat(G.roster||[],G.farm||[],G.pool||[]);}catch(e){}return a;}

function leagueMetricArray(key,pit){

function pctile(v,arr,lowerBetter){if(!arr||!arr.length)return 50;let below=0;for(const x of arr)if(x<v)below++;let pc=Math.round(below/arr.length*100);if(lowerBetter)pc=100-pc;return clamp(pc,1,99);}

function generateSeasonStats(){
  if(typeof G==="undefined"||!G)return;
  (G.roster||[]).filter(p=>p.loc==="mlb").forEach(p=>{
    p.seasons=p.seasons||[];
    if(p.seasons.some(s=>s.year===G.year))return;

function careerTotals(seasons,pit){
  const t=pit?{g:0,gs:0,w:0,l:0,sv:0,ip:0,k:0,bb:0,hr:0,hits:0,years:0}:{g:0,pa:0,ab:0,h:0,dbl:0,trp:0,hr:0,bb:0,so:0,sb:0,rbi:0,r:0,years:0};
  seasons.forEach(s=>{t.years++;Object.keys(t).forEach(k=>{if(k!=='years'&&typeof s[k]==='number')t[k]+=s[k];});});
  if(pit){t.era=t.ip?+((13*t.hr+3*t.bb-2*t.k)/t.ip+3.15).toFixed(2):0;t.whip=t.ip?+((t.bb+t.hits)/t.ip).toFixed(2):0;}
  else{t.avg=t.ab?+(t.h/t.ab).toFixed(3):0;t.obp=t.pa?+((t.h+t.bb)/t.pa).toFixed(3):0;
    const tb=(t.h-t.dbl-t.trp-t.hr)+2*t.dbl+3*t.trp+4*t.hr;t.slg=t.ab?+(tb/t.ab).toFixed(3):0;t.ops=+(t.obp+t.slg).toFixed(3);}

// top-heavy pick scale: a #1 is a premium asset you can't assemble from scraps
const PICK_VALUES=[0,90,72,60,50,43,37,32,28,24,21,18,16,14,12,11,10];
function pickValue(slot){return PICK_VALUES[clamp(round(slot),1,16)]||9;}

/* ---------- position flexibility (OVR-gated) ---------- */
const LINEUP=["C","1B","2B","3B","SS","LF","CF","RF","DH"];
function flexPositions(p){
  const o=p.ovr, s=new Set([p.pos]);
  switch(p.pos){
    case "SS": if(o>=85){s.add("2B");s.add("3B");} if(o>=99)s.add("CF"); break;
    case "3B": if(o>=85)s.add("1B"); if(o>=95)s.add("SS"); if(o>=99)s.add("2B"); break;
    case "1B": if(o>=85)s.add("3B"); if(o>=95)s.add("2B"); if(o>=99)s.add("C"); break;
    case "CF": if(o>=85){s.add("LF");s.add("RF");} if(o>=95)s.add("1B"); if(o>=99)s.add("SS"); break;
    case "LF": s.add("RF"); if(o>=85)s.add("1B"); if(o>=95)s.add("CF"); if(o>=99)s.add("3B"); break;
    case "RF": s.add("LF"); if(o>=85)s.add("1B"); if(o>=95)s.add("CF"); if(o>=99)s.add("3B"); break;
    case "SP": if(o>=90)s.add("RP"); break;
    case "RP": if(o>=95)s.add("SP"); break;
    case "C": if(o>=90)s.add("1B"); if(o>=99)s.add("2B"); break;
  }
  return s;
}
function canPlaySlot(p,slot){ if(isPit(p))return false; if(slot==="DH")return true; return flexPositions(p).has(slot); }
function posCoversSlot(pos,slot){ if(pos===slot)return true; if(slot==="DH")return true;
  const OF=["LF","CF","RF"]; return OF.includes(pos)&&OF.includes(slot); }
// slot model: 9 lineup slots + SP1..SP4 + RP1..RP3. Users can manually assign any eligible player.
const ROT_SLOTS=["SP1","SP2","SP3","SP4","SP5"], PEN_SLOTS=["RP1","RP2","RP3"];
function eligibleForSlot(p,slot){
  if(ROT_SLOTS.includes(slot))return isPit(p)&&flexPositions(p).has("SP");
  if(PEN_SLOTS.includes(slot))return isPit(p)&&flexPositions(p).has("RP");
  return canPlaySlot(p,slot);
}
function buildActive(roster){
  const mlb=roster.filter(p=>p.loc==="mlb"&&!p._il);   // Injured-List players are unavailable (don't fill slots)
  const byId=id=>mlb.find(p=>p.id===id);
  const manual=(typeof G!=="undefined"&&G&&G.manualLineup);
  const LS=(typeof G!=="undefined"&&G&&G.lineupSet)||{};
  const used=new Set(),lineup={},rotation=[],pen=[];
  const place=(slot,p)=>{ if(ROT_SLOTS.includes(slot))rotation[ROT_SLOTS.indexOf(slot)]=p;
    else if(PEN_SLOTS.includes(slot))pen[PEN_SLOTS.indexOf(slot)]=p; else lineup[slot]=p; };
  // 1) honor valid user assignments first
  [...LINEUP,...ROT_SLOTS,...PEN_SLOTS].forEach(slot=>{
    const id=LS[slot]; if(!id)return; const p=byId(id);
    if(p&&!used.has(p.id)&&eligibleForSlot(p,slot)){place(slot,p);used.add(p.id);}
  });
  // 2) in AUTO mode, fill the rest with the best available; in MANUAL mode, leave gaps (replacement level)
  if(!manual){
    ["C","SS","2B","3B","1B","CF","LF","RF","DH"].forEach(slot=>{
      if(lineup[slot])return;
      const elig=mlb.filter(p=>!used.has(p.id)&&canPlaySlot(p,slot)).sort((a,b)=>eff(b)-eff(a));
      if(elig[0]){lineup[slot]=elig[0];used.add(elig[0].id);} else lineup[slot]=null;
    });
    for(let i=0;i<ROT_SLOTS.length;i++){ if(rotation[i])continue;
      const p=mlb.filter(x=>isPit(x)&&flexPositions(x).has("SP")&&!used.has(x.id)).sort((a,b)=>eff(b)-eff(a))[0];
      if(p){rotation[i]=p;used.add(p.id);} else rotation[i]=null; }
    for(let i=0;i<PEN_SLOTS.length;i++){ if(pen[i])continue;
      const p=mlb.filter(x=>isPit(x)&&flexPositions(x).has("RP")&&!used.has(x.id)).sort((a,b)=>eff(b)-eff(a))[0];
      if(p){pen[i]=p;used.add(p.id);} else pen[i]=null; }
  } else {
    ["C","SS","2B","3B","1B","CF","LF","RF","DH"].forEach(slot=>{if(!lineup[slot])lineup[slot]=null;});
    for(let i=0;i<ROT_SLOTS.length;i++)if(!rotation[i])rotation[i]=null;
    for(let i=0;i<PEN_SLOTS.length;i++)if(!pen[i])pen[i]=null;
  }
  return {lineup,rotation:rotation.slice(0,ROT_SLOTS.length),pen:pen.slice(0,PEN_SLOTS.length),used};
}
function teamWAR(roster){
  const a=buildActive(roster);let w=0;
  LINEUP.forEach(s=>{w+=a.lineup[s]?eff(a.lineup[s]):REP_BAT;});
  for(let i=0;i<ROT_SLOTS.length;i++)w+=a.rotation[i]?eff(a.rotation[i]):REP_SP;
  for(let i=0;i<PEN_SLOTS.length;i++)w+=a.pen[i]?eff(a.pen[i]):REP_RP;
  return w;
}

function rollSeasonInjuries(){
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  mlb.forEach(p=>{p.inj=0;p.injType=null;p._il=false;});
  const injured=[];const hm=G.hard?1.5:1;   // Hard Mode: more realistic (higher) injury frequency
  mlb.forEach(p=>{
    const dura=p.dura==null?70:p.dura;
    const chance=Math.min(clamp((100-dura)/205+Math.max(0,(p.age-30))*0.005,0.03,0.55)*hm,0.7);
    if(Math.random()<chance){
      const longChance=clamp(0.18+Math.max(0,(p.age-30))*0.012+(100-dura)/420,0.1,0.55);
      let games,type;
      if(Math.random()<longChance){games=ri(60,150);type="long";if(Math.random()<0.12)games=162;}
      else{games=ri(12,52);type="short";}
      p.inj=games;p.injType=type;injured.push(p);
      if(G.hard&&type==="long")p._il=true;   // out more than one break → onto the Injured List
    }
  });
  G._seasonInjured=injured;G._injRolled=G.year;
  return injured;
}
function simulateRegularSeason(){
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  if(G._injRolled!==G.year)rollSeasonInjuries();   // Hard Mode pre-rolls injuries at a break; otherwise roll now
  const injured=(G._seasonInjured||[]).filter(p=>p.loc==="mlb"&&G.roster.indexOf(p)>=0);
  const _sv=mlb.map(p=>p.inj),_svil=mlb.map(p=>p._il);mlb.forEach(p=>{p.inj=0;p._il=false;});const healthyWAR=teamWAR(G.roster);mlb.forEach((p,i)=>{p.inj=_sv[i];p._il=_svil[i];});
  if(G.mode==="survivor"){
    // endless mode: every club chases its OWN goal — some go all-in (contenders), some tear it down (tankers),
    // and they re-roll their aim over time. That keeps a wide, living spread (true contenders AND tankers), not a middling blob.
    G.ai.forEach(t=>{
      if(t.tgt==null||Math.random()<0.11)t.tgt=clamp(Math.round(gauss(33,14)),14,56);   // commit to a multi-year plan, re-roll occasionally
      t.war=clamp(t.war+(t.tgt-t.war)*0.45+gauss(0,2.2),12,58);                          // push toward it harder so contenders/tankers reach the extremes
    });
  } else {
    // 6-year arc: rival clubs improve over time as their own farms develop — the league bar rises each year (faster on Hard)
    G.ai.forEach(t=>{let d=((t.mode==="rebuild"?gauss(1.6,2):t.mode==="contend"?gauss(0.5,2):gauss(0.2,1.7))+gauss(0.7,0.5))*(G.hard?1.4:1);
      t.war=clamp(t.war+d,10,60);});
  }
  const myWAR=teamWAR(G.roster);
  const injWinsLost=clamp(round((healthyWAR-myWAR)*1.4),0,99);
  const entries=[{name:G.teamName,war:myWAR,me:true,league:G.league,div:G.div},...G.ai.map(t=>({name:t.name,war:t.war,league:t.league,div:t.div,id:t.id}))];
  entries.forEach(e=>{e.wins=clamp(round(warToWins(e.war)+gauss(0,4.6)),47,116);e.losses=162-e.wins;});
  if(G.hard){const me0=entries.find(e=>e.me);me0.wins=clamp(me0.wins-ri(3,6),40,116);me0.losses=162-me0.wins;}   // Hard: a tougher schedule shaves a few wins
  // luxury tax: every $10M of payroll over $300M costs the user 1 win
  const tax=luxuryTax();
  G.maxPayroll=Math.max(G.maxPayroll||0,payroll(G.roster));
  if(tax>0){const m=entries.find(e=>e.me);m.wins=clamp(m.wins-tax,40,116);m.losses=162-m.wins;
    G.taxYears=(G.taxYears||0)+1;G.taxWinsLost=(G.taxWinsLost||0)+tax;}
  entries.sort((a,b)=>b.wins-a.wins);entries.forEach((e,i)=>e.seed=i+1);   // overall seed = draft order (worst drafts #1)
  const field=mlbPlayoffField(entries);          // 12 playoff teams, seeded 1–6 within each league
  const me=entries.find(e=>e.me);
  // stash regular-season results; the bracket runs after the player sets their playoff roster
  G._po={entries,injured,tax,injWinsLost,healthyWAR};
  return {me,madePO:!!me.playoff,entries,field};
}

// non-interactive callers (bots/tests) run the whole season in one shot
function simulateSeason(){simulateRegularSeason();return runPlayoffsAndFinish();}
let _poInfo={reachedWS:false,rounds:0};   // how far the user advanced in October (for Survivor favor)
// Build the 12-team field: per league, 3 division winners (seeds 1–3 by record) + 3 wild cards (seeds 4–6).
function mlbPlayoffField(entries){
  const field=[];
  entries.forEach(e=>{e.playoff=false;e.divRank=null;});
  LEAGUES.forEach(L=>{
    const lg=entries.filter(e=>e.league===L.key);
    const winners=[];
    DIV_KEYS.forEach(d=>{const dv=lg.filter(e=>e.div===d).sort((a,b)=>b.wins-a.wins);
      dv.forEach((e,i)=>e.divRank=i+1);
      if(dv[0])winners.push(dv[0]);});
    winners.sort((a,b)=>b.wins-a.wins);                                  // div winners seeded 1–3
    const wc=lg.filter(e=>!winners.includes(e)).sort((a,b)=>b.wins-a.wins).slice(0,3);  // wild cards 4–6
    const six=[...winners,...wc];six.forEach((e,i)=>{e.lgSeed=i+1;e.playoff=true;});
    field.push({league:L.key,teams:six});
  });
  return field;
}
// Run the current MLB bracket (WC: 3v6 & 4v5; 1–2 bye; DS; LCS; WS) and return the champion.
function runMLBPlayoffs(field){
  const cb=1+(((G.resources?G.resources.coaching:0.333)-0.333)*0.32);
  const dm=1+(teamDawg()-50)/50*0.10;
  const chem=1+(teamChem()-60)/40*0.08;   // a happy clubhouse: chemistry is a small October edge
  _poInfo={reachedWS:false,rounds:0};
  const series=(a,b)=>{ if(!a)return b; if(!b)return a;
    const sa=(a.war+22)*(a.me?cb*dm*chem:1), sb=(b.war+22)*(b.me?cb*dm*chem:1);
    const pa=clamp(sa/(sa+sb),0.30,0.68); const w=Math.random()<pa?a:b;
    if((a.me||b.me)&&w.me)_poInfo.rounds++;
    return w; };
  const champ={};
  field.forEach(({league,teams})=>{
    const s={};teams.forEach(t=>s[t.lgSeed]=t);
    const wcA=series(s[3],s[6]), wcB=series(s[4],s[5]);   // wild card round (1 & 2 rest)
    const wcW=[wcA,wcB].sort((a,b)=>a.lgSeed-b.lgSeed);
    const dsA=series(s[1], wcW[wcW.length-1]);            // 1 seed vs lowest remaining
    const dsB=series(s[2], wcW[0]);
    champ[league]=series(dsA,dsB);                        // league championship
  });
  if((champ.AL&&champ.AL.me)||(champ.NL&&champ.NL.me))_poInfo.reachedWS=true;
  return series(champ.AL,champ.NL);                       // World Series
}

    homegrown:p.src==="draft",reason:reason||'retired',score:hofScore(p),leagueHof:!!p._leagueHof,leagueVote:p._leagueHofVote||0});}

function leagueHofScore(p){const peak=p._peak||p.ovr;

let _own=null;   // in-progress buy-in selections
function ownInit(){_own={teamIdx:null,baseIdx:null,upgrades:[],facilities:[],gm:null,analytics:null,scout:null,coach:null};}
function ownSpent(){if(!_own)return 0;let s=0;
  if(_own.teamIdx!=null)s+=OWNER_TEAMS[_own.teamIdx].price;
  if(_own.baseIdx!=null)s+=STADIUM_BASES[_own.baseIdx].cost;
  _own.upgrades.forEach(id=>{const u=STADIUM_UPGRADES.find(x=>x.id===id);if(u)s+=u.cost;});
  _own.facilities.forEach(id=>{const f=FACILITY_OPTS.find(x=>x.id===id);if(f)s+=f.cost;});
  if(_own.gm!=null)s+=GM_TIERS[_own.gm].cost;
  if(_own.analytics!=null)s+=ANALYTICS_TIERS[_own.analytics].cost;
  if(_own.scout!=null)s+=SCOUT_TIERS[_own.scout].cost;
  if(_own.coach!=null)s+=COACH_TIERS[_own.coach].cost;
  return s;}
function ownLeft(){return OWNER_BUDGET-ownSpent();}
function ownBudgetBar(){const left=ownLeft(),pct=clamp(Math.round(left/OWNER_BUDGET*100),0,100);
  const col=left<200?'var(--red)':left<700?'var(--gold)':'var(--green)';
  return `<div class="panel" style="position:sticky;top:0;z-index:5;padding:10px 12px;border-color:${col}">
    <div class="row" style="align-items:center;justify-content:space-between"><span style="font-weight:800">💰 Budget remaining</span>
      <span style="font-weight:800;color:${col};font-size:18px">${fmtB(left)}</span></div>
    <div class="favtrack" style="height:8px;margin-top:6px"><div class="favbar" style="width:${pct}%;background:${col}"></div></div>
    <div class="small muted" style="margin-top:4px">Spent ${fmtB(ownSpent())} of ${fmtB(OWNER_BUDGET)} · whatever's left becomes your franchise's starting <b>cash reserve</b>.</div>
  </div>`;}
function ownStepBar(step){const steps=["Team","Ballpark","Upgrades","Facilities","Front office","Review"];
  return `<div class="row" style="gap:5px;margin:8px 0;flex-wrap:wrap">${steps.map((s,i)=>`<span class="pill ${i===step?'gold':''}" style="${i===step?'':'opacity:.5'};padding:2px 9px">${i+1}. ${s}</span>`).join("")}</div>`;}

function ownerToggle(listKey,id,catalog,reRender){
  const list=_own[listKey];const at=list.indexOf(id);
  if(at>=0){list.splice(at,1);}
  else{const item=catalog.find(x=>x.id===id);if(item.cost>ownLeft()){toast("Not enough budget for that.");return;}list.push(id);}
  reRender();}
function ownChecklist(catalog,listKey,reRenderName){
  return catalog.map(it=>{const on=_own[listKey].includes(it.id);const afford=on||it.cost<=ownLeft();
    const tags=[];if(it.fan)tags.push(`📣 +${it.fan}`);if(it.rev)tags.push(`💵 ${'★'.repeat(Math.round(it.rev*2))||'·'}`);
    if(it.cap)tags.push(`🎟️ ${it.cap>0?'+':''}${it.cap}`);if(it.dev)tags.push(`📈 dev`);if(it.heal)tags.push(`🏥 health`);
    if(it.farm)tags.push(`🌱 farm`);if(it.happy)tags.push(`😊 morale`);if(it.coach)tags.push(`🎓 staff`);
    return `<div class="panel2" style="border:1.5px solid ${on?'var(--gold)':'var(--line)'};border-radius:10px;padding:11px;margin-bottom:8px;${afford?'':'opacity:.5'}">
      <div class="row" style="align-items:flex-start;justify-content:space-between;gap:10px">

// derive the franchise modifiers from the buy-in choices
function ownerDerive(){
  const t=OWNER_TEAMS[_own.teamIdx],b=STADIUM_BASES[_own.baseIdx];
  const ups=_own.upgrades.map(id=>STADIUM_UPGRADES.find(x=>x.id===id));
  const facs=_own.facilities.map(id=>FACILITY_OPTS.find(x=>x.id===id));
  const gm=GM_TIERS[_own.gm],an=ANALYTICS_TIERS[_own.analytics],sc=SCOUT_TIERS[_own.scout],co=COACH_TIERS[_own.coach];
  let fan=t.fan+b.fan+ups.reduce((s,u)=>s+(u.fan||0),0)+facs.reduce((s,f)=>s+(f.happy||0)*2,0);
  fan=clamp(Math.round(fan),5,100);
  const capacity=b.cap+ups.reduce((s,u)=>s+(u.cap||0),0);
  const revWeight=b.rev+ups.reduce((s,u)=>s+(u.rev||0),0);
  const revPerGame=Math.round(capacity/1000*(0.9+revWeight*0.18)*t.mult*10)/10;   // $M/game potential (next-pass finances)
  const devBonus=facs.reduce((s,f)=>s+(f.dev||0),0)+co.tier*0.4;
  const farmBonus=facs.reduce((s,f)=>s+(f.farm||0),0)+sc.tier*0.5;
  const coachBonus=co.tier+facs.reduce((s,f)=>s+(f.coach||0),0);
  const healBonus=facs.reduce((s,f)=>s+(f.heal||0),0);
  const spend=ownSpent();
  // initial valuation: what you paid + goodwill from a nice park, happy fans, and a sharp front office
  const clubValue=Math.round(t.price + b.cost*0.7 + ups.reduce((s,u)=>s+u.cost*0.6,0) + facs.reduce((s,f)=>s+f.cost*0.5,0) + fan*4 + (gm.tier+an.tier+co.tier)*25);
  const gmStars='★'.repeat(1+gm.tier)+'☆'.repeat(3-gm.tier);
  return {fan,capacity,revWeight,revPerGame,devBonus,farmBonus,coachBonus,healBonus,clubValue,spend,

    market:t.market,marketMult:t.mult,rosterAdj:t.rosterAdj,farmTier:t.farm};
}

function applyOwnerSetup(der,cashReserve){
  // roster feel: nudge the starters' OVR toward the tier you paid for
  const adj=der.rosterAdj;
  if(adj!==0){G.roster.filter(p=>p.loc==="mlb").forEach(p=>{p.ovr=clamp(p.ovr+ri(Math.min(0,adj),Math.max(0,adj)),40,99);p.pot=Math.max(p.pot,p.ovr);});}
  // farm depth scales with the tier and your scouting/academy investment
  const extraFarm=Math.max(0,der.farmTier)+Math.round(der.farmBonus);
  for(let i=0;i<extraFarm;i++){const p=ficProspect();p.loc="farm";p.src="original";G.farm.push(p);}
  if(der.farmTier<0&&G.farm.length>1)G.farm.splice(0,1);   // run-down club: a thinner system
  G.fanFavor=der.fan;

  const sPts=1+der.scoutTier+der.farmBonus, dPts=1+der.devBonus, cPts=1+der.coachBonus, tot=sPts+dPts+cPts;

function genFAMarket(){
  const list=[];const seen=new Set();
  const realPool=G.pool.filter(p=>!p.prospect&&!p.fic&&p.age>=27&&p.age<=40&&p.ovr>=66);
  const realTop=realPool.filter(p=>p.ovr>=84).sort(()=>Math.random()-0.5).slice(0,ri(1,3));
  const realRest=realPool.filter(p=>p.ovr<84).sort(()=>Math.random()-0.5).slice(0,ri(3,5));
  [...realTop,...realRest].forEach(p=>{if(seen.has(p.id))return;seen.add(p.id);p._fromPool=true;const a=faAsk(p);list.push({id:uid(),player:p,aav:a.aav,years:a.years});});
  for(let i=0;i<ri(2,3);i++){const v=ficVeteran(true);const a=faAsk(v);list.push({id:uid(),player:v,aav:a.aav,years:a.years});}  // elite
  for(let i=0;i<ri(7,9);i++){const v=ficVeteran(false);const a=faAsk(v);list.push({id:uid(),player:v,aav:a.aav,years:a.years});}
  return list.sort((a,b)=>b.player.ovr-a.player.ovr);
}

function bary(px,py,A,B,C){
  const v0=[B[0]-A[0],B[1]-A[1]],v1=[C[0]-A[0],C[1]-A[1]],v2=[px-A[0],py-A[1]];
  const d00=v0[0]*v0[0]+v0[1]*v0[1],d01=v0[0]*v1[0]+v0[1]*v1[1],d11=v1[0]*v1[0]+v1[1]*v1[1],d20=v2[0]*v0[0]+v2[1]*v0[1],d21=v2[0]*v1[0]+v2[1]*v1[1];

  const wB=(d11*d20-d01*d21)/den,wC=(d00*d21-d01*d20)/den,wA=1-wB-wC;
  return [wA,wB,wC];
}

function genOffers(){const offers=[];let guard=0;

  // never show the same draft pick (slot) in two different offers
  const seen=new Set();
  offers.forEach(o=>{o.get=o.get.filter(a=>{if(a.kind!=="pick")return true;if(seen.has(a.pick.slot))return false;seen.add(a.pick.slot);return true;});});

function genOneOffer(){
  const team=pick(G.ai),yr=G.year;
  let mode=yr<=2?(Math.random()<0.85?"sell":"swap"):yr===3?pick(["sell","buy","swap"]):(Math.random()<0.8?"buy":"swap");
  if(mode==="sell"){
    const vets=G.roster.filter(p=>p.loc==="mlb"&&(p.ovr>=76||p.age>=31)).sort((a,b)=>tradeValue(b)-tradeValue(a));
    if(!vets.length)return null;

    const target=give.reduce((s,p)=>s+tradeValue(p),0)*rnd(0.85,1.04);

    const star=pick(stars);const target=tradeValue(star)*rnd(0.95,1.15);

/* ---- need-based trade suggestion (one at a time, respin freely, auto-respins after accept) ---- */
function genSuggestion(){
  if(G.draftOrderYear!==G.year)computeDraftOrder();
  const ns=needsSurplus();
  const needs=ns.needs.slice();
  const surplusPos=new Set(ns.surplus.map(s=>s.split(' ')[0]));
  const mine=tbMine().filter(a=>a.val>=4);
  if(!mine.length)return null;
  const league=leagueAssets();
  const scoreGet=a=>{if(a.kind!=="player")return 0;let s=0;
    if(needs.some(np=>a.player.pos===np||canPlaySlot(a.player,np)))s+=3;
    if(a.player.ovr>=78||a.player.pot>=86)s+=1; return s;};
  const teams=[...G.ai].filter(t=>t.block&&t.block.length).sort(()=>Math.random()-0.5);
  for(const team of teams){
    let theirs=league.filter(a=>a.team===team.id);
    const cnt={};theirs.forEach(a=>{if(a.kind==="player")cnt[a.player.pos]=(cnt[a.player.pos]||0)+1;});
    const theirSurplus=new Set(Object.keys(cnt).filter(p=>cnt[p]>=2));
    let cands=theirs.filter(a=>a.kind==="player"&&a.val>=15&&scoreGet(a)>0);
    cands.sort((a,b)=>(scoreGet(b)+(theirSurplus.has(b.player.pos)?0.5:0))-(scoreGet(a)+(theirSurplus.has(a.player.pos)?0.5:0))||b.val-a.val);
    if(!cands.length)continue;
    const get=[cands[ri(0,Math.min(2,cands.length-1))]];
    let factor=1.0;
    if(Math.random()<0.25){const fillsNeed=needs.some(np=>get[0].player.pos===np||canPlaySlot(get[0].player,np));factor=fillsNeed?rnd(0.86,0.98):rnd(1.03,1.15);}
    const need=Math.max(1,get[0].val*factor);
    // assemble a give package that matches `need` closely (slight surplus-position preference)
    const surplusBonus=a=>(a.kind==="player"&&surplusPos.has(a.player.pos))?6:0;
    const giveable=mine.filter(a=>a.aid!==get[0].aid);
    const give=[];let v=0,cand=giveable.slice(),guard=0;
    while(v<need*0.95&&give.length<3&&cand.length&&guard++<8){
      let best=null,bg=1e9;
      for(const a of cand){const nv=v+a.val;const gap=(nv>=need?(nv-need)*0.55:(need-nv))-surplusBonus(a);if(gap<bg){bg=gap;best=a;}}
      if(!best)break;give.push(best);v+=best.val;cand.splice(cand.indexOf(best),1);}
    if(!give.length||v<need*0.8)continue;
    const fills=needs.find(np=>get[0].player.pos===np||canPlaySlot(get[0].player,np));
    const reason=`${teamShortOf(team.id)} offers ${get[0].player.pos} ${get[0].player.name}${fills?` — fills your need at ${fills}`:''}${surplusPos.size?`; they'll take from your surplus (${[...surplusPos].slice(0,2).join("/")})`:''}.`;
    return {team:team.id,get,give,reason};
  }
  return null;
}

function computeDeadlineStances(){
  const arr=G.ai.map(t=>({t,w:warToWins(t.war)}));
  arr.sort((a,b)=>b.w-a.w);
  const N=arr.length, buyN=Math.round(N*0.40), sellStart=Math.round(N*0.60);   // top ~40% buy, bottom ~40% sell
  arr.forEach((e,i)=>{ e.t._stance = i<buyN?'buyer':(i>=sellStart?'seller':'neutral'); });
  const meW=warToWins(teamWAR(G.roster));
  const ws=arr.map(e=>e.w).concat(meW).sort((a,b)=>b-a);
  const NT=ws.length, bi=Math.round(NT*0.40)-1, si=Math.round(NT*0.60);
  G._myStance = meW>=ws[clamp(bi,0,NT-1)]?'buyer':(meW<=ws[clamp(si,0,NT-1)]?'seller':'neutral');
}
function dlThreshold(partnerId,give,get){
  // returns the minimum (you send)/(you get) value ratio the partner will accept.
  // Baseline 1.0 means EXACT value is always accepted; stances only ever LOWER it
  // (a desperate team accepts a deal that tilts further against them) — never above 1.0.
  const team=G.ai.find(t=>t.id===partnerId); if(!team)return 1.0;
  const stance=team._stance||'neutral';
  const isWinNow=a=>a.kind==="player"&&a.player.ovr>=72&&!a.player.prospect;
  const isYouth=a=>a.kind==="pick"||(a.kind==="player"&&(a.player.prospect||a.player.age<=24));
  const isExpiring=a=>a.kind==="player"&&(a.player.years||0)<=1&&a.player.ovr>=66;
  const frac=(arr,fn)=>{const t=arr.reduce((s,a)=>s+a.val,0)||1;return arr.filter(fn).reduce((s,a)=>s+a.val,0)/t;};
  let thr=1.0;
  if(stance==="buyer"){ thr-=0.22*frac(give,isWinNow); }           // overpays to land your big-league talent
  else if(stance==="seller"){ thr-=0.20*frac(give,isYouth); thr-=0.10*frac(get,isExpiring); }  // dumps rentals for youth
  return clamp(thr,0.68,1.0);
}
// A win-now buyer will eat an absolute overpay (in trade-value points) to land current MLB talent,
// scaled by how much better the player they GET is than the prospect they GIVE UP (current OVR gap).
// e.g. they receive an 80 OVR bigleaguer for a 65 OVR prospect (gap 15) -> tolerate ~7 of overpay;
//      75 for 70 (gap 5) -> ~3;  90 for 55 (gap 35) -> capped at 12.
function dlBuyerTolerance(team,give,get){
  if(!team||team._stance!=='buyer')return 0;
  const mlbIn=give.filter(a=>a.kind==="player"&&!a.player.prospect&&(a.player.mlbYears||0)>0)
                  .reduce((m,a)=>Math.max(m,a.player.ovr),0);
  const proOut=get.filter(a=>a.kind==="player"&&(a.player.prospect||(a.player.mlbYears||0)===0))
                  .reduce((m,a)=>Math.max(m,a.player.ovr),0);
  if(!mlbIn||!proOut)return 0;
  const gap=mlbIn-proOut; if(gap<=0)return 0;
  return Math.min(12,Math.round(gap*0.4)+1);
}
function dlAccept(partnerId,give,get){
  const gv=give.reduce((s,a)=>s+a.val,0),gt=get.reduce((s,a)=>s+a.val,0);
  if(gt<=0)return false;
  if(gv>=gt*dlThreshold(partnerId,give,get))return true;       // ratio rule (exact value always passes)
  const tol=dlBuyerTolerance(G.ai.find(t=>t.id===partnerId),give,get);
  return gv>=gt-tol;                                            // desperate buyer eats an absolute overpay
}

  o.devBonus=facs.reduce((s,f)=>s+(f.dev||0),0)+(o.coachTier||0)*0.4;
  o.farmBonus=facs.reduce((s,f)=>s+(f.farm||0),0)+(o.scoutTier||0)*0.5;
  o.coachBonus=(o.coachTier||0)+facs.reduce((s,f)=>s+(f.coach||0),0);
  o.healBonus=facs.reduce((s,f)=>s+(f.heal||0),0);
  const sPts=1+(o.scoutTier||0)+o.farmBonus,dPts=1+o.devBonus,cPts=1+o.coachBonus,tot=sPts+dPts+cPts;
  G.resources={scouting:sPts/tot,development:dPts/tot,coaching:cPts/tot};

function recommendedMandate(){

  return 'rebuild';
}
function mandateContext(){

function gmOffseason(){
  if(G.owner._gmYear===G.year)return gmReport();   // already ran this winter — show the digest
  if(G.year>=2&&G.faYear!==G.year){G.faMarket=genFAMarket();G.faYear=G.year;}
  const o=G.owner,tier=o.gmTier,mand=o.mandate,dir=o.directives,budget=o.payrollBudget||200;
  const applied=[],pending=[];_vetoQ=[];
  const ns=needsSurplus();let needs=ns.needs.slice();
  if(dir.pitchingFirst)needs.sort((a,b)=>((b==='SP'||b==='RP')?1:0)-((a==='SP'||a==='RP')?1:0));
  const logA=(d)=>applied.push(d);const logP=(d,fn,undo)=>{pending.push(d);_vetoQ.push({desc:d,fn,undo});};
  const big=(p)=>p&&p.ovr>=84;
  // 1) REBUILD / RETOOL / GET-YOUNGER: sell veterans for youth
  if(mand==='rebuild'||mand==='retool'||dir.getYounger){
    const vets=G.roster.filter(p=>p.loc==='mlb'&&p.age>=31&&p.ovr>=72&&!p._keeperYoung).sort((a,b)=>b.ovr-a.ovr);
    const sellN=mand==='rebuild'?Math.min(3,vets.length):Math.min(1,vets.length);
    vets.slice(0,sellN).forEach(p=>{
      const desc=`Trade ${p.age}-yo ${p.pos} ${p.name} (${p.ovr} OVR${p.years<=1?', expiring':''}) for a prospect package`;
      const fn=()=>{const idx=G.roster.indexOf(p);if(idx<0)return;G.roster.splice(idx,1);
        const haul=1+(tier>=2?1:0)+(p.ovr>=86?1:0);for(let i=0;i<haul;i++){const pr=ficProspect();pr.pot=clamp(pr.pot+(tier*2)+(p.ovr-72),60,99);pr.loc='farm';pr.src='trade';G.farm.push(pr);}

let _dlMove=null;
function genDeadlineMove(){

  else if(proj<=bar-12&&mand!=='winNow')stance='sell';
  else if(Math.random()<0.5)stance=proj>=bar-8?'buy':'sell';
  if(!stance)return null;
  if(stance==='buy'){

    const rent=ficVeteran(true);rent.ovr=ovr;rent.pot=Math.max(rent.pot,ovr);rent.pos=(pos==='SP'||pos==='RP')?pos:rent.pos;rent.age=ri(28,33);rent.salary=Math.round(salaryFor(ovr,1)*0.5*10)/10;rent.years=1;rent.loc='mlb';rent.src='trade';rent.mlbYears=6;

      player:rent,proj,

const TICKET_TIERS=[null,
  {name:"Value",price:18,fan:3},{name:"Affordable",price:28,fan:1},

const MERCH_TIERS=[null,

function ownerFillRate(ticketIdx,concIdx){
  const o=G.owner;const f=fanVal();const t=TICKET_TIERS[ticketIdx||o.ticketTier||3],c=CONCESSION_TIERS[concIdx||o.concessionTier||2];

// full P&L for a season, in $M. Pass tiers to preview a pricing choice.
function ownerRevenue(ti,ci,mi){

function ownerStaffSalary(){const o=G.owner;return (GM_TIERS[o.gmTier]?GM_TIERS[o.gmTier].cost:0)+(ANALYTICS_TIERS[o.analyticsTier]?ANALYTICS_TIERS[o.analyticsTier].cost:0)+(SCOUT_TIERS[o.scoutTier]?SCOUT_TIERS[o.scoutTier].cost:0)+(COACH_TIERS[o.coachTier]?COACH_TIERS[o.coachTier].cost:0);}

function computeGrade(){
  const h=G.history;
  const early=h.filter(x=>x.year<=2),late=h.filter(x=>x.year>=4);
  const earlyAvg=early.length?early.reduce((s,x)=>s+x.wins,0)/early.length:81;
  const peakLate=Math.max(0,...late.map(x=>x.wins));
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  const coreYoung=mlb.filter(p=>p.age<=27&&p.ovr>=80).length;
  const farmQ=G.farm.filter(p=>Math.min(p.realCeil||p.pot,p.pot)>=84).length;
  const windowYears=clamp(round(coreYoung*0.9+farmQ*0.6),0,8);
  const contrib=mlb.filter(p=>p.ovr>=74);
  const hg=contrib.filter(p=>p.src==="draft").length;
  const acq=contrib.filter(p=>p.src==="fa"||p.src==="trade").length;
  const faCount=contrib.filter(p=>p.src==="fa").length;
  const hgRatio=(hg+acq)>0?hg/(hg+acq):0;
  const maxPay=Math.round(G.maxPayroll||payroll(G.roster));
  const taxYears=G.taxYears||0;
  const weakSpots=G.weakSpotsTotal||0;
  const hit100By3=h.some(x=>x.year===3&&x.wins>=100);
  const hit100Late=h.some(x=>x.year>=4&&x.wins>=100);
  const items=[];let score=0;
  const add=(label,pts)=>{items.push({label,pts});score+=pts;};
  let pk=peakLate>=111?30:peakLate>=105?25:peakLate>=100?20:peakLate>=95?15:peakLate>=90?10:peakLate>=85?5:-5;
  add(`Peak of ${peakLate} wins in your contention window`,pk);
  if(G.champions>0)add(`${G.champions} World Series title${G.champions>1?'s':''}`,15+(G.champions-1)*10);
  else items.push({label:"Never won the World Series",pts:0});
  if(hit100By3)add("Contended early — hit 100 wins by Year 3",8);
  else if(hit100Late)add("Hit 100 wins in your contention window (Yrs 4–6)",5);
  if(G.playoffApps>0)add(`${G.playoffApps} playoff appearance${G.playoffApps>1?'s':''}`,Math.min(16,G.playoffApps*4));
  else items.push({label:"Never reached the postseason",pts:0});
  let tk=earlyAvg<=66?15:earlyAvg<=70?10:earlyAvg<=75?5:0;
  if(tk)add(`Committed to the tank early (avg ${Math.round(earlyAvg)} wins, yrs 1-2)`,tk);
  else items.push({label:`Didn't truly bottom out for premium picks (avg ${Math.round(earlyAvg)} wins early)`,pts:0});
  let hgPts=(hg>=3&&hgRatio>=0.6)?15:(hg>=2&&hgRatio>=0.5)?10:hgRatio>=0.4?6:hgRatio>=0.25?3:0;
  if(hgPts)add(`Homegrown core — ${hg} drafted contributor${hg>1?'s':''} (${Math.round(hgRatio*100)}% of acquired talent)`,hgPts);
  else items.push({label:`Built mostly through trades/free agency, not the draft (${hg} homegrown)`,pts:0});
  let wPts=windowYears>=5?15:windowYears>=3?9:windowYears>=1?4:-12;
  add(`${windowYears>=5?'Wide-open':windowYears>=3?'Healthy':windowYears>=1?'Closing':'Shut'} future window (~${windowYears} yr${windowYears===1?'':'s'} ahead)`,wPts);
  if(G.awardPoints>0){const log=G.awardsLog||[];const cnts={};log.forEach(x=>cnts[x.award]=(cnts[x.award]||0)+1);
    const summ=Object.keys(cnts).map(k=>`${cnts[k]}× ${k}`).join(", ");
    add(`Individual hardware — ${summ}`,G.awardPoints);}
  let payPen=G.hard?(maxPay>300?-18:maxPay>260?-12:maxPay>220?-6:0):(maxPay>320?-12:maxPay>280?-7:maxPay>240?-3:0);
  if(payPen)add(`Bloated payroll (peaked at $${maxPay}M)${G.hard?' — the Hard Mode owner runs lean':''}`,payPen);
  if(taxYears>0)add(`Paid the luxury tax in ${taxYears} season${taxYears>1?'s':''}`,(G.hard?-8:-5)*taxYears);
  if(faCount>=3)add(`Leaned on free-agent signings (${faCount} regulars)`,-(faCount-2)*3);
  if(weakSpots>0)add(`Fielded ${weakSpots} replacement-level/sub-70 OVR starting spot${weakSpots>1?'s':''} across Yrs 4–6`,(G.hard?-8:-5)*weakSpots);
  score=Math.max(0,round(score));        // uncapped — truly great runs can exceed 100 so the leaderboard can separate them
  const lg=clamp(score,0,100);           // the letter grade is still scored out of 100
  const grade=lg>=96?'A+':lg>=93?'A':lg>=90?'A-':lg>=86?'B+':lg>=83?'B':lg>=80?'B-':lg>=76?'C+':lg>=73?'C':lg>=69?'C-':lg>=66?'D+':lg>=63?'D':lg>=60?'D-':'F';
  let blurb;
  if(G.champions>=1&&peakLate>=100&&hgRatio>=0.5)blurb="The blueprint, executed to perfection — you tanked, drafted a homegrown core, and raised a banner. Front-office legend.";
  else if(G.champions>=1)blurb="You brought home a title. However you got there, the ring is the ring.";
  else if(peakLate>=95)blurb="You built a contender and knocked on the door — just couldn't break through in October.";
  else if(earlyAvg<=72&&peakLate<88)blurb="You tore it down but the rise never fully arrived. Too many picks missed, or you sold the future too cheap.";
  else blurb="A middling six years — never bad enough to stock elite picks, never good enough to truly contend.";
  const winTxt=windowYears>=5?"wide open":windowYears>=3?"open":windowYears>=1?"closing":"shut";
  return {score,grade,blurb,items,windowYears,winTxt,hg,maxPay};
}

/* ============================================================
   PLAYER PROFILE — XP, levels, unlocks, Create-A-Player
   (lives in its own localStorage key, so it persists across franchises)
   ============================================================ */
const PROFILE_KEY="tankCommander_profile_v1";
function loadProfile(){try{return Object.assign({xp:0,gamesPlayed:0,createdPlayer:null},JSON.parse(localStorage.getItem(PROFILE_KEY)||"{}"));}catch(e){return {xp:0,gamesPlayed:0,createdPlayer:null};}}
function saveProfile(){PROFILE.updated=Date.now();try{localStorage.setItem(PROFILE_KEY,JSON.stringify(PROFILE));}catch(e){}if(typeof cloudSync==="function")cloudSync();}
let PROFILE=loadProfile();
const MAX_LEVEL=30;
function levelOf(xp){return Math.min(MAX_LEVEL,1+Math.floor(Math.sqrt(Math.max(0,xp||0)/40)));}
function xpForLevel(L){return Math.pow(L-1,2)*40;}
function plLevel(){return levelOf(PROFILE.xp);}
function addXP(amt){PROFILE.xp=(PROFILE.xp||0)+Math.max(0,Math.round(amt));saveProfile();}
// unlocks by level
const POS_UNLOCK=[[2,"RF"],[3,"LF"],[4,"CF"],[5,"1B"],[6,"3B"],[7,"DH"],[8,"2B"],[9,"SS"],[10,"C"],[12,"SP"],[14,"RP"]];
function unlockedPositions(){const L=plLevel();return POS_UNLOCK.filter(u=>L>=u[0]).map(u=>u[1]);}
function attrPointsForLevel(){const L=plLevel();return L<2?0:clamp(Math.round(6+(L-2)*1.6),6,52);}
function allocMaxForLevel(){return clamp(Math.round(5+plLevel()*0.4),5,16);}
function ceilCapForLevel(){return clamp(Math.round(82+(plLevel()-2)*0.65),82,99);}
function capUnlocked(){return (PROFILE.gamesPlayed||0)>=1;}
function awardFranchiseXP(seasons,titles,bonus){
  const before=plLevel();
  addXP((seasons||0)*6+(titles||0)*15+(bonus||0));
  PROFILE.gamesPlayed=(PROFILE.gamesPlayed||0)+1;saveProfile();
  return {leveledUp:plLevel()>before,from:before,to:plLevel()};
}
function unlockNoteFor(r){if(!r||!r.leveledUp)return '';
  const np=POS_UNLOCK.filter(u=>u[0]>r.from&&u[0]<=r.to).map(u=>u[1]);
  return (np.length?`Unlocked ${np.join("/")} for your Created Player, plus `:`Earned `)+`more attribute points.`;}
function xpEndNotice(){
  if(!G._xpAwarded){let seasons,titles,bonus;
    if(G.mode==="survivor"){seasons=G.yearsServed||0;titles=G.survTitles||0;bonus=Math.round((G.cumScore||0)/10);}
    else{seasons=(G.history?G.history.length:6);titles=G.champions||0;bonus=Math.round((computeGrade().score||0)/5);}

/* ---------- Create-A-Player ---------- */
const ATTR_BASE=64;   // every attribute starts here (peak value), points raise it
let _cap=null;   // working draft {name,pos,alloc,dawg}
function capDefaults(){return {name:"My Player",pos:"RF",alloc:{},dawg:0};}
function capAttrsFor(pos){return (pos==="SP"||pos==="RP")?PIT_ATTRS:HIT_ATTRS;}
function capSpent(){let s=0;const a=_cap.alloc||{};Object.keys(a).forEach(k=>s+=a[k]);return s+(_cap.dawg||0);}
function capPeak(d,k){return clamp(ATTR_BASE+((d.alloc||{})[k]||0)*5,ATTR_BASE,99);}   // attribute value at full development
function capBuild(d){   // turn a draft into a finished prospect template
  const keys=capAttrsFor(d.pos);
  const peakMean=keys.reduce((s,k)=>s+capPeak(d,k),0)/keys.length;
  const pot=clamp(Math.round(peakMean),64,ceilCapForLevel());   // ceiling = avg of your attribute peaks, capped by level
  const ovr=clamp(pot-22,30,74);
  const attr={};keys.forEach(k=>attr[k]=capPeak(d,k)-pot);   // store as offset so attribute hits its peak when fully developed
  const dawg=clamp(50+(d.dawg||0)*5,5,99);
  return {name:(d.name||"My Player").slice(0,20),pos:d.pos,age:20,ovr,pot,realCeil:pot,attr,dawg,
    createdLevel:plLevel(),custom:true};
}
function screenCreatePlayer(){

  const amax=allocMaxForLevel();

      <span class="small muted">→ <b style="color:${peak>=85?'var(--gold)':'var(--dim)'}">${peak}</b> at peak${v>=amax?' <span style="color:var(--dim)">(max)</span>':''}</span></div>`;};
  render(`<div class="row" style="align-items:center;margin-bottom:6px"><h2 style="flex:1">⭐ Create-A-Player</h2><button class="btn ghost" onclick="(function(){_cap=null;screenTitle();})()">← Home</button></div>

      <div class="sectlbl">Attribute points <span class="small" style="color:${left>0?'var(--gold)':'var(--dim)'}">${left} of ${total} left</span></div>

      <div style="display:flex;align-items:center;gap:8px;margin:6px 0 3px"><span class="small" style="flex:0 0 70px">🐶 DAWG</span>
        <button class="btn sm" onclick="capAdj('dawg',-1)">−</button><b style="width:24px;text-align:center">${_cap.dawg||0}</b><button class="btn sm" onclick="capAdj('dawg',1)">＋</button>
        <span class="small muted">→ ${built.dawg} clutch</span></div>
    </div>
    <div class="panel">
      <h3>Preview</h3>
      <div class="pcard" style="cursor:default">${ovrHTML(built.ovr)} ${built.pot>built.ovr?ceilMini(built.pot):''} <b>${built.name||'My Player'}</b>${built.dawg>=78?' 🐶':''} <span class="small muted">${built.pos} ${built.age}y</span></div>
      <p class="small muted" style="margin-top:8px">Starts at ${built.ovr} OVR with a ${built.pot} ceiling${isPit?' (pitcher)':''}. He's a prospect — develop him in your minors like any other.</p>

}
function capSetPos(p){_cap.pos=p;_cap.alloc={};screenCreatePlayer();}   // switching hitter<->pitcher resets attr alloc
function capAdj(k,d){const total=attrPointsForLevel(),amax=allocMaxForLevel();
  if(k==='dawg'){let v=(_cap.dawg||0)+d;if(v<0)v=0;if(v>amax)v=amax;const test=capSpent()-(_cap.dawg||0)+v;if(test>total&&d>0)return;_cap.dawg=v;}
  else{let v=(_cap.alloc[k]||0)+d;if(v<0)v=0;if(v>amax)v=amax;const test=capSpent()-(_cap.alloc[k]||0)+v;if(test>total&&d>0)return;_cap.alloc[k]=v;}
  screenCreatePlayer();}
function saveCreatedPlayer(){const nm=(document.getElementById('capname')||{}).value;if(nm)_cap.name=nm;
  const built=capBuild(_cap);built._alloc=Object.assign({},_cap.alloc);built._dawg=_cap.dawg||0;
  PROFILE.createdPlayer=built;saveProfile();toast(`${built.name} saved — he'll appear in your next new game!`);screenTitle();}
function makeCreatedProspect(){const c=PROFILE.createdPlayer;if(!c)return null;

function copyBackup(){const t=document.getElementById('savecode');if(!t)return;t.select();

function downloadBackup(){const t=document.getElementById('savecode');if(!t)return;
  const blob=new Blob([t.value],{type:"text/plain"});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`tank-commander-${(G&&G.teamName||'save').replace(/[^a-z0-9]/gi,'-').toLowerCase()}.tankcmd`;

function applyBackupCode(code){

    toast("Game restored!");
    if(G.mode==="survivor"&&G.survStage===0&&!G.fired)startSurvivorYear();else goPhase(G.phase||0);

}
function restoreBackup(){const t=document.getElementById('restorecode');if(!t||!t.value.trim()){toast("Paste a code first");return;}applyBackupCode(t.value);}
function restoreFromFile(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyBackupCode(String(r.result||""));r.readAsText(f);}

/* ============================================================
   ACCOUNTS & CLOUD SYNC  (username + password; profile + franchise save)
   Backend: AUTH_API (Cloudflare Worker + D1). Empty AUTH_API = feature hidden.
   ============================================================ */
const AUTH_KEY="tankCommander_auth";
function authEnabled(){return !!AUTH_API;}
function authState(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||"null");}catch(e){return null;}}
function setAuth(a){try{a?localStorage.setItem(AUTH_KEY,JSON.stringify(a)):localStorage.removeItem(AUTH_KEY);}catch(e){}}
async function authCall(path,body){
  const r=await fetch(AUTH_API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||("Server error "+r.status));
  return j;
}
function mergeProfileFromCloud(cloudStr){
  let c=null;try{c=cloudStr?JSON.parse(cloudStr):null;}catch(e){}
  if(!c)return;
  const lx=PROFILE.xp||0,cx=c.xp||0;
  PROFILE.xp=Math.max(lx,cx);
  PROFILE.gamesPlayed=Math.max(PROFILE.gamesPlayed||0,c.gamesPlayed||0);
  PROFILE.createdPlayer=(cx>lx? (c.createdPlayer||PROFILE.createdPlayer) : (PROFILE.createdPlayer||c.createdPlayer))||null;
  saveProfile();
}
async function reconcileAfterLogin(d){
  mergeProfileFromCloud(d.profile);
  let loadedCloud=false;
  const localSave=localStorage.getItem(SAVE);
  const localAt=parseInt(localStorage.getItem(SAVE_AT)||"0",10);
  const cloudAt=d.updated||0;
  if(d.save && (!localSave || cloudAt>localAt)){
    try{localStorage.setItem(SAVE,d.save);localStorage.setItem(SAVE_AT,String(cloudAt));loadedCloud=true;}catch(e){}
  }
  await cloudSyncNow();   // push the merged result back up
  return loadedCloud;
}
let _syncT=null,_syncing=false;
function cloudSync(){if(!authEnabled()||!authState())return;clearTimeout(_syncT);_syncT=setTimeout(cloudSyncNow,1500);}
async function cloudSyncNow(){
  const a=authState();if(!authEnabled()||!a||_syncing)return;
  _syncing=true;
  try{
    const now=Date.now();
    await authCall("/sync",{token:a.token,profile:JSON.stringify(PROFILE),save:localStorage.getItem(SAVE)||null,updated:now});
    localStorage.setItem(SAVE_AT,String(now));
  }catch(e){ if(/signed in|401/i.test(e.message)){setAuth(null);} }
  finally{_syncing=false;}
}
const _v=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};

  if(!authEnabled()){render(`<div class="row" style="align-items:center;margin-bottom:6px"><h2 style="flex:1">Account</h2><button class="btn ghost" onclick="screenTitle()">← Home</button></div>
     <div class="panel"><p class="sub">Online accounts aren't switched on for this build yet. Your progress is still saved on this device, and you can move it with the 💾 Save backup code.</p></div>`);return;}
  const a=authState();

    <div style="margin-bottom:8px">${tab('login','Log in')} ${tab('signup','Create account')} ${tab('reset','Reset')}</div>

async function doSignup(){
  const u=_v('au_user'),p=_v('au_pass');
  if(!u||!p){toast("Fill in a username and password");return;}
  try{const d=await authCall("/signup",{username:u,password:p});

    await cloudSyncNow();   // push whatever local progress they already have
    showRecovery(d.recovery);
  }catch(e){toast(e.message);}
}
async function doLogin(){
  const u=_v('au_user'),p=_v('au_pass');
  if(!u||!p){toast("Enter your username and password");return;}
  try{const d=await authCall("/login",{username:u,password:p});
    setAuth({token:d.token,username:d.username});
    const loaded=await reconcileAfterLogin(d);
    toast("Signed in as "+d.username);
    if(loaded){screenTitle();toast("Your saved game was loaded from the cloud");}else screenTitle();
  }catch(e){toast(e.message);}
}
async function doReset(){
  const u=_v('au_user'),rec=_v('au_rec'),p=_v('au_pass');
  if(!u||!rec||!p){toast("Fill in every field");return;}
  try{const d=await authCall("/reset",{username:u,recovery:rec,password:p});
    setAuth({token:d.token,username:d.username});
    await reconcileAfterLogin(d);
    toast("Password reset — you're signed in");_authMode="login";screenTitle();
  }catch(e){toast(e.message);}
}
async function doLogout(){
  const a=authState();

  try{if(a)await authCall("/logout",{token:a.token});}catch(e){}

        <p class="small muted" style="margin:4px 0 0">A whole new way to play. Spend <b>$4 billion</b> to <b>buy a ballclub and build the stadium</b>, fund facilities, and hire your front office — then sit in the owner's box. <b>Steer your GM</b> with mandates and budgets, <b>veto his big trades</b> (including at the deadline), and run the money: set <b>ticket, concession &amp; merch prices</b>, land <b>sponsorships</b>, and grow the franchise's value. Win titles, then <b>sell for the biggest profit</b> — or build a 50-year dynasty. <i>It's an alpha, so expect rough edges — feedback welcome.</i></p></div>
      <div class="panel2" style="border:1px solid #c0392b;border-radius:10px;padding:11px">
        <div style="font-weight:800;color:#ff8a6b">🔥 Hard Mode — 6-Year Sprint</div>
        <p class="small muted" style="margin:4px 0 0">For veterans of the classic run: a <b>tougher league</b>, <b>realistic injuries</b> you manage at <b>extra in-season roster breaks</b> (with a real <b>Injured List</b>), a <b>deeper 5-round draft</b>, and <b>stricter grading</b> — with its own separate leaderboard. Pick it right under the 6-Year Sprint.</p></div>
    </div>
    <div class="panel"><h3 style="margin-top:0">🎮 Ways to play</h3>
      <div class="panel2" style="border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px">
        <div style="font-weight:800;color:var(--gold)">⚡ 6-Year Sprint</div>
        <p class="small muted" style="margin:4px 0 0">The classic challenge. You get <b>six seasons</b> to flip a tanking team into a contender — then the front office grades your whole run out of 100. About 15 minutes a playthrough.</p></div>
      <div class="panel2" style="border:1px solid var(--gold);border-radius:10px;padding:11px">
        <div style="font-weight:800;color:var(--gold)">🪑 Career Mode ${NEWPILL}</div>
        <p class="small muted" style="margin:4px 0 0">Endless. Keep the owner happy and <b>survive as long as you can</b> through the cycle of contention and rebuilds. Now featuring a <b>📣 Fan Favor meter</b>${NEWPILL} the fans control, and <b>🎙️ mid-season media press conferences</b>${NEWPILL} where what you say to reporters moves both meters. Your score climbs every year until you're fired — or retire a legend.</p></div>
    </div>
    <div class="panel"><h3 style="margin-top:0">✨ What else is new</h3>
      <div class="small" style="line-height:1.5">
        <div style="margin:5px 0"><b>⭐ Create-A-Player</b> ${NEWPILL} — earn XP every franchise to level up your GM profile and design a custom prospect who joins your farm in <i>every</i> new game.</div>
        <div style="margin:5px 0"><b>👤 Accounts &amp; cloud save</b> ${NEWPILL} — make a free account (just a username and password) to carry your GM level and current game across devices.</div>
        <div style="margin:5px 0"><b>💾 Save &amp; backup</b> — the game autosaves on your device automatically; the <b>💾 button</b> hands you a backup code to move or restore a save anytime.</div>
        <div style="margin:5px 0"><b>🏆 Leaderboard</b> — post your final score and climb the global rankings (the 6-Year and Career boards are kept separate).</div>
      </div>
    </div>
    <div class="panel center" style="border-color:#6f4fa0">
      <p class="small muted" style="margin:0 0 8px">This is a <b>beta</b>, so it's rough in spots. When you finish a run you'll get the chance to <b>leave a note for the creator</b> — tell me what to fix, balance, or add.</p>
    </div>
    <div class="center" style="margin:6px 0 20px"><button class="btn primary" style="font-size:17px;padding:14px 28px" onclick="(function(){try{localStorage.setItem(WELCOME_KEY,'1');}catch(e){};screenTitle();})()">I'm ready for the job →</button></div>`);
}
/* ---- feedback ---- */
function feedbackEnabled(){return !!AUTH_API;}
function openFeedback(){
  if(!feedbackEnabled()){toast("Feedback isn't switched on for this build yet");return;}
  const old=document.getElementById('saveov');if(old)old.remove();
  const ov=document.createElement('div');ov.id='saveov';ov.className='saveov';
  ov.innerHTML=`<div class="savebox">
    <div class="row" style="align-items:center"><h3 style="flex:1;margin:0">📝 Leave a note for the creator</h3><button class="btn ghost sm" onclick="document.getElementById('saveov').remove()">✕</button></div>
    <p class="sub">This is a beta — tell me what you loved, what felt off, and anything you'd add. It comes straight to me.</p>
    <textarea id="fbnote" class="savecode" style="height:120px;font-family:inherit;font-size:14px" placeholder="What worked, what didn't, ideas, bugs…"></textarea>
    <div class="center" style="margin-top:8px"><button class="btn primary" onclick="submitFeedback()">Send note ▶</button></div>
  </div>`;
  document.body.appendChild(ov);
}
async function submitFeedback(){
  const t=((document.getElementById('fbnote')||{}).value||"").trim();
  if(!t){toast("Write a note first");return;}
  let score=0,detail="";
  try{if(typeof G!=="undefined"&&G){
    if(G.mode==="survivor"){score=survFinalScore();detail=`${G.yearsServed||0} yrs · ${G.survTitles||0} titles · score ${Math.round(G.cumScore||0)}`;}
    else{const gr=computeGrade();score=gr.score;detail=`${gr.grade} (${gr.score}/100)`;}}}catch(e){}
  const a=(typeof authState==="function")?authState():null;
  try{
    await fetch(AUTH_API+"/feedback",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({note:t,mode:(typeof G!=="undefined"&&G&&G.mode)||"",score,detail,username:(a&&a.username)||"anon"})});
    const ov=document.getElementById('saveov');if(ov)ov.remove();
    toast("Thank you — note sent! 🙏");
  }catch(e){toast("Couldn't send — check your connection and try again");}
}

/* boot */
(localStorage.getItem(WELCOME_KEY)?screenTitle:screenWelcome)();
</script>
