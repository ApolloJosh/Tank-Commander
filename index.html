<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Commander — Baseball Rebuild GM</title>
<style>
  :root{
    --bg:#0b0f08; --panel:#141a0e; --panel2:#1e2814; --line:#36471f;
    --ink:#e9efda; --dim:#94a577; --gold:#a6ff2b; --green:#76e83f;
    --red:#ef6a6a; --blue:#a3c46e;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);
    background-color:#0b0f08;
    background-image:
      radial-gradient(ellipse 42% 30% at 12% 16%, rgba(74,83,32,.30), transparent 60%),
      radial-gradient(ellipse 36% 28% at 84% 10%, rgba(40,54,22,.34), transparent 60%),
      radial-gradient(ellipse 46% 36% at 70% 74%, rgba(58,72,30,.24), transparent 60%),
      radial-gradient(ellipse 40% 32% at 24% 86%, rgba(26,36,16,.40), transparent 60%),
      radial-gradient(ellipse 30% 26% at 52% 46%, rgba(44,56,24,.20), transparent 60%);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;font-size:15px}
  #app{max-width:1060px;margin:0 auto;padding:18px 16px 70px}
  h1,h2,h3{margin:0 0 8px;line-height:1.2}
  h1{font-size:30px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
  .panel2{background:var(--panel2)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  .btn{display:inline-block;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;transition:.12s}
  .btn:hover{border-color:var(--gold);transform:translateY(-1px)}
  .btn.primary{background:var(--gold);color:#0c1a00;border-color:var(--gold);box-shadow:0 0 10px rgba(166,255,43,.25)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
    background:var(--panel2);border:1px solid var(--line)}
  .pill.gold{background:rgba(166,255,43,.15);border-color:var(--gold);color:var(--gold)}
  .pill.green{background:rgba(118,232,63,.14);border-color:var(--green);color:var(--green)}
  .pill.red{background:rgba(239,106,106,.13);border-color:var(--red);color:var(--red)}
  .pill.blue{background:rgba(163,196,110,.15);border-color:var(--blue);color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  tr:hover td{background:rgba(255,255,255,.02)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--dim)}
  .ovr{font-weight:800;font-variant-numeric:tabular-nums}
  .ovr.elite{color:var(--gold)} .ovr.good{color:var(--green)} .ovr.avg{color:var(--ink)} .ovr.low{color:var(--dim)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .kpi .big{font-size:24px;font-weight:800}
  .kpi .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24410f;color:#eaffcf;border:1px solid #4a6b1f;
    padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:50;font-weight:600;max-width:90%}
  .center{text-align:center}
  .small{font-size:12.5px}
  .scroll{max-height:360px;overflow:auto}
  .disclaimer{font-size:11px;color:#6c7c90;border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
  .hero{background:radial-gradient(120% 140% at 50% 0%,#243214,#0b0f08);
    border:1px solid var(--line);border-radius:16px;padding:30px 24px;text-align:center;
    box-shadow:inset 0 0 60px rgba(120,200,40,.06)}
  .stepbar{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
  .step{flex:1;min-width:88px;text-align:center;font-size:11px;padding:7px 4px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .step.on{border-color:var(--gold);color:var(--gold);font-weight:700}
  .step.done{border-color:var(--green);color:var(--green)}
  select,input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:14px}
  .offer{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;background:var(--panel2)}
  .pos{display:inline-block;min-width:30px;font-weight:700;color:var(--blue);font-size:12px}
  .sectlbl{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin:14px 0 4px;font-weight:700}
  .empty{color:var(--red);font-style:italic}
  .give{color:var(--red)} .get{color:var(--green)}
  .yrs{font-size:11px}
  .yrs.exp{color:var(--red);font-weight:700}
  @media(max-width:680px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}h1{font-size:24px}}
</style>
</head>

const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), round=Math.round;
function gauss(m,s){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function uid(){return Math.random().toString(36).slice(2,9);}
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};

/* ---------- helpers on players ---------- */
const isPit=p=>p.pos==="SP"||p.pos==="RP";
const isHit=p=>!isPit(p);
function ovrClass(o){return o>=88?'elite':o>=80?'good':o>=70?'avg':'low';}
// Realized ceiling: scouted potential is NOT a guarantee.
// 25% reach it exactly, 60% land within 10 below, 15% within 20 below.
function rollRealCeil(pot){const r=Math.random();let rc;
  if(r<0.25)rc=pot; else if(r<0.85)rc=pot-rnd(3,10); else rc=pot-rnd(11,20);
  return Math.round(rc);}
function clonePlayer(d){const[n,p,a,o,t,s,y]=d;const pot=Math.max(t,o);
  return {id:uid(),name:n,pos:p,age:a,ovr:o,pot,realCeil:Math.max(o,rollRealCeil(pot)),salary:s,years:y,loc:"mlb",inj:0};}
// fictional college draftee
const C_F=["Tyler","Brody","Chase","Aiden","Mason","Cooper","Hudson","Easton","Carson","Brooks","Maddox","Holden","Bennett","Cash","Rhys","Wells","Ledger","Tate","Gunner","Jrue"];
const C_L=["Whitfield","Carrasco","Bautch","Demaris","Holcomb","Pennington","Vasquez","Stallings","Brockman","Yount","Dellinger","Marsh","Ocampo","Steele","Hargrove","Vitelli","Brubaker","Sandoval","Kingery","Marchetti"];
const COLL=["Vanderbilt","LSU","Texas","Wake Forest","Stanford","Florida","Arkansas","Tennessee","Miami","Oregon St","UCLA","TCU","Clemson","Wichita St"];
const POSPOOL=["C","1B","2B","3B","SS","LF","CF","RF","SP","SP","RP"];
function draftee(slot,rd,advanced,pos){
  rd=rd||1; pos=pos||pick(POSPOOL);
  const ceilBase=(97-(slot-1)*1.7)-(rd-1)*11;   // later rounds = lower ceilings
  let o,pot;
  if(advanced){o=clamp(Math.round(rnd(63,71)-slot*0.2-(rd-1)*3),52,73);pot=clamp(o+ri(4,10),o,84);}
  else{o=clamp(Math.round(rnd(42,52)-slot*0.3-(rd-1)*4),30,57);pot=clamp(Math.round(gauss(ceilBase,6)),50,99);}
  pot=Math.max(pot,o);
  return {id:uid(),name:pick(C_F)+" "+pick(C_L),pos,age:advanced?ri(23,24):ri(20,22),ovr:o,pot,
    realCeil:Math.max(o,rollRealCeil(pot)),salary:0.7,years:6,loc:"farm",inj:0,college:pick(COLL),advanced:!!advanced,fic:true,prospect:true};
}

const ficName=()=>pick(F_FIRST)+" "+pick(F_LAST);
function ficProspect(){
  const pos=pick(POSPOOL);
  const pot=clamp(round(gauss(79,11)),60,99);
  const ovr=clamp(round(pot-rnd(12,34)),32,60);
  return {id:uid(),name:ficName(),pos,age:ri(18,23),ovr,pot:Math.max(pot,ovr),realCeil:Math.max(ovr,rollRealCeil(Math.max(pot,ovr))),salary:0.7,years:6,loc:"pool",inj:0,fic:true,prospect:true};
}
function ficReplacement(){
  const pos=pick(POSPOOL);const ovr=ri(56,68);
  return {id:uid(),name:ficName(),pos,age:ri(25,33),ovr,pot:ovr+ri(0,3),salary:round(rnd(0.8,4)*10)/10,years:ri(1,3),loc:"pool",inj:0,fic:true};
}
// color-code ceilings
function ceilClass(pot){return pot>=90?'gold':pot>=82?'green':pot>=74?'blue':'';}
/* ---------- draft pick objects ---------- */
function projSlotEstimate(){
  const myw=warToWins(teamWAR(G.roster));let ahead=0;
  G.ai.forEach(t=>{if(warToWins(t.war)>myw)ahead++;});
  return clamp(16-ahead,1,16);
}
const ROUND_F={1:1,2:0.5,3:0.28};
function pickResolvedSlot(pk){return (pk.future&&pk.fromMe)?projSlotEstimate():pk.slot;}
function pickVal(pk){return Math.max(1,round(pickValue(pickResolvedSlot(pk))*(ROUND_F[pk.round||1])));}
function pickLabel(pk){const s=pickResolvedSlot(pk);return `${pk.future&&pk.fromMe?'~':''}R${pk.round||1} Pick #${s}${pk.future&&pk.fromMe?' (proj)':''}`;}
function mkFuturePick(rd){return {id:uid(),round:rd||1,slot:9,future:true,fromMe:true};}
function freshDraftPicks(){return [mkFuturePick(1),mkFuturePick(2),mkFuturePick(3)];}

/* ============================================================
   WAR / WINS
   ============================================================ */
function warOf(p){
  if(p.pos==="SP")return Math.max(0,(p.ovr-48)/10.5);
  if(p.pos==="RP")return Math.max(0,(p.ovr-53)/13.5);
  return Math.max(0,(p.ovr-49)/10.5);
}
const injFactor=p=>p.inj>0?clamp(1-p.inj/162,0.3,1):1;
const eff=p=>warOf(p)*injFactor(p);
function warToWins(w){return clamp(round(81+(w-31)*1.40),47,116);}
const REP_BAT=0.86, REP_SP=0.95, REP_RP=0.37;   // replacement-level fill for empty slots
function tradeValue(p){
  const prod=Math.max(0,(p.ovr-44));
  const ageF=clamp((30-p.age)/9,-0.4,1.7);
  const upside=Math.max(0,(p.pot-p.ovr))*ageF*1.1;
  const youth=p.age<=24?(p.ovr-40)*0.25:0;
  let v=prod+upside+Math.max(0,youth);
  // elite premium — superstars and high-ceiling talents cost a lot more (and are hard to pry loose)
  if(p.ovr>=85)v+=Math.pow(p.ovr-85,1.45)*2.0;     // superstar tax
  if(p.pot>=88)v+=Math.pow(p.pot-88,1.3)*1.4;      // elite-ceiling premium
  v-=Math.max(0,(p.salary-12))*(p.age>31?0.6:0.25);
  if(p.years<=1)v*=0.78;                  // rental discount
  return Math.max(1,round(v));
}
const pickValue=slot=>round(clamp(60*Math.pow(0.93,slot-1),5,60));

/* ---------- position eligibility ---------- */
const ELIG={C:["C"],"1B":["1B","3B","DH"],"2B":["2B","SS"],"3B":["3B","1B","SS"],
  SS:["SS","2B"],LF:["LF","CF","RF"],CF:["CF","LF","RF"],RF:["RF","LF","CF"],DH:["C","1B","2B","3B","SS","LF","CF","RF","DH"]};
const LINEUP=["C","1B","2B","3B","SS","LF","CF","RF","DH"];
function buildActive(roster){
  const mlb=roster.filter(p=>p.loc==="mlb");
  const used=new Set(),lineup={};
  // fill scarce positions first (C, SS, 2B, then others) for better assignment
  ["C","SS","2B","3B","1B","CF","LF","RF","DH"].forEach(slot=>{
    const elig=mlb.filter(p=>!used.has(p.id)&&isHit(p)&&ELIG[slot].includes(p.pos))
      .sort((a,b)=>eff(b)-eff(a));
    lineup[slot]=elig[0]||null; if(elig[0])used.add(elig[0].id);
  });
  const rotation=mlb.filter(p=>p.pos==="SP").sort((a,b)=>eff(b)-eff(a)).slice(0,4);
  const pen=mlb.filter(p=>p.pos==="RP").sort((a,b)=>eff(b)-eff(a)).slice(0,3);
  return {lineup,rotation,pen,used};
}
function teamWAR(roster){
  const a=buildActive(roster);let w=0;
  LINEUP.forEach(s=>{w+=a.lineup[s]?eff(a.lineup[s]):REP_BAT;});
  for(let i=0;i<4;i++)w+=a.rotation[i]?eff(a.rotation[i]):REP_SP;
  for(let i=0;i<3;i++)w+=a.pen[i]?eff(a.pen[i]):REP_RP;
  return w;
}
function payroll(roster){return round(roster.filter(p=>p.loc==="mlb").reduce((s,p)=>s+p.salary,0)*10)/10;}
function luxuryTax(){return Math.max(0,Math.floor((payroll(G.roster)-300)/10));}

function newGame(teamName){
  const poolAll=DATA.map(clonePlayer);
  // add fictional prospects + replacement-level players to the league
  for(let i=0;i<46;i++)poolAll.push(ficProspect());
  for(let i=0;i<30;i++)poolAll.push(ficReplacement());
  for(let i=poolAll.length-1;i>0;i--){const j=ri(0,i);[poolAll[i],poolAll[j]]=[poolAll[j],poolAll[i]];}
  const take=(fn)=>{const i=poolAll.findIndex(fn);return i>=0?poolAll.splice(i,1)[0]:null;};
  const roster=[],farm=[];
  const add=(p,keep)=>{if(p){p.loc="mlb";if(keep)p._keeper=true;roster.push(p);}return p;};
  // --- a crossroads team: won it ~4 years ago, stars now aging & declining ---
  // 2 aging stars with real trade value (older, will fade)
  add(take(p=>p.age>=33&&p.ovr>=82&&p.ovr<=88&&isHit(p))||take(p=>p.age>=32&&p.ovr>=82&&isHit(p)),true);
  add(take(p=>p.age>=33&&p.ovr>=82&&p.ovr<=88&&p.pos==="SP")||take(p=>p.age>=32&&p.ovr>=82&&p.pos==="SP"),true);
  // 1 useful mid-career vet (decent, tradeable)
  add(take(p=>p.age>=28&&p.age<=33&&p.ovr>=74&&p.ovr<=82&&isHit(p))||take(p=>p.ovr>=74&&p.ovr<=82&&isHit(p)),true);
  // 1 younger building block (not a star yet)
  add(take(p=>p.age<=28&&p.ovr>=72&&p.ovr<=80&&p.pot>=82&&isHit(p))||take(p=>p.age<=29&&p.ovr>=72&&p.ovr<=80),true);
  // an aging back-end closer (trade value)
  add(take(p=>p.pos==="RP"&&p.ovr>=78&&p.age>=29)||take(p=>p.pos==="RP"&&p.ovr>=76),true);
  // fill the rest with fictional replacement-level players (this is a mediocre team)
  const haveNat=s=>roster.some(p=>p.loc==="mlb"&&p.pos===s);
  const ofCount=()=>roster.filter(p=>p.loc==="mlb"&&["LF","CF","RF"].includes(p.pos)).length;
  if(!haveNat("C"))add(take(x=>x.pos==="C"&&x.fic)||take(x=>x.pos==="C"));
  ["1B","2B","3B","SS"].forEach(s=>{if(!haveNat(s))add(take(x=>x.pos===s&&x.fic&&x.ovr<=66)||take(x=>x.pos===s&&x.fic)||take(x=>x.pos===s&&x.ovr<=72)||take(x=>x.pos===s));});
  while(ofCount()<3){const p=take(x=>["LF","CF","RF"].includes(x.pos)&&x.fic)||take(x=>["LF","CF","RF"].includes(x.pos)&&x.ovr<=72)||take(x=>["LF","CF","RF"].includes(x.pos));if(!p)break;add(p);}
  while(roster.filter(p=>p.pos==="SP").length<4){const p=take(x=>x.pos==="SP"&&x.fic)||take(x=>x.pos==="SP"&&x.ovr<=70)||take(x=>x.pos==="SP");if(!p)break;add(p);}
  while(roster.filter(p=>p.pos==="RP").length<3){const p=take(x=>x.pos==="RP"&&x.fic)||take(x=>x.pos==="RP"&&x.ovr<=70)||take(x=>x.pos==="RP");if(!p)break;add(p);}
  // a couple bench bodies
  add(take(x=>isHit(x)&&x.fic)); add(take(x=>isHit(x)&&x.fic));
  // patch any empty lineup slot
  for(let g=0;g<14;g++){const a=buildActive(roster);const e=LINEUP.find(s=>!a.lineup[s]);if(!e)break;
    let p=(e==="DH")?take(x=>isHit(x)):(take(x=>x.pos===e)||take(x=>ELIG[e].includes(x.pos)&&isHit(x)));if(!p)break;add(p);}
  // cap projected wins at 83 — swap strongest non-keeper starters for weak fictional fill
  let guard=0;
  while(warToWins(teamWAR(roster))>83&&guard++<14){
    const a=buildActive(roster);
    const starters=[...LINEUP.map(s=>a.lineup[s]).filter(Boolean),...a.rotation,...a.pen];
    const cut=starters.filter(p=>!p._keeper).sort((x,y)=>eff(y)-eff(x))[0];
    if(!cut)break;
    roster.splice(roster.indexOf(cut),1);
    const r=ficReplacement();r.pos=cut.pos;r.ovr=clamp(cut.pos==="RP"?ri(57,62):ri(59,64),52,66);r.pot=r.ovr+ri(0,3);r.loc="mlb";roster.push(r);
  }
  // thin farm: 2 modest fictional prospects
  for(let i=0;i<2;i++){const p=take(x=>x.prospect&&x.pot>=78&&x.pot<=90&&x.ovr<=58);if(p){p.loc="farm";farm.push(p);}}

  roster.forEach(p=>p.src=p.src||"original");farm.forEach(p=>p.src=p.src||"original");
  G={year:1,phase:0,teamName:teamName||"River City Rovers",
    roster,farm,pool:poolAll,
    ai:Array.from({length:15},(_,i)=>({id:uid(),name:aiTeamName(i),war:gauss(30,7),
      mode:Math.random()<0.3?"rebuild":Math.random()<0.5?"contend":"steady"})),
    ownedPicks:freshDraftPicks(), standings:[], lastWins:null, history:[],
    champions:0, playoffApps:0, bestWins:0, worstWins:200,
    tradeTries:3, leftAsFA:[], faMarket:[], faYear:0, maxPayroll:0, taxYears:0, taxWinsLost:0};
  saveGame();
}
let _aiNames=null;
function aiTeamName(i){
  if(!_aiNames){
    const cities=["River City","Granite Bay","Harbor","Summit","Crown","Lakeside","Iron City","Cedar Falls","Bayou","Capitol","Gold Coast","Northgate","Sienna","Verde Valley","Old Port","Twin Pines"];
    const nicks=["Rovers","Stags","Anchors","Quakes","Monarchs","Pioneers","Ironworks","Foxes","Pelicans","Senators","Surfers","Sentinels","Coyotes","Condors","Otters","Timber"];
    _aiNames=[];const uc=[...cities],un=[...nicks];
    for(let k=0;k<16;k++){_aiNames.push((uc.splice(ri(0,uc.length-1),1)[0])+" "+(un.splice(ri(0,un.length-1),1)[0]));}
  }
  return _aiNames[i+1];
}

/* ============================================================
   SEASON
   ============================================================ */
function simulateSeason(){
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  mlb.forEach(p=>p.inj=0);
  const injured=[];const n=ri(2,5);
  for(let i=0;i<n;i++){const p=pick(mlb);if(p&&!p.inj){p.inj=ri(15,110);injured.push(p);}}
  G.ai.forEach(t=>{let d=t.mode==="rebuild"?gauss(1.4,2):t.mode==="contend"?gauss(0.3,2):gauss(0,1.7);
    t.war=clamp(t.war+d,10,55);});
  // also age/develop the trade pool a touch so available talent stays current
  const myWAR=teamWAR(G.roster);
  const entries=[{name:G.teamName,war:myWAR,me:true},...G.ai.map(t=>({name:t.name,war:t.war}))];
  entries.forEach(e=>{e.wins=clamp(round(warToWins(e.war)+gauss(0,4.6)),47,116);e.losses=162-e.wins;});
  // luxury tax: every $10M of payroll over $300M costs the user 1 win
  const tax=luxuryTax();
  G.maxPayroll=Math.max(G.maxPayroll||0,payroll(G.roster));
  if(tax>0){const m=entries.find(e=>e.me);m.wins=clamp(m.wins-tax,40,116);m.losses=162-m.wins;
    G.taxYears=(G.taxYears||0)+1;G.taxWinsLost=(G.taxWinsLost||0)+tax;}
  entries.sort((a,b)=>b.wins-a.wins);entries.forEach((e,i)=>e.seed=i+1);
  const champ=runPlayoffs(entries.slice(0,8));
  const me=entries.find(e=>e.me);
  G.standings=entries;G.lastWins=me.wins;
  G.bestWins=Math.max(G.bestWins,me.wins);G.worstWins=Math.min(G.worstWins,me.wins);
  if(me.seed<=8)G.playoffApps++;
  const wonWS=champ&&champ.me;if(wonWS)G.champions++;
  const mySlot=17-me.seed;
  G.ownedPicks.forEach(pk=>{if(pk.future&&pk.fromMe){pk.slot=mySlot;pk.future=false;}});
  G.history.push({year:G.year,wins:me.wins,losses:me.losses,seed:me.seed,playoffs:me.seed<=8,champ:wonWS});
  return {me,entries,injured,champ,wonWS,mySlot,tax};
}
function runPlayoffs(teams){
  let r=teams.slice();
  while(r.length>1){const nx=[];for(let i=0;i<r.length;i+=2){const a=r[i],b=r[i+1];
    let pa=clamp((a.war+8)/((a.war+8)+(b.war+8)),0.2,0.8);nx.push(Math.random()<pa?a:b);}r=nx;}
  return r[0];
}

/* ============================================================
   DEVELOP / AGE / CONTRACTS
   ============================================================ */
function developAll(){
  const notes=[];
  const all=G.roster.concat(G.farm).concat(G.pool);
  all.forEach(p=>{
    const b=p.ovr;
    if(p.realCeil==null)p.realCeil=Math.max(p.ovr,p.pot);
    const tgt=Math.min(p.realCeil,p.pot);   // they grow toward realized ceiling, not the dream
    if(p.age<=25){
      if(Math.random()<0.04){p.pot=clamp(p.pot-ri(1,5),p.ovr,99);}                       // scouts sour
      else if(Math.random()<0.05){p.pot=clamp(p.pot+ri(2,6),p.pot,99);p.realCeil=clamp(p.realCeil+ri(2,5),p.ovr,p.pot);} // rare late breakout
      const t=Math.min(p.realCeil,p.pot);
      const g=Math.max(0,(t-p.ovr))*rnd(0.30,0.55);
      p.ovr=clamp(round(p.ovr+(t>p.ovr?Math.max(1,g):0)),28,99);}
    else if(p.age<=27){p.ovr=clamp(round(p.ovr+(tgt>p.ovr?rnd(1,3.5):rnd(-1,1))),28,99);}
    else if(p.age<=30){p.ovr=clamp(round(p.ovr+(tgt>p.ovr?rnd(-0.5,1.5):rnd(-1.5,.5))),28,99);}
    else if(p.age<=32){p.ovr=clamp(round(p.ovr+rnd(-2.5,0)),28,99);}
    else{p.ovr=clamp(round(p.ovr-rnd(1.5,4.5)),22,99);}
    p.age++;
    if(b>0&&(p.loc==="mlb"||p.loc==="farm")){
      if(p.ovr-b>=6)notes.push(`📈 ${p.name} broke out (${b}→${p.ovr})`);
      if(b-p.ovr>=5&&p.age>31)notes.push(`📉 ${p.name} declined (${b}→${p.ovr})`);
    }
  });
  // contracts tick (mlb only); expirations walk as FA
  G.leftAsFA=[];
  G.roster=G.roster.filter(p=>{
    if(p.loc==="mlb"){p.years--;if(p.years<=0){G.leftAsFA.push(p);return false;}}
    return true;
  });
  // retirements
  const ret=[];
  G.roster=G.roster.filter(p=>{if(p.age>=40||(p.ovr<=30&&p.age>35)){ret.push(p);return false;}return true;});
  G.farm=G.farm.filter(p=>p.ovr>24);
  G.pool=G.pool.filter(p=>p.age<40&&p.ovr>30);
  return {notes,retired:ret,fa:G.leftAsFA};
}
function extend(pid){
  const p=G.roster.find(x=>x.id===pid)||G.farm.find(x=>x.id===pid);if(!p)return;
  const add=p.age>=33?2:p.age>=29?3:5;
  const raise=p.age>=33?1.0:1.12;
  p.years+=add;
  p.salary=round(clamp(Math.max(p.salary*raise,(p.ovr-55)*1.0)+rnd(0,2),0.7,48)*10)/10;
  toast(`${p.name} extended ${add} yrs (now ${p.years} yrs, $${p.salary}M)`);
  saveGame();
}

/* ---- free agency ---- */
function ficVeteran(){
  const pos=pick(POSPOOL);const age=ri(27,39);const ovr=clamp(round(gauss(70,8)),56,88);
  return {id:uid(),name:ficName(),pos,age,ovr,pot:ovr,realCeil:ovr,salary:0,years:0,loc:"pool",inj:0,fic:true};
}
function faAsk(p){
  const ageF=clamp((42-p.age)/14,0.5,1.45);
  const aav=Math.max(1,round((p.ovr-58)*1.35*ageF));
  const years=p.age<=30?ri(3,5):p.age<=34?ri(2,3):1+ri(0,1);
  return {aav,years:Math.max(1,years)};
}
function genFAMarket(){
  const list=[];
  const realVets=G.pool.filter(p=>!p.prospect&&!p.fic&&p.age>=27&&p.age<=40&&p.ovr>=68).sort(()=>Math.random()-0.5).slice(0,ri(2,4));
  realVets.forEach(p=>{p._fromPool=true;const a=faAsk(p);list.push({id:uid(),player:p,aav:a.aav,years:a.years});});
  const nF=ri(3,5);
  for(let i=0;i<nF;i++){const v=ficVeteran();const a=faAsk(v);list.push({id:uid(),player:v,aav:a.aav,years:a.years});}
  return list.sort((a,b)=>b.player.ovr-a.player.ovr);
}
function renderFA(){
  if(!G.faMarket||!G.faMarket.length)return `<p class="muted">No free agents left this winter.</p>`;
  return G.faMarket.map(fa=>{const p=fa.player;
    return `<div class="offer"><div class="row" style="align-items:center">
     <div style="flex:2"><span class="pos">${p.pos}</span> ${p.name} <span class="small muted">age ${p.age} • <b class="ovr ${ovrClass(p.ovr)}">${p.ovr}</b> OVR</span>${p.fic?'':' <span class="small" style="color:var(--blue)">real FA</span>'}</div>
     <div style="flex:1;text-align:right"><span class="pill gold">${fa.years}yr • $${fa.aav}M/yr</span>
       <button class="btn primary sm" onclick="signFA('${fa.id}')">Sign</button></div></div></div>`;}).join("");
}
function signFA(fid){
  const fa=(G.faMarket||[]).find(x=>x.id===fid);if(!fa)return;const p=fa.player;
  if(p._fromPool){if(!G.pool.some(x=>x.id===p.id)){G.faMarket=G.faMarket.filter(x=>x.id!==fid);toast('No longer available');screenTrade();return;}
    G.pool=G.pool.filter(x=>x.id!==p.id);delete p._fromPool;}
  p.salary=fa.aav;p.years=fa.years;p.loc="mlb";p.src="fa";p.inj=0;
  G.roster.push(p);G.faMarket=G.faMarket.filter(x=>x.id!==fid);_custom=null;
  toast(`Signed ${p.name} — ${fa.years}yr / $${fa.aav}M`);screenTrade();
}
function needsSurplus(){
  const mlb=G.roster.filter(p=>p.loc==="mlb");const a=buildActive(G.roster);
  const needs=[],surplus=[];
  LINEUP.forEach(s=>{const p=a.lineup[s];if(!p||p.ovr<66)needs.push(s);});
  if(mlb.filter(p=>p.pos==="SP"&&p.ovr>=66).length<4)needs.push("SP");
  if(mlb.filter(p=>p.pos==="RP"&&p.ovr>=66).length<3)needs.push("RP");
  const cnt={};mlb.forEach(p=>{if(p.ovr>=74)cnt[p.pos]=(cnt[p.pos]||0)+1;});
  Object.keys(cnt).forEach(pos=>{const need=pos==="SP"?4:pos==="RP"?3:1;if(cnt[pos]>need)surplus.push(cnt[pos]>need+1?`${pos} (${cnt[pos]})`:pos);});
  return {needs:[...new Set(needs)],surplus};
}
function rosterMini(){
  const a=buildActive(G.roster);
  const chip=(lbl,p)=>`<span class="pill" style="margin:2px;background:var(--panel2)">${lbl} ${p?`${p.name.split(' ').slice(-1)[0]} <b class="ovr ${ovrClass(p.ovr)}">${p.ovr}</b>${p.inj?' 🩹':''}`:'<span class="empty">—</span>'}</span>`;
  return `<div style="margin:4px 0"><div class="small muted">Lineup</div>${LINEUP.map(s=>chip(s,a.lineup[s])).join("")}</div>
   <div style="margin:4px 0"><div class="small muted">Rotation</div>${[0,1,2,3].map(i=>chip('SP',a.rotation[i])).join("")}</div>
   <div style="margin:4px 0"><div class="small muted">Bullpen</div>${[0,1,2].map(i=>chip('RP',a.pen[i])).join("")}</div>
   <div class="small muted" style="margin-top:6px">Projected wins <b style="color:var(--ink)">${warToWins(teamWAR(G.roster))}</b> • payroll $${payroll(G.roster)}M${luxuryTax()>0?` • <span style="color:var(--red)">luxury tax −${luxuryTax()} W</span>`:''}</div>`;
}
function myTradeableAssets(){
  const a=[];
  G.roster.filter(p=>p.loc==="mlb").forEach(p=>a.push({kind:"player",aid:p.id,player:p,val:tradeValue(p)}));
  G.farm.forEach(p=>a.push({kind:"player",aid:p.id,player:p,val:tradeValue(p)}));
  G.ownedPicks.forEach(pk=>a.push({kind:"pick",aid:pk.id,pick:pk,val:pickVal(pk)}));
  return a;
}
/* ---- asset transfer helpers ---- */
function giveAsset(a){
  if(a.kind==="player"){G.roster=G.roster.filter(p=>p.id!==a.player.id);G.farm=G.farm.filter(p=>p.id!==a.player.id);a.player.loc="pool";G.pool.push(a.player);}
  else{G.ownedPicks=G.ownedPicks.filter(pk=>pk.id!==a.pick.id);}
}
function getAsset(a){
  if(a.kind==="player"){G.pool=G.pool.filter(p=>p.id!==a.player.id);placeAcquired(a.player);}
  else{G.ownedPicks.push(a.pick);}
}
function placeAcquired(p){
  p.loc=(p.ovr>=68&&p.age>22&&!p.prospect)?"mlb":"farm";
  if(p.years<2&&p.loc==="mlb")p.years=6;
  if(p.src!=="draft")p.src="trade";
  if(p.loc==="mlb")G.roster.push(p);else G.farm.push(p);
}
/* ---- generated offers ---- */
function genOffers(){const offers=[];let guard=0;
  while(offers.length<5&&guard++<70){const o=genOneOffer();if(o)offers.push(o);}return offers;}
function poolStars(min){return G.pool.filter(p=>!p.prospect&&p.ovr>=(min||80)&&p.age<=33);}
function poolYoung(){return G.pool.filter(p=>p.prospect||(p.age<=25&&p.pot>=80));}
function PA(p){return {kind:"player",aid:p.id,player:p,val:tradeValue(p)};}
function synthPick(slot){const pk={id:uid(),slot,future:false,fromMe:false};return {kind:"pick",aid:pk.id,pick:pk,val:pickVal(pk)};}
function genOneOffer(){
  const team=pick(G.ai),yr=G.year;
  let mode=yr<=2?(Math.random()<0.85?"sell":"swap"):yr===3?pick(["sell","buy","swap"]):(Math.random()<0.8?"buy":"swap");
  if(mode==="sell"){
    const vets=G.roster.filter(p=>p.loc==="mlb"&&(p.ovr>=76||p.age>=31)).sort((a,b)=>tradeValue(b)-tradeValue(a));
    if(!vets.length)return null;
    const give=[vets[0]];if(vets[1]&&Math.random()<0.3)give.push(vets[1]);
    const target=give.reduce((s,p)=>s+tradeValue(p),0)*rnd(0.85,1.04);
    const get=assembleFromPool(target,"young");if(!get.length)return null;
    return mkOffer(team,give.map(PA),get);
  }
  if(mode==="buy"){
    const stars=poolStars(80);if(!stars.length)return null;
    const star=pick(stars);const target=tradeValue(star)*rnd(0.95,1.15);
    const give=assembleFromMine(target);if(!give.length)return null;
    return mkOffer(team,give,[PA(star)]);
  }
  const mine=G.roster.filter(p=>p.loc==="mlb").sort(()=>Math.random()-0.5)[0];if(!mine)return null;
  const want=tradeValue(mine)*rnd(0.9,1.1);
  const cand=G.pool.filter(p=>Math.abs(tradeValue(p)-want)<=7&&p.id!==mine.id);if(!cand.length)return null;
  return mkOffer(team,[PA(mine)],[PA(pick(cand))]);
}
function assembleFromPool(target,kind){
  let cands=(kind==="young"?poolYoung():G.pool).slice();if(!cands.length)cands=G.pool.slice();
  cands.sort(()=>Math.random()-0.5);
  const get=[];let v=0,guard=0;
  while(v<target*0.9&&get.length<3&&guard++<30&&cands.length){
    const p=cands.shift();const pv=tradeValue(p);
    if(v+pv<=target+8){get.push(PA(p));v+=pv;}}
  if(v<target*0.85&&G.year<=3){const sp=synthPick(ri(3,16));get.push(sp);}
  return get;
}
function assembleFromMine(target){
  let assets=[];
  G.farm.forEach(p=>assets.push(PA(p)));
  G.ownedPicks.forEach(pk=>assets.push({kind:"pick",aid:pk.id,pick:pk,val:pickVal(pk)}));
  G.roster.filter(p=>p.loc==="mlb"&&p.age<=27&&p.pot>=84).forEach(p=>assets.push(PA(p)));
  assets.sort((a,b)=>b.val-a.val);
  const give=[];let v=0,gu=0;
  for(const a of assets){if(v>=target)break;give.push(a);v+=a.val;if(++gu>4)break;}
  return v>=target*0.9?give:[];
}
function mkOffer(team,give,get){const gv=give.reduce((s,a)=>s+a.val,0),gt=get.reduce((s,a)=>s+a.val,0);
  return {id:uid(),team,give,get,fair:gt/Math.max(1,gv)};}
function renderOffers(){
  if(!_offers.length)return `<p class="muted">No deals on the table — try refreshing.</p>`;
  return _offers.map(o=>`<div class="offer">
     <div class="row" style="align-items:center">
       <div style="flex:2"><b>${o.team.name}</b>
         <span class="pill ${o.fair>=1?'green':o.fair>=0.88?'gold':'red'}">${o.fair>=1?'You win':o.fair>=0.88?'Fair':'Lean against you'}</span></div>
       <div style="flex:1;text-align:right"><button class="btn primary sm" onclick="acceptOffer('${o.id}')">Accept</button></div></div>
     <div class="grid2" style="margin-top:8px">
       <div><div class="small give">▼ You send</div>${o.give.map(a=>`<div class="small">${assetLabel(a)}</div>`).join("")}</div>
       <div><div class="small get">▲ You get</div>${o.get.map(a=>`<div class="small">${assetLabel(a)}</div>`).join("")}</div>
     </div></div>`).join("");
}
function refreshOffers(){if(G.tradeTries<=0)return;G.tradeTries--;_offers=genOffers();screenTrade();}
function acceptOffer(oid){const o=_offers.find(x=>x.id===oid);if(!o)return;
  o.give.forEach(giveAsset);o.get.forEach(getAsset);
  _offers=_offers.filter(x=>x.id!==oid);_custom=null;
  toast(`Trade with ${o.team.name} complete`);screenTrade();}

/* ---- custom builder (ID-tracked; dedupe; package box; tradeable picks) ---- */
let _builderMine=[];
function buildPartnerAssets(team){
  const arr=[];
  const prospects=G.pool.filter(p=>p.prospect||(p.age<=24&&p.pot>=80)).sort(()=>Math.random()-0.5).slice(0,5);
  const used=new Set(prospects.map(p=>p.id));
  const players=G.pool.filter(p=>!used.has(p.id)&&!p.fic).sort(()=>Math.random()-0.5).slice(0,5);
  players.forEach(p=>used.add(p.id));
  const depth=G.pool.filter(p=>p.fic&&!p.prospect&&!used.has(p.id)).sort(()=>Math.random()-0.5).slice(0,2);
  [...prospects,...players,...depth].forEach(p=>arr.push(PA(p)));
  const slot=clamp(round((warToWins(team.war)-58)/3.3),1,16);
  const pk={id:uid(),slot,future:false,fromMe:false};
  arr.push({kind:"pick",aid:pk.id,pick:pk,val:pickVal(pk)});
  return arr;
}
function sortAssets(arr,key){
  const a=arr.slice();
  a.sort((x,y)=>{
    if(x.kind==="pick"||y.kind==="pick"){if(x.kind==="pick"&&y.kind==="pick")return y.val-x.val;return x.kind==="pick"?1:-1;}
    const px=x.player,py=y.player;
    switch(key){
      case "age":return px.age-py.age;
      case "ovr":return py.ovr-px.ovr;
      case "pot":return py.pot-px.pot;
      case "pos":return px.pos.localeCompare(py.pos)||py.ovr-px.ovr;
      default:return y.val-x.val;
    }});
  return a;
}
function sortSelect(side){const v=side==="mine"?(_custom.sortMine||"val"):(_custom.sortOpp||"val");
  return `<select onchange="setSort('${side}',this.value)" style="padding:3px 6px;font-size:11px">${
    [["val","Trade Value"],["ovr","Overall"],["pot","Ceiling"],["age","Age"],["pos","Position"]]
    .map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>Sort: ${l}</option>`).join("")}</select>`;}
function setSort(side,v){if(side==="mine")_custom.sortMine=v;else _custom.sortOpp=v;
  document.getElementById('builder').innerHTML=renderBuilder();}
function builderRow(a,side){
  const sel=(side==="give"?_custom.giveIds:_custom.getIds).has(a.aid);
  const bg=sel?(side==="give"?'background:rgba(239,106,106,.10)':'background:rgba(84,214,138,.10)'):'';
  return `<tr style="${bg}"><td>${assetLabel(a)}</td><td class="num">${a.val}</td>
    <td class="num"><button class="btn sm ${sel?'':'ghost'}" onclick="togId('${side}','${a.aid}')">${sel?'✓':'＋'}</button></td></tr>`;
}
function renderBuilder(){
  if(!_custom.partner)_custom.partner=pick(G.ai);
  if(!_custom.opts)_custom.opts=buildPartnerAssets(_custom.partner);
  const mine=myTradeableAssets();_builderMine=mine;
  const give=mine.filter(a=>_custom.giveIds.has(a.aid));
  const get=_custom.opts.filter(a=>_custom.getIds.has(a.aid));
  const gv=give.reduce((s,a)=>s+a.val,0),gt=get.reduce((s,a)=>s+a.val,0);
  const ok=gt>0&&gv>=gt*0.95;
  const box=`<div class="panel2" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px">
     <div class="grid2">
       <div><div class="small give" style="font-weight:700">▼ YOU SEND &nbsp;<span class="give">${gv}</span></div>
         ${give.length?give.map(a=>`<div class="small" style="margin-top:3px">${assetLabel(a)} <span style="cursor:pointer;color:var(--red)" onclick="togId('give','${a.aid}')">✕</span></div>`).join(""):'<div class="small muted">— nothing selected —</div>'}</div>
       <div><div class="small get" style="font-weight:700">▲ YOU RECEIVE &nbsp;<span class="get">${gt}</span></div>
         ${get.length?get.map(a=>`<div class="small" style="margin-top:3px">${assetLabel(a)} <span style="cursor:pointer;color:var(--red)" onclick="togId('get','${a.aid}')">✕</span></div>`).join(""):'<div class="small muted">— nothing selected —</div>'}</div>
     </div>
     <div style="text-align:center;margin-top:8px"><span class="pill ${ok?'green':'red'}">${ok?'✓ They accept this':'✗ They reject — your package is light'}</span></div></div>`;
  return `<div class="row" style="align-items:center;margin-bottom:6px">
     <div style="flex:1">Partner: <select onchange="setPartner(this.value)">${G.ai.map(t=>`<option ${t.id===_custom.partner.id?'selected':''} value="${t.id}">${t.name}</option>`).join("")}</select></div>
   </div>
   ${box}
   <div class="grid2">
     <div><div class="row" style="align-items:center;margin-bottom:4px"><span class="small give" style="flex:1">Your assets (click ＋)</span>${sortSelect("mine")}</div>
       <div class="scroll"><table><tbody>${sortAssets(mine,_custom.sortMine||"val").map(a=>builderRow(a,"give")).join("")}</tbody></table></div></div>
     <div><div class="row" style="align-items:center;margin-bottom:4px"><span class="small get" style="flex:1">${_custom.partner.name} assets</span>${sortSelect("opp")}</div>
       <div class="scroll"><table><tbody>${sortAssets(_custom.opts,_custom.sortOpp||"val").map(a=>builderRow(a,"get")).join("")}</tbody></table></div></div>
   </div>
   <div style="margin-top:10px"><button class="btn primary" ${ok?'':'disabled'} onclick="proposeCustom()">Propose trade</button>
     <button class="btn ghost" onclick="clearTrade()">Clear</button></div>`;
}
function setPartner(tid){_custom.partner=G.ai.find(t=>t.id===tid);_custom.getIds=new Set();_custom.opts=null;
  document.getElementById('builder').innerHTML=renderBuilder();}
function togId(side,aid){const set=side==="give"?_custom.giveIds:_custom.getIds;
  if(set.has(aid))set.delete(aid);else set.add(aid);
  document.getElementById('builder').innerHTML=renderBuilder();}
function clearTrade(){_custom.giveIds=new Set();_custom.getIds=new Set();
  document.getElementById('builder').innerHTML=renderBuilder();}
function proposeCustom(){
  const mine=myTradeableAssets();
  const give=mine.filter(a=>_custom.giveIds.has(a.aid));
  const get=_custom.opts.filter(a=>_custom.getIds.has(a.aid));
  const gv=give.reduce((s,a)=>s+a.val,0),gt=get.reduce((s,a)=>s+a.val,0);
  if(gt<=0||gv<gt*0.95){toast("They reject that package");return;}
  give.forEach(giveAsset);get.forEach(getAsset);
  const nm=_custom.partner.name;
  _custom={giveIds:new Set(),getIds:new Set(),partner:null,opts:null};
  toast(`Trade with ${nm} complete`);screenTrade();
}

/* ============================================================
   PHASE 1 — ROSTER (9 / 4 / 3)
   ============================================================ */
function screenRoster(){
  const a=buildActive(G.roster);
  const proj=warToWins(teamWAR(G.roster));
  const benchBats=G.roster.filter(p=>p.loc==="mlb"&&isHit(p)&&!a.used.has(p.id)).sort((x,y)=>y.ovr-x.ovr);
  const benchSP=G.roster.filter(p=>p.loc==="mlb"&&p.pos==="SP"&&!a.rotation.includes(p)).sort((x,y)=>y.ovr-x.ovr);
  const benchRP=G.roster.filter(p=>p.loc==="mlb"&&p.pos==="RP"&&!a.pen.includes(p)).sort((x,y)=>y.ovr-x.ovr);
  render(`${header()}${stepbar(1)}
   <div class="grid3">
     <div class="kpi"><div class="big">${proj}</div><div class="lbl">Projected Wins</div></div>
     <div class="kpi"><div class="big">${G.farm.length}</div><div class="lbl">Farm Prospects</div></div>
     <div class="kpi"><div class="big">$${payroll(G.roster)}M</div><div class="lbl">Payroll</div></div>
   </div>
   <div class="panel">
     <p class="sub">Your <b>9 starters, 4 starting pitchers, and 3 relievers</b> determine how you play. Empty slots are filled by replacement-level scrubs (and it shows). The rest of the 26-man is roster filler you don't manage.</p>
     <div class="sectlbl">Lineup (9)</div>
     <table><tbody>${LINEUP.map(s=>slotRow(s,a.lineup[s])).join("")}</tbody></table>
     <div class="sectlbl">Rotation (4 SP)</div>
     <table><tbody>${[0,1,2,3].map(i=>pitRow("SP",a.rotation[i])).join("")}</tbody></table>
     <div class="sectlbl">Bullpen (3 RP)</div>
     <table><tbody>${[0,1,2].map(i=>pitRow("RP",a.pen[i])).join("")}</tbody></table>
   </div>
   ${(benchBats.length+benchSP.length+benchRP.length)?`<div class="panel">
     <div class="sectlbl" style="margin-top:0">Bench / depth (cover injuries; extend or trade)</div>
     <table><tbody>${[...benchBats,...benchSP,...benchRP].map(p=>depthRow(p)).join("")}</tbody></table></div>`:""}
   <div class="panel">
     <h3>⬆️ Farm system</h3>
     <p class="sub">Promote prospects when ready (≈62+ OVR contributes). Ceiling is a scouted projection — not every prospect reaches it.</p>
     <div class="scroll">${farmTable()}</div>
   </div>
   <div class="center" style="margin-top:14px"><button class="btn primary" onclick="goPhase(2)">Lock roster → Play ⚾</button></div>`);
}
function contractCell(p){return `<span class="yrs ${p.years<=1?'exp':'muted'}">$${p.salary}M • ${p.years}yr${p.years<=1?' ⚠':''}</span>`;}
function slotRow(slot,p){
  if(!p)return `<tr><td><span class="pos">${slot}</span> <span class="empty">— replacement level —</span></td><td class="num"></td><td class="num"></td><td></td></tr>`;
  return `<tr><td><span class="pos">${slot}</span> ${p.name} <span class="small muted">${p.pos}, age ${p.age}${p.inj?' • 🩹inj':''}</span></td>
    <td class="num ovr ${ovrClass(p.ovr)}">${p.ovr}</td><td class="num">${contractCell(p)}</td>
    <td class="num">${p.years<=2?`<button class="btn sm" onclick="extend('${p.id}');screenRoster()">Extend</button>`:''}</td></tr>`;
}
function pitRow(role,p){
  if(!p)return `<tr><td><span class="pos">${role}</span> <span class="empty">— replacement level —</span></td><td class="num"></td><td class="num"></td><td></td></tr>`;
  return `<tr><td><span class="pos">${role}</span> ${p.name} <span class="small muted">age ${p.age}${p.inj?' • 🩹inj':''}</span></td>
    <td class="num ovr ${ovrClass(p.ovr)}">${p.ovr}</td><td class="num">${contractCell(p)}</td>
    <td class="num">${p.years<=2?`<button class="btn sm" onclick="extend('${p.id}');screenRoster()">Extend</button>`:''}</td></tr>`;
}
function depthRow(p){return `<tr><td><span class="pos">${p.pos}</span> ${p.name} <span class="small muted">age ${p.age}</span></td>
  <td class="num ovr ${ovrClass(p.ovr)}">${p.ovr}</td><td class="num">${contractCell(p)}</td>
  <td class="num"><button class="btn sm" onclick="sendDown('${p.id}')">↓Farm</button></td></tr>`;}
function farmTable(){
  if(!G.farm.length)return `<p class="muted">Empty. Trade for prospects and draft to fill it.</p>`;
  return `<table><thead><tr><th>Prospect</th><th class="num">Age</th><th class="num">OVR</th><th class="num">Ceil</th><th></th></tr></thead><tbody>${
    G.farm.sort((a,b)=>b.pot-a.pot).map(p=>`<tr>
      <td><span class="pos">${p.pos}</span> ${p.name}${p.college?` <span class="small muted">(${p.college})</span>`:''}</td>
      <td class="num">${p.age}</td><td class="num ovr ${ovrClass(p.ovr)}">${p.ovr}</td>
      <td class="num"><span class="pill ${ceilClass(p.pot)}">${p.pot}</span></td>
      <td class="num"><button class="btn sm ${p.ovr>=62?'primary':''}" onclick="promote('${p.id}')">Promote ↑</button></td></tr>`).join("")}</tbody></table>`;
}
function promote(pid){const p=G.farm.find(x=>x.id===pid);if(!p)return;G.farm=G.farm.filter(x=>x.id!==pid);
  p.loc="mlb";if(p.years<2)p.years=6;G.roster.push(p);toast(`${p.name} called up!`);screenRoster();}
function sendDown(pid){const p=G.roster.find(x=>x.id===pid);if(!p)return;G.roster=G.roster.filter(x=>x.id!==pid);
  p.loc="farm";G.farm.push(p);toast(`${p.name} sent down`);screenRoster();}

/* ============================================================
   PHASE 2 — SEASON
   ============================================================ */
let _res=null;
function screenSeason(){
  render(`${header()}${stepbar(2)}
   <div class="panel center"><h3>Season ${G.year}</h3>
     <p class="sub">Roster locked. Play 162 games.</p>
     <button class="btn primary" style="font-size:16px;padding:14px 26px" onclick="doSeason()">▶ Simulate Season</button></div>`);
}
function doSeason(){_res=simulateSeason();saveGame();showResult();}
function showResult(){
  const r=_res,me=r.me,last=G.year>=6;
  const verdict=r.wonWS?'🏆 WORLD SERIES CHAMPIONS!!!':r.me.seed<=8?'🎉 Made the playoffs!':
    me.wins<=70?'📉 Rough year — but hello, top pick.':'Season complete.';
  const stand=G.standings.map(e=>`<tr style="${e.me?'background:rgba(245,196,81,.10)':''}">
     <td class="num">${e.seed}</td><td>${e.me?'<b>'+e.name+'</b> ⬅':e.name}</td>
     <td class="num">${e.wins}</td><td class="num">${e.losses}</td>
     <td>${e.seed<=8?'<span class="pill green">PO</span>':''}${r.champ&&r.champ.name===e.name?' <span class="pill gold">WS</span>':''}</td></tr>`).join("");
  render(`${header()}${stepbar(2)}
   <div class="panel center"><h2 style="${r.wonWS?'color:var(--gold)':''}">${verdict}</h2>
     <div class="grid3" style="margin-top:8px">
       <div class="kpi"><div class="big">${me.wins}-${me.losses}</div><div class="lbl">Record</div></div>
       <div class="kpi"><div class="big">#${me.seed}</div><div class="lbl">League Rank /16</div></div>
       <div class="kpi"><div class="big">#${r.mySlot}</div><div class="lbl">Next Draft Pick</div></div></div>
     ${r.tax>0?`<p class="small" style="color:var(--red);margin-top:8px">💸 Luxury tax: payroll over $300M cost you ${r.tax} win${r.tax>1?'s':''} this season.</p>`:''}
     ${r.injured.length?`<p class="small muted" style="margin-top:4px">Injuries: ${r.injured.map(p=>p.name).join(", ")}</p>`:''}</div>
   <div class="panel"><h3>Final Standings</h3>
     <div class="scroll"><table><thead><tr><th class="num">#</th><th>Team</th><th class="num">W</th><th class="num">L</th><th></th></tr></thead><tbody>${stand}</tbody></table></div></div>
   <div class="center">${last?`<button class="btn primary" onclick="endGame()">See your 6-year legacy →</button>`
     :`<button class="btn primary" onclick="goPhase(3)">To the Draft →</button>`}</div>`);
}

/* ============================================================
   PHASE 3 — DRAFT
   ============================================================ */
const POSALL=["C","1B","2B","3B","SS","LF","CF","RF","DH","SP","SP","RP"];
let _dq=null,_dpicks=null,_board=null;
function screenDraft(){
  if(!_dq){_dq=[...G.ownedPicks].sort((a,b)=>(a.round-b.round)||(pickResolvedSlot(a)-pickResolvedSlot(b)));_dpicks=[];}
  if(!_dq.length)return draftDone();
  const pk=_dq[0],slot=pickResolvedSlot(pk),rd=pk.round||1;
  const advChance=rd>=3?(G.year>=4?0.75:0.5):rd===2?(G.year>=4?0.6:0.3):(G.year>=4?0.5:G.year===3?0.25:0.08);
  const ps=[...POSALL];for(let i=ps.length-1;i>0;i--){const j=ri(0,i);[ps[i],ps[j]]=[ps[j],ps[i]];}
  _board=[];for(let i=0;i<10;i++)_board.push(draftee(slot+ri(0,2),rd,Math.random()<advChance,ps[i%ps.length]));
  render(`${header()}${stepbar(3)}
   <div class="panel"><h3>Draft — <span class="pill gold">Round ${rd}</span> pick #${slot} <span class="small muted">(${_dq.length} selection${_dq.length>1?'s':''} left)</span></h3>
     <p class="sub">Ceiling is a <b>scouted projection, not a promise</b> — most prospects fall short of it. ${rd===1?'Round-1 talents have the highest ceilings but take years.':'Later-round picks are longer shots; "MLB-ready" types contribute sooner.'}</p>
     <div class="scroll">${_board.map((p,i)=>`<div class="offer" style="padding:9px 12px"><div class="row" style="align-items:center">
        <div style="flex:2"><b>${p.name}</b> <span class="small muted">${p.college}</span>
          <span class="small"><span class="pos">${p.pos}</span> age ${p.age} • ${p.ovr} OVR ${p.advanced?'<span class="pill green" style="padding:0 6px">MLB-ready</span>':'<span class="pill blue" style="padding:0 6px">project</span>'}</span></div>
        <div style="flex:1;text-align:right"><span class="pill ${ceilClass(p.pot)}">Ceiling ${p.pot}</span>
          <button class="btn primary sm" onclick="draftPick(${i})">Draft</button></div></div></div>`).join("")}</div></div>`);
}
function draftPick(i){const p=_board[i];p.loc="farm";p.src="draft";G.farm.push(p);_dpicks.push(p);_dq.shift();
  toast(`Drafted ${p.name}`);screenDraft();}
function draftDone(){
  const got=_dpicks||[];G.ownedPicks=freshDraftPicks();_dq=null;_dpicks=null;saveGame();
  render(`${header()}${stepbar(3)}
   <div class="panel center"><h3>Draft complete</h3>
     ${got.length?`<p>Added to your farm:</p><ul style="display:inline-block;text-align:left">${got.map(p=>`<li>${p.name} — ${p.advanced?'MLB-ready':'ceiling '+p.pot}</li>`).join("")}</ul>`:`<p class="muted">No picks (traded away).</p>`}</div>
   <div class="center"><button class="btn primary" onclick="goPhase(4)">Offseason development →</button></div>`);
}

/* ============================================================
   PHASE 4 — DEVELOP / AGE
   ============================================================ */
function screenDevelop(){
  const res=developAll();saveGame();
  render(`${header()}${stepbar(4)}
   <div class="panel"><h3>The year turns…</h3>
     ${res.fa.length?`<p class="small" style="color:var(--red)">🚶 Left in free agency (expired contracts): ${res.fa.map(p=>p.name).join(", ")}</p>`:''}
     ${res.notes.length?`<ul>${res.notes.slice(0,12).map(n=>`<li>${n}</li>`).join("")}</ul>`:'<p class="muted">A quiet development year.</p>'}
     ${res.retired.length?`<p class="small muted">Retired: ${res.retired.map(p=>p.name).join(", ")}</p>`:''}</div>
   <div class="center"><button class="btn primary" onclick="nextYear()">Begin Year ${G.year+1} →</button></div>`);
}
function nextYear(){G.year++;G.phase=0;G.tradeTries=3;_offers=null;_custom=null;saveGame();goPhase(0);}

/* ============================================================
   END GAME
   ============================================================ */
function computeGrade(){
  const h=G.history;
  const early=h.filter(x=>x.year<=2),late=h.filter(x=>x.year>=4);
  const earlyAvg=early.length?early.reduce((s,x)=>s+x.wins,0)/early.length:81;
  const peakLate=Math.max(0,...late.map(x=>x.wins));
  const mlb=G.roster.filter(p=>p.loc==="mlb");
  const coreYoung=mlb.filter(p=>p.age<=27&&p.ovr>=80).length;
  const farmQ=G.farm.filter(p=>Math.min(p.realCeil||p.pot,p.pot)>=84).length;
  const windowYears=clamp(round(coreYoung*0.9+farmQ*0.6),0,8);
  const contrib=mlb.filter(p=>p.ovr>=74);
  const hg=contrib.filter(p=>p.src==="draft").length;
  const acq=contrib.filter(p=>p.src==="fa"||p.src==="trade").length;
  const faCount=contrib.filter(p=>p.src==="fa").length;
  const hgRatio=(hg+acq)>0?hg/(hg+acq):0;
  const a=buildActive(G.roster);let holes=0;
  LINEUP.forEach(s=>{const p=a.lineup[s];if(!p||p.ovr<66)holes++;});
  if(mlb.filter(p=>p.pos==="SP"&&p.ovr>=66).length<4)holes++;
  if(mlb.filter(p=>p.pos==="RP"&&p.ovr>=66).length<3)holes++;
  const maxPay=Math.round(G.maxPayroll||payroll(G.roster));
  const taxYears=G.taxYears||0;
  const items=[];let score=0;
  const add=(label,pts)=>{items.push({label,pts});score+=pts;};
  let pk=peakLate>=105?32:peakLate>=100?28:peakLate>=95?23:peakLate>=90?17:peakLate>=85?11:peakLate>=80?6:peakLate>=75?2:0;
  add(`Peak of ${peakLate} wins in your contention window`,pk);
  if(G.champions>0)add(`${G.champions} World Series title${G.champions>1?'s':''}`,Math.min(36,G.champions*19));
  if(G.playoffApps>0)add(`${G.playoffApps} playoff appearance${G.playoffApps>1?'s':''}`,Math.min(16,G.playoffApps*4));
  else items.push({label:"Never reached the postseason",pts:0});
  let tk=earlyAvg<=66?11:earlyAvg<=70?8:earlyAvg<=75?4:0;
  if(tk)add(`Committed to the tank early (avg ${Math.round(earlyAvg)} wins, yrs 1-2)`,tk);
  else items.push({label:`Didn't truly bottom out for premium picks (avg ${Math.round(earlyAvg)} wins early)`,pts:0});
  let hgPts=(hg>=3&&hgRatio>=0.6)?15:(hg>=2&&hgRatio>=0.5)?10:hgRatio>=0.4?6:hgRatio>=0.25?3:0;
  if(hgPts)add(`Homegrown core — ${hg} drafted contributor${hg>1?'s':''} (${Math.round(hgRatio*100)}% of acquired talent)`,hgPts);
  else items.push({label:`Built mostly through trades/free agency, not the draft (${hg} homegrown)`,pts:0});
  let wPts=windowYears>=5?11:windowYears>=3?6:windowYears>=1?2:-8;
  add(`${windowYears>=5?'Wide-open':windowYears>=3?'Healthy':windowYears>=1?'Closing':'Shut'} future window (~${windowYears} yr${windowYears===1?'':'s'} ahead)`,wPts);
  let payPen=maxPay>320?-12:maxPay>280?-7:maxPay>240?-3:0;
  if(payPen)add(`Bloated payroll (peaked at $${maxPay}M)`,payPen);
  if(taxYears>0)add(`Paid the luxury tax in ${taxYears} season${taxYears>1?'s':''} (−${G.taxWinsLost||0} wins)`,Math.max(-8,-taxYears*2));
  if(faCount>=3)add(`Leaned on free-agent signings (${faCount})`,Math.max(-6,-(faCount-2)*2));
  if(holes>0)add(`${holes} hole${holes>1?'s':''} left in the everyday roster`,Math.max(-8,-holes*2));
  score=clamp(round(score),0,100);
  const grade=score>=90?'A+':score>=80?'A':score>=72?'A-':score>=63?'B':score>=53?'C':score>=42?'D':'F';
  let blurb;
  if(G.champions>=1&&peakLate>=100&&hgRatio>=0.5)blurb="The blueprint, executed to perfection — you tanked, drafted a homegrown core, and raised a banner. Front-office legend.";
  else if(G.champions>=1)blurb="You brought home a title. However you got there, the ring is the ring.";
  else if(peakLate>=95)blurb="You built a contender and knocked on the door — just couldn't break through in October.";
  else if(earlyAvg<=72&&peakLate<88)blurb="You tore it down but the rise never fully arrived. Too many picks missed, or you sold the future too cheap.";
  else blurb="A middling six years — never bad enough to stock elite picks, never good enough to truly contend.";
  const winTxt=windowYears>=5?"wide open":windowYears>=3?"open":windowYears>=1?"closing":"shut";
  return {score,grade,blurb,items,windowYears,winTxt,hg,maxPay};
}
function endGame(){
  const h=G.history;
  const {score,grade,blurb,items,windowYears,winTxt,hg,maxPay}=computeGrade();
  render(`<div class="hero"><div class="pill gold">FRONT-OFFICE REVIEW</div>
     <h1 style="font-size:60px;margin:6px 0;color:var(--gold)">${score}<span style="font-size:26px;color:var(--dim)">/100</span> &nbsp;${grade}</h1>
     <p class="sub" style="max-width:600px;margin:0 auto">${blurb}</p></div>
   <div class="panel"><h3>Why you scored ${score}</h3>
     <table><tbody>${items.map(it=>`<tr><td>${it.label}</td>
       <td class="num" style="color:${it.pts>0?'var(--green)':it.pts<0?'var(--red)':'var(--dim)'};font-weight:700">${it.pts>0?'+':''}${it.pts}</td></tr>`).join("")}</tbody></table>
     <p class="sub" style="margin-top:8px">Your window heading forward is <b style="color:var(--ink)">${winTxt}</b> — about ${windowYears} more competitive year${windowYears===1?'':'s'} of young, controllable talent.</p></div>
   <div class="grid4" style="margin-top:4px">
     <div class="kpi"><div class="big">${G.champions}</div><div class="lbl">World Series</div></div>
     <div class="kpi"><div class="big">${G.bestWins}</div><div class="lbl">Peak Wins</div></div>
     <div class="kpi"><div class="big">${hg}</div><div class="lbl">Homegrown Core</div></div>
     <div class="kpi"><div class="big">$${maxPay}M</div><div class="lbl">Peak Payroll</div></div></div>
   <div class="panel"><h3>Your 6-Year Timeline</h3>
     <table><thead><tr><th>Season</th><th class="num">Record</th><th class="num">Rank</th><th>Result</th></tr></thead><tbody>${
       h.map(x=>`<tr><td>Year ${x.year}</td><td class="num">${x.wins}-${x.losses}</td><td class="num">#${x.seed}</td>
         <td>${x.champ?'<span class="pill gold">🏆 WS</span>':x.playoffs?'<span class="pill green">Playoffs</span>':'<span class="muted">—</span>'}</td></tr>`).join("")}</tbody></table></div>
   <div class="center" style="margin-top:8px"><button class="btn primary" onclick="(function(){localStorage.removeItem(SAVE);screenTitle();})()">New Franchise</button></div>
   <p class="disclaimer">Unofficial fan-made prototype • not affiliated with MLB/MLBPA • all data fictional.</p>`);
}

/* boot */
screenTitle();
</script>
</body>
</html>
