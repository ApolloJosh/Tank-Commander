<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tank Commander">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tank Commander — Baseball Rebuild GM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c06; --panel:#161a10; --panel2:#1f2616; --line:#333b22; --line2:#4a5330;
    --ink:#eef2e2; --dim:#9aa17f; --gold:#bdee3c; --green:#9bd84a;
    --red:#ff6a55; --blue:#9fb0c8; --amber:#e6b24a;
    --disp:'Chakra Petch','Oswald',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);overscroll-behavior:none;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
    background-color:#070903;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% -8%, rgba(120,150,50,.10), transparent 62%),
      radial-gradient(ellipse 50% 40% at 12% 110%, rgba(40,54,22,.22), transparent 60%);
    background-attachment:fixed;
    font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;font-size:15px}
  .disp,h1,h2,h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em}
  body{overflow-x:clip}
  #app{max-width:1060px;margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  input,textarea,select{-webkit-user-select:text;user-select:text}
  .pcard.tapsel{outline:2px solid var(--gold);outline-offset:1px}
  .slot.tapok,.benchzone.tapok{border-color:var(--gold)!important;border-style:solid!important;background:rgba(245,196,81,.10)}
  h1,h2,h3{margin:0 0 8px;line-height:1.2}
  h1{font-size:30px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-top-color:var(--line2);border-radius:6px;padding:16px;margin:12px 0}
  .panel2{background:var(--panel2)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 10px;border-bottom:2px solid var(--line2);margin-bottom:12px}
  .brandlogo{height:22px;display:block}
  .topbar-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .fid{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.01em;font-size:24px;line-height:1.05}
  .fmeta{font-family:var(--disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  .btn{display:inline-block;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);
    border-radius:3px;padding:9px 15px;cursor:pointer;font-size:13px;font-weight:600;transition:.12s;
    font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn:active{transform:translateY(1px) scale(.985)}
  .tpitch-row{display:flex;gap:10px;align-items:flex-start;margin:9px 0;line-height:1.4}
  .tpitch-row .ic{font-size:22px;line-height:1.2;flex-shrink:0}
  .tnote summary::-webkit-details-marker{display:none}
  .tmi:active{transform:translateX(2px)}
  @keyframes scrIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .scr-in{animation:scrIn .17s ease-out}
  @media (prefers-reduced-motion:reduce){.scr-in{animation:none}}
  .btn.primary{background:var(--gold);color:#0e1a02;border-color:var(--gold)}
  .btn.primary:hover{filter:brightness(1.07);color:#0e1a02}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 11px;font-size:11.5px;border-radius:2px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10.5px;font-weight:700;
    font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;
    background:var(--panel2);border:1px solid var(--line)}
  .pill.gold{background:rgba(166,255,43,.15);border-color:var(--gold);color:var(--gold)}
  .pill.green{background:rgba(118,232,63,.14);border-color:var(--green);color:var(--green)}
  .pill.red{background:rgba(239,106,106,.13);border-color:var(--red);color:var(--red)}
  .pill.blue{background:rgba(163,196,110,.15);border-color:var(--blue);color:var(--blue)}
  .pill.bdiamond{background:linear-gradient(135deg,#dff6ff,#7fd0ff,#bfe9ff,#eaffff);background-size:200% 200%;
    color:#06212e;border-color:#bfeaff;font-weight:800;text-shadow:0 0 3px rgba(255,255,255,.6);animation:shimmer 3s linear infinite}
  .pill.irid{background:linear-gradient(90deg,#ff7ab8,#ffd36b,#7bf0a0,#6bd5ff,#c79bff,#ff7ab8);background-size:300% 100%;
    color:#1a1030;border-color:#fff;font-weight:800;text-shadow:0 0 3px rgba(255,255,255,.5);animation:irid 4s linear infinite}
  .ovr.bdiamond{background:linear-gradient(135deg,#dff6ff,#7fd0ff,#bfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .ovr.irid{background:linear-gradient(90deg,#ff7ab8,#ffd36b,#7bf0a0,#6bd5ff,#c79bff,#ff7ab8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;animation:irid 4s linear infinite}
  @keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes irid{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-family:var(--disp)}
  tr:hover td{background:rgba(255,255,255,.02)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--dim)}
  .ovr{font-weight:800;font-variant-numeric:tabular-nums}
  .ovr.elite{color:var(--gold)} .ovr.good{color:var(--green)} .ovr.avg{color:var(--ink)} .ovr.low{color:var(--dim)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-top-color:var(--line2);border-radius:4px;padding:12px;text-align:center}
  .kpi .big{font-size:24px;font-weight:700;font-family:var(--disp)}
  .kpi .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-family:var(--disp);margin-top:3px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#11140b;color:var(--ink);border:1px solid var(--line2);border-left:3px solid var(--gold);
    padding:10px 16px;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:50;font-weight:600;max-width:90%;font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:13px}
  .center{text-align:center}
  .small{font-size:12.5px}
  .scroll{max-height:360px;overflow:auto}
  .disclaimer{font-size:11px;color:#6c7c90;border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
  .hero{background:#0d1107;
    border:1px solid var(--line2);border-radius:8px;padding:30px 24px;text-align:center}
  .stepbar{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
  .step{flex:1;min-width:88px;text-align:center;font-size:10.5px;padding:7px 4px;border-radius:2px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em}
  .step.on{border-color:var(--gold);color:var(--gold);font-weight:700}
  .step.done{border-color:var(--green);color:var(--green)}
  select,input{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);
    border-radius:3px;padding:8px 10px;font-size:14px;font-family:inherit}
  .offer{border:1px solid var(--line);border-top-color:var(--line2);border-radius:4px;padding:12px;margin:8px 0;background:var(--panel2)}
  .pos{display:inline-block;min-width:30px;font-weight:700;color:var(--blue);font-size:12px;font-family:var(--disp)}
  .sectlbl{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin:14px 0 4px;font-weight:700;font-family:var(--disp)}
  .empty{color:var(--red);font-style:italic}
  .give{color:var(--red)} .get{color:var(--green)}
  .yrs{font-size:11px}
  .yrs.exp{color:var(--red);font-weight:700}
  @media(max-width:680px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}h1{font-size:24px}}
  .tbrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border:0.5px solid var(--line);border-radius:4px;margin-bottom:6px;background:var(--panel2)}
  .tbadge{width:42px;height:42px;border-radius:3px;background:#0e120a;border:0.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
  .tbadge .o{font-size:18px;font-weight:800}
  .tbadge .c{font-size:9px;color:var(--green)}
  .tbval{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700;min-width:26px;text-align:right;font-size:15px}
  .add{border:0.5px solid var(--line2);color:var(--gold);background:transparent;border-radius:3px;width:28px;height:28px;cursor:pointer;flex-shrink:0;font-size:16px;line-height:1}
  .add.in{background:rgba(189,238,60,.13)}
  .aemo{font-size:11px;padding:1px 5px;border-radius:3px;margin-right:3px;border:0.5px solid var(--line);white-space:nowrap}
  .aemo.s{background:rgba(189,238,60,.13);border-color:var(--gold);color:var(--gold)}
  .aemo.w{background:#3a1a1a;border-color:#6b2f2f;color:#ffb4b4}
  .tbchip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:3px;border:0.5px solid var(--line);color:var(--blue);margin:0 3px 4px 0;cursor:pointer;font-weight:600}
  .tbchip.on{background:rgba(189,238,60,.13);border-color:var(--gold);color:var(--gold)}
  .pkg{display:inline-flex;align-items:center;gap:6px;background:#1c2213;border:0.5px solid var(--line);border-radius:3px;padding:3px 8px;margin:0 5px 5px 0;font-size:12px}
  .slots{display:flex;flex-direction:column;gap:5px;margin:4px 0 2px}
  .slot{display:flex;align-items:center;gap:8px;min-height:38px;padding:5px 8px;border:1px dashed var(--line2);border-radius:4px;background:rgba(255,255,255,.015);transition:background .1s,border-color .1s}
  .slot.drop-ok{border-color:var(--gold);border-style:solid;background:rgba(245,196,81,.10)}
  .slotlbl{flex:0 0 34px;font-size:11px;font-weight:800;color:var(--gold);text-align:center;letter-spacing:.3px}
  .hofgold{border:1px solid #e6c84e !important;background:linear-gradient(135deg,rgba(201,162,39,.22),rgba(255,228,130,.05)) !important;box-shadow:0 0 9px rgba(201,162,39,.35)}
  .lbgrid{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:680px){.lbgrid{grid-template-columns:1fr 1fr}}
  .pctrow{display:flex;align-items:center;gap:7px;margin:4px 0}
  .pctlbl{flex:0 0 90px;font-size:12px}
  .pctval{flex:0 0 40px;font-size:11px;color:var(--dim);text-align:right}
  .pcttrack{flex:1;height:6px;border-radius:4px;background:linear-gradient(90deg,#3661ad,#b0b0b0,#d22d49);position:relative}
  .pctdot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;border:2px solid var(--panel);transform:translate(-50%,-50%)}
  .pctnum{flex:0 0 24px;text-align:center;font-size:13px;font-weight:700}
  .happyring{display:inline-flex;padding:2.5px;border-radius:7px;vertical-align:middle}
  .happyinner{display:inline-flex;align-items:center;justify-content:center;min-width:20px;padding:1px 4px;border-radius:5px;background:var(--panel)}
  .pcard{display:inline-flex;align-items:center;flex-wrap:wrap;gap:5px;padding:4px 8px;border:0.5px solid var(--line);border-radius:4px;background:var(--panel2);cursor:grab}
  .pcard:active{cursor:grabbing}
  .pcard.dragging{opacity:.4}
  .benchzone{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1px dashed var(--line2);border-radius:4px;background:rgba(255,255,255,.015)}
  .benchzone.drop-ok{border-color:var(--gold);border-style:solid;background:rgba(245,196,81,.08)}
  .favtrack{height:16px;border-radius:8px;background:#1c2213;border:1px solid var(--line);overflow:hidden}
  .favbar{height:100%;border-radius:7px;transition:width .4s ease}
  .favbar.bdiamond{background:linear-gradient(90deg,#7fd8ff,#b8eaff,#8ad0ff,#cfeeff);background-size:200% 100%;animation:favshine 2.2s linear infinite}
  .favbar.irid{background:linear-gradient(90deg,#a6ff2b,#37e0c8,#7b9bff,#ff7bd5,#a6ff2b);background-size:300% 100%;animation:favshine 2.6s linear infinite}
  @keyframes favshine{0%{background-position:0% 0}100%{background-position:200% 0}}
  .sndbtn{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));z-index:40;width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.85}
  ..savebtn{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;
    display:none;align-items:center;gap:4px;background:var(--panel2);color:var(--ink);border:1px solid var(--gold);
    border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .saveov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 14px}
  .savebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;margin:auto}
  .savecode{width:100%;height:70px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;
    font-family:monospace;font-size:11px;padding:8px;resize:vertical;word-break:break-all;-webkit-user-select:text;user-select:text}
  .modecard{transition:border-color .12s,transform .12s}
  .modecard:hover{border-color:var(--gold);transform:translateY(-1px)}
  /* ---- tap-to-reveal info dot + popover ---- */
  .idot{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border:1px solid var(--line2);border-radius:50%;color:var(--dim);font-size:10px;font-style:normal;font-weight:700;cursor:pointer;vertical-align:middle;line-height:1;font-family:var(--disp);margin-left:5px;flex-shrink:0;user-select:none}
  .idot:hover,.idot.on{border-color:var(--gold);color:var(--gold)}
  #infopop{position:absolute;z-index:70;max-width:264px;background:#11140b;border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:4px;padding:9px 11px;font-family:var(--body);font-size:12.5px;line-height:1.46;color:var(--ink);box-shadow:0 6px 22px rgba(0,0,0,.6);display:none}
  #infopop.on{display:block}
  .qbtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line2);border-radius:50%;background:var(--panel2);color:var(--dim);font-family:var(--disp);font-weight:700;font-size:14px;line-height:1;cursor:pointer;padding:0;vertical-align:middle}
  .qbtn:hover{border-color:var(--gold);color:var(--gold)}
  /* ---- World Series celebration ---- */
  #wscele{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,rgba(22,28,9,.93),rgba(4,5,1,.97))}
  #wscele .burst{position:absolute;top:-22px;border-radius:1px;opacity:.96;will-change:transform}
  @keyframes confFall{0%{transform:translateY(-12vh) rotateZ(0)}100%{transform:translateY(112vh) rotateZ(680deg)}}
  #wscele .wcard{position:relative;text-align:center;z-index:2;padding:0 18px;animation:wsPop .55s cubic-bezier(.2,1.3,.4,1)}
  @keyframes wsPop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  #wscele .ring{position:absolute;left:50%;top:46px;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:radial-gradient(circle,rgba(189,238,60,.28),transparent 62%);animation:wsHalo 2.6s ease-in-out infinite;z-index:-1}
  @keyframes wsHalo{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.12);opacity:1}}
  .wstrophy{font-size:104px;line-height:1;animation:wsShine 2.4s ease-in-out infinite}
  @keyframes wsShine{0%,100%{filter:drop-shadow(0 0 14px rgba(189,238,60,.45)) brightness(1)}50%{filter:drop-shadow(0 0 34px rgba(255,228,130,.9)) brightness(1.28)}}
  .wstitle{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700;font-size:30px;margin-top:10px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  .wssub{font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;color:var(--ink);font-size:13px;margin-top:7px}
  .wsrings{font-family:var(--disp);color:var(--amber);letter-spacing:.16em;font-size:12px;margin-top:4px}
  @media(max-width:560px){.wstrophy{font-size:78px}.wstitle{font-size:23px}}
  /* ---- reusable fixed HUD corner frame (all screens) ---- */
  #hudframe{position:fixed;inset:0;pointer-events:none;z-index:3}
  #hudframe .hc{position:fixed;width:15px;height:15px;border-color:var(--gold);opacity:.85}
  #hudframe .hc.tl{top:7px;left:7px;border-top:2px solid;border-left:2px solid}
  #hudframe .hc.tr{top:7px;right:7px;border-top:2px solid;border-right:2px solid}
  #hudframe .hc.bl{bottom:7px;left:7px;border-bottom:2px solid;border-left:2px solid}
  #hudframe .hc.br{bottom:7px;right:7px;border-bottom:2px solid;border-right:2px solid}
  /* ---- title dashboard (mockup layout) ---- */
  .tdash{border:1.5px solid var(--line2);border-radius:8px;background:var(--panel);overflow:hidden;margin-bottom:14px}
  .tdash-top{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;padding:11px 18px;border-bottom:2px solid var(--line2);background:var(--bg)}
  .tdash-top .brandlogo{height:26px;max-width:60%;object-fit:contain}
  .tdash-top-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .tdash-top-r a{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none;cursor:pointer}
  .tdash-top-r a:hover{color:var(--ink)}
  .tdash-top-r .ver{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:#5a6044}
  .tdash-grid{display:grid;grid-template-columns:240px 1fr 300px}
  .tnav{padding:20px 18px;border-right:1px solid var(--line)}
  .tnav-lab{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7d8a44;margin:16px 0 8px}
  .tnav-lab:first-child{margin-top:0}
  .tmi{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);padding:6px 0 6px 12px;border-left:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:8px}
  .tmi:hover{color:var(--ink)}
  .tmi.on{color:var(--gold);border-left-color:var(--gold)}
  .tmi .tag{font-family:var(--disp);font-size:8px;font-weight:700;letter-spacing:.1em;color:#10220a;background:#7d8a44;padding:1px 5px;border-radius:2px}
  .tmi .tag.hot{background:var(--amber);color:#3a1d04}
  .tmi.lk{opacity:.5}
  .tmi.tsub{padding-left:26px;font-size:14px;color:#8a936a}
  .tmi.tsub:hover{color:var(--ink)}
  .tnav-foot{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
  .tnav-foot .tmi{font-size:13px;color:#7e856a}
